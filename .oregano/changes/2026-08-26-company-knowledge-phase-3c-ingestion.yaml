version: 1
plan_id: company-knowledge-phase-3c-ingestion-2026-08-26
status: approved
author: codex-agent
created: 2026-08-26
title: Implement the shared durable Source ingestion pipeline
objective: >-
  Persist and deduplicate Source Events before provider access, normalize and
  enforce provider ACL evidence, validate inline and Raw Asset content, run
  bounded sanity gates, store immutable Raw Evidence, emit chained change-stream
  and processing receipts, preserve complete-watermark semantics, and implement
  governed soft deletion, restoration, purge, and legal-hold behavior through
  one provider-neutral in-memory and Postgres contract.
non_goals:
  - Extract Pages or Claims, invoke a model, synthesize answers, or promote Handbook content.
  - Activate Granola or another production provider.
  - Treat provider deletion as authorization to purge retained Company Brain evidence.
  - Permit content or an unresolved ACL to bypass quarantine.
placement: core
change_class: security
vision_principles_affected:
  - A company-independent Core
  - Human authority is explicit
  - Evidence beats claims
  - Safety cannot be weakened from a Workspace
  - The runtime is replaceable
