tests:
  - A Source Event is durable before any fetch and exact retry creates no duplicate Event, object version, Raw Asset, receipt, or change entry.
  - A reused delivery identity or provider object version with changed canonical content fails closed.
  - Unknown or conflicting external ACL mappings produce administrator-only quarantine and never model-ready evidence.
  - Deny entries survive normalization and derived policy never widens its Source root.
  - Invalid digest, media, size, encoding, credential, repetition, or prompt-injection content is rejected or quarantined before later processing.
  - Partial or failed batches do not advance a completed cursor or watermark.
  - Provider deletion marks absence without purging retained evidence.
  - Authorized soft deletion has a dependency preview, 72-hour restoration window, legal-hold block, scheduled purge, and payload-free receipts.
  - Change-stream entries form one deterministic integrity chain and contain no protected payload.
  - The additive database manifest remains idempotent and prior manifest identities remain immutable.
documentation_impact:
  required: true
  affected_documents:
    - architecture.company-instance
    - architecture.boundaries
    - onboarding.index
    - onboarding.company-workspace
    - specification.company-instance-release-promotion-v0.1
    - specification.company-knowledge-v0.2
    - status.current
    - command.setup
    - command.verify-live
migration: >-
  Add an immutable additive companyos-postgres manifest successor containing
  Source Events, ACL snapshots, pipeline receipts, watermarks, lifecycle
  requests, and the Knowledge change stream. Preserve all prior Source,
  envelope, Raw Asset, policy, and manifest rows. Existing V1 paths remain
  readable until Phase 3D routes them through the new pipeline.
rollback: >-
  Stop accepting or leasing new V2 Source Events and retain every event,
  object version, ACL snapshot, receipt, change entry, lifecycle request, and
  prior manifest. Continue serving only previously qualified authorized
  Knowledge paths; never fall back to provider-specific direct ingestion.
open_decisions:
  - Qualify a maintained external Raw Asset adapter before enabling source objects larger than the configured inline database boundary.
