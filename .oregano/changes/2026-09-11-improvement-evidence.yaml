architecture:
  placement:
    core: Extend required historical evidence reads and selected context access over existing
      stores/adapters, retaining scope, provenance, coverage and exact original-action links. The
      evidence capability serves any explicitly granted Agent/Tool under its trusted invocation
      scope. Reuse existing communication/effect controls; no new cross-run notification admission
      or finding subsystem. Physical retrieval remains behind adapters.
    packages: No new Package or Blueprint initially. Extract demonstrated shared components after a
      second and third application.
    workspace: Single process target, ordinary Improvement Agent, explicitly selected review Workflow,
      fixed context references, Company Tools, general Skill and concise report template. Business
      event meaning, metric calculation, prior-report/feedback comparison and human responsibility
      remain here. The Skill waits for a running change's outcome before the next intervention for
      the same goal; the accepted proposal defines its evaluation period. Specialist Agents keep
      operating their processes.
    instance: Exact resource/recipient bindings, activation, existing source/run/effect state, linked
      human feedback/decisions, existing dispatch receipts, Builder jobs, releases and outcome
      evidence. Qualify existing operations monitoring, review-health thresholds and responsible
      alert routing without depending on successful Agent generation. No new evidence or case
      database.
  mechanisms_extended:
    - mechanism: capability-contracts-and-connectors
      reason: Expose only required retained evidence with provenance and coverage; qualify fixed compiled
        context and bounded prior-run/reference reads. Capture missing message/reply/Build relations
        in existing outputs only where needed, without a new relationship registry.
    - mechanism: identity-and-authorization
      reason: Apply existing Agent/Tool grants and current governance permissions to generic evidence
        reads, narrowed by trusted invocation/workflow scope.
    - mechanism: company-records
      reason: Expose bounded retained observations through the existing source policy and immutable
        storage generation; do not claim complete provider event history.
  new_core_mechanisms:
    - Generic bounded evidence-read contract over existing stores and qualified adapters, including
      exact retained action links; no new source registry, finding store or notification mechanism.
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Any explicitly granted Agent/Tool can use the same authorized evidence reads
    within its invocation scope. Goals, business event meaning, metric calculation and report
    relevance remain in Workspace declarations and Company Tools/Skills; physical storage and
    provider details stay behind Core adapters. The Improvement Agent is the first consumer, not a
    privileged owner. Existing run/action references connect reports, feedback and outcomes.
rollback: Disable new review openings and restore the prior paired Core/Workspace Artifact. Remove
  the evidence grants and binding when no retained run needs them. Keep feedback, decisions and
  effects; no database migration or external-effect compensation is implied.
open_decisions:
  - Qualify complete entry and period history before numerical business scoring; the installed
    source supports an explicit not-measurable baseline.
  - Qualify real recipient delivery, the independent operations monitor and its alert route before
    unattended activation.
  - The responsible human separately approves the first actual intervention and exact release;
    verify its activation and agreed exposure before outcome assessment.
