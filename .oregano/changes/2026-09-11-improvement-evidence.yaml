version: 3
plan_id: improvement-evidence-2026-09-11
created: 2026-09-11
title: Implement scoped historical evidence for the first improvement review
objective: Implement bounded evidence.query reads over retained workflow outcomes, decisions,
  communication effects and Records versions with current grants, trusted invocation scope and
  explicit coverage. Supply selected Artifact materials and preserve attributable feedback in
  existing events. Expose review health through the authenticated operator path independently of the
  model. The private Workspace owns the metric, Skill and review workflow.
non_goals:
  - Activate an Instance, deploy, send business messages or change a live process.
  - Add a second workflow engine, scheduler, roster, approval system or knowledge database.
  - Add a new Core agent type, Blueprint, general improvement-case type, evidence source registry or
    storage subsystem for the pilot.
  - Automatically discover every process or grant the reviewer unrestricted cross-process access.
  - Add an optional notification-check Tool, separate notification Agent or parallel delivery
    service.
  - Require universal evidence federation, automatic context discovery, snooze/reminder scheduling
    or a new aggregate message-limit engine for the first pilot.
  - Add a new finding ID/store, cross-run notification identity/reservation or structured
    change-detection engine for the pilot.
  - Add a general measurement YAML interpreter or hardcode process event meanings in Core.
  - Publish real company content, identities, private evidence or provider credentials.
  - Grant coding workers release authority or infer human approval from agent output.
