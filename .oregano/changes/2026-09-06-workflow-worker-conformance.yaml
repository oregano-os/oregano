architecture:
  placement:
    core: Reuse the generic engine, execution store, timer leases and Runtime receipts.
    packages: No Package or Connector changes.
    workspace: All example graphs and company assertions stay in fictional fixture assets.
    instance: Memory and mandatory Postgres tests retain real engine state with synthetic providers.
  mechanisms_extended:
    - mechanism: timers-and-business-time
      reason: Verify retry, duplicate completion and expired claims through actual persisted workflow waits.
    - mechanism: approvals-effects-and-idempotency
      reason: Prove concurrent progress and publication receipt ordering through the existing engine.
