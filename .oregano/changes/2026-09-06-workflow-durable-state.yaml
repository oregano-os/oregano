architecture:
  placement:
    core: Owns immutable Artifact identities, generic run state, leases, assignments and cancellation fencing.
    packages: No business execution or new Package authority is introduced.
    workspace: Supplies the compiled process and policy; cannot mutate execution state.
    instance: Holds retained run data, exact authenticated assignments and the additive database migration.
  mechanisms_extended:
    - mechanism: approvals-effects-and-idempotency
      reason: Reuse workflow_runs, events and effect claims; fence actual dispatch against execution state.
    - mechanism: timers-and-business-time
      reason: Persist generic waits for the existing durable timer service without a second scheduler.
    - mechanism: identity-and-authorization
      reason: Resolve workflow conversation context from exact persisted assignments rather than model input.
  new_core_mechanisms:
    - Generic workflow execution snapshots with optimistic revisions and expiring worker leases.
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Generic control state supports every compiled process; no domain reducer or company field is encoded.
rollback: Disable generic dispatch and cancel open runs before reverting callers; retain additive tables, Artifacts, approvals and effect evidence.
