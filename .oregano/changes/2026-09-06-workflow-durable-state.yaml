created: "2026-09-06"
title: Persist pinned workflow runs, leases and assignments
objective: >-
  Add generic workflow persistence in the existing control schema, reuse Core
  run metadata and event evidence, and fence provider dispatch against current
  execution leases and cancellation. Qualify additive database manifest 2.0.0.
