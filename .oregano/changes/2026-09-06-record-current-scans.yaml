  - packages/testkit/tests/record-query-postgres.test.ts
  - packages/testkit/tests/slack-record-source.test.ts
documentation_impact:
  required: true
  affected_documents:
    - specification.company-records-query-v1
    - status.current
architecture:
  placement:
    core: Extend the maintained Records synchronization, store, query and Connector contracts.
    packages: No Package or Blueprint is introduced.
    workspace: The caller explicitly chooses current scan semantics and its own deadline.
    instance: Retain scan evidence and immutable versions behind qualified bindings and existing storage.
  mechanisms_extended:
    - mechanism: company-records
      reason: Persist successful scan membership and read only its immutable normalized versions.
    - mechanism: capability-contracts-and-connectors
      reason: Expose actual scan observation intervals without fabricating historical coverage.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Any workflow can require complete current observations after its own deadline.
rollback: Revert the additive query contract; retain version and receipt history. Existing historical queries remain unchanged.
