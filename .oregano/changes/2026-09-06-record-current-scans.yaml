version: 3
plan_id: record-current-scans-2026-09-06
created: "2026-09-06"
title: Read complete current provider scans with explicit observation evidence
objective: >-
  Distinguish a complete current provider scan from historical time coverage.
  Persist exact immutable version membership after successful synchronization
  and require a scan begun at or after a caller's deadline. Read that scan
  atomically without mixing stale, absent or partially ingested later objects.
non_goals:
  - Reconstruct deleted or edited remote content at a historical instant.
  - Change operating workflow policy or claim hosted acceptance.
  - Weaken require_synced_through or create a new SQL schema.
placement: core
change_class: security
files_expected:
  - .oregano/changes/2026-09-06-record-current-scans.yaml
  - packages/records/contracts.ts
  - packages/records/source-connector.ts
  - packages/records/synchronization.ts
  - packages/records/current-scan.ts
  - packages/records/query.ts
  - packages/records/query-schema.ts
  - packages/records/service.ts
