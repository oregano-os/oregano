  - packages/connectors/monday/records-source.ts
  - packages/testkit/tests/record-current-scan.test.ts
  - packages/testkit/tests/record-query-postgres.test.ts
  - packages/testkit/tests/slack-record-source.test.ts
  - packages/testkit/tests/provider-record-evidence.test.ts
  - packages/testkit/fixtures/lindenhof-studio/compiler-expectations/friday-close.json
