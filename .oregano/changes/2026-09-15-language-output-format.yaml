version: 3
plan_id: language-output-format-2026-09-15
created: 2026-09-15
title: Reinforce and account for hosted generation output formats
objective: Prevent Markdown wrappers and extra commentary from invalidating a
  reviewed JSON-only phase, admitting only a single complete JSON transport fence,
  while retaining strict downstream validation and
  complete paid-attempt evidence.
non_goals:
  - Discard model commentary, repair JSON contents, change semantic rules or increase retries.
  - Change source selection, model routing, Tool grants or Workspace policy.
placement: core
change_class: security
files_expected:
  - .oregano/changes/2026-09-15-language-output-format.yaml
  - .oregano/changes/2026-09-14-brain-import.yaml
  - packages/language/contracts.ts
  - packages/language/attempts.ts
  - packages/connectors/language-model.ts
  - packages/runner-vercel/src/lib/language-generation.ts
  - packages/runner-vercel/src/lib/language-generation.test.ts
  - scripts/materialize-brain-prompts.ts
  - packages/testkit/tests/brain-skill-materialization.test.ts
  - docs/specifications/model-recipes.md
  - docs/specifications/brain-skill-adoption.md
  - docs/status/current.md
  - docs/_generated/**
tests:
  - packages/runner-vercel/src/lib/language-generation.test.ts
  - packages/testkit/tests/brain-skill-materialization.test.ts
documentation_impact:
  required: true
  affected_documents:
    - specification.model-recipes
    - specification.brain-skill-adoption
    - status.current
architecture:
  placement:
    core: Generic host serialization reminder, exact instruction evidence, and lossless single-JSON-fence decoding with both response digests.
    packages: Prompt measurement reuses the same host wrapper as generation.
    workspace: Reviewed phase output contracts and semantic rules remain unchanged.
    instance: Existing model bindings, retained run definitions and paid-attempt evidence.
  mechanisms_extended:
    - mechanism: model-recipe-resolver
      reason: Retain resolved models and limits; record the actual delivered host instruction digest.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Every scoped generation Skill retains its declared JSON or Markdown
    format. No company values, phase names, model IDs or business rules are inferred.
rollback: Restore the earlier host wrapper; retain every attempted response and
  resume only through the existing bounded read-repair operation.
