documentation_impact:
  required: true
  affected_documents:
    - specification.workflow-execution-v1
    - specification.brain-import
    - operations.workflow-engine
architecture:
  placement:
    core: Generic cutoff classification, durable continuation, cost accounting and host bounds.
    packages: Portable small-write guidance and opt-in Brain Workflow defaults.
    workspace: Reviewed model bindings, source selection and unchanged cumulative limits.
    instance: Provider execution, leases and retained attempt and write receipts.
  mechanisms_extended:
    - mechanism: model-recipe-resolver
      reason: Respect larger reviewed output and time allowances with actual usage evidence.
    - mechanism: approvals-effects-and-idempotency
      reason: Continue only known length failures in the same append-only journal without replaying saved operations.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Any company may select bounded output-cutoff recovery for a durable Agent task without provider-specific business logic.
rollback: Restore prior defaults for new Artifacts; retain historical definitions,
  failures, costs, source identities and every saved write. Never reset an old run.
