version: 3
plan_id: agent-output-recovery-2026-09-17
created: 2026-09-17
title: Continue known Agent output cutoffs within the same bounded journal
objective: Add opt-in continuation for confirmed output-length failures. Preserve
  prior Tool receipts, attempt costs and immutable source identity. Request smaller
  operations after a cutoff, count cutoffs as no progress and retain all cumulative
  limits. Allow 32000 output tokens per response and a 360-second model timeout,
  with sufficient host and lease headroom. Adopt the response limit and recovery
  policy in new Brain imports without changing the model or other task budgets.
non_goals:
  - Retry unknown provider outcomes, change historical Artifacts or reset budgets.
  - Execute partial Tool calls or repeat previously confirmed writes.
  - Add a content critic, new sources, Phase 2 or Dream.
placement: core
change_class: security
