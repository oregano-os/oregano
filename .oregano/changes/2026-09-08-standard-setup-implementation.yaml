title: Implement the complete standard installation with one setup decision
objective: >-
  Implement packages 1 through 7 of the five-minute setup plan as one coordinated
  change: CLI-owned discovery and defaults, a single scoped decision, direct
  fresh initialization, existing provider lifecycle and recovery, natural Slack
  verification, release delivery, and qualification tooling. Distinguish executed
  local and simulated checks from outstanding external timing evidence.
non_goals:
