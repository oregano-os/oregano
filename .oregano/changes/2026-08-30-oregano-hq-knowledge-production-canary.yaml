version: 1
plan_id: oregano-hq-knowledge-production-canary-2026-08-30
status: approved
author: codex-agent
created: 2026-08-30
title: Qualify and activate Retrieval V3 as an Oregano HQ production canary
objective: >-
  Add an explicit internal-dogfood production-canary lane without weakening the
  reusable non-production isolation contract, rehearse additive manifest 1.7.0
  on a Neon branch, upgrade the Oregano HQ production database, build and
  verify Retrieval V3 without serving it, compare V2 and V3 under real
  production authorization, and activate V3 only for an allowlisted internal
  Agent while retaining an immediate V2 fallback.
non_goals:
  - Make production-first rollout the default for customer Company Instances.
  - Duplicate the Oregano HQ Vercel project, Slack application, Granola binding, or model-provider secrets.
  - Serve Retrieval V3 to an Agent that is not explicitly allowlisted.
  - Delete, truncate, rewrite, or downgrade durable Company Brain or Handbook data.
  - Treat a production canary, Working Synthesis, or Current Brief as official Handbook truth.
placement: core
change_class: security
vision_principles_affected:
  - A company-independent Core
  - Human authority is explicit
  - Evidence beats claims
  - The runtime is replaceable
  - Knowledge authority stays reviewed and singular
