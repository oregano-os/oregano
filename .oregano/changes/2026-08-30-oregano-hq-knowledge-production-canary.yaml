  - rehearse prepareCompanyDatabase and qualifyCompanyDatabase on an exact Neon production branch
  - run prepareCompanyDatabase and qualifyCompanyDatabase against Oregano HQ production
  - build and verify Retrieval V3 in production without activation
  - prove V2-served shadow comparisons, zero ACL leakage, citation membership, and V2 fallback
  - activate the exact verified projection only for the allowlisted Oregano HQ Agent
  - verify live health and one authorized plus one unauthorized production request
  - git diff --check
tests:
  - The generic isolated non-production qualification remains strict and unchanged.
  - Production-canary qualification requires an internal-only Agent allowlist, a Neon branch rehearsal, backup evidence, shadow evidence, and a tested V2 fallback.
  - V2 is the default when the mode variable is absent, invalid, incomplete, or does not allowlist the selected Agent.
  - Shadow mode executes V3 but returns the exact V2 response and persists only payload-free comparison evidence.
  - Canary mode serves V3 only when the selected Agent and exact verified active projection match the declared bindings.
  - Exact, lexical, semantic, graph, Current Brief, citation, and answer paths remain authorization-first.
  - The production migration is additive and leaves all existing V2 tables and paths available.
documentation_impact:
  required: true
  affected_documents:
    - architecture.company-instance
    - specification.company-knowledge-v0.2
    - status.current
    - guide.prepare-instance
    - guide.operate-knowledge-provider
migration: >-
  Create a point-in-time Neon branch from the Oregano HQ production branch and
  run prepareCompanyDatabase plus read-only qualification there. After the
  branch succeeds, run the same additive operation against the existing
  production DATABASE_URL. Build Retrieval V3 as staged and verified, leaving
  V2 as the served provider. Persist payload-free benchmark, authorization,
  citation, shadow, doctor, branch, backup, fallback, and operator receipts.
  Activate the exact projection and set the production runtime to V3 canary only
  for the selected internal Agent after every pre-activation gate passes.
rollback: >-
  Set COMPANYOS_KNOWLEDGE_RETRIEVAL_MODE to v2 and redeploy or promote the last
  known-good V2 Artifact. If necessary, activate the prior verified retrieval
  projection. Leave additive 1.7.0 schema objects dormant; do not delete durable
  Brain or Handbook data. Use the pre-migration Neon branch or provider backup
  only for a separately approved data-restoration incident.
open_decisions:
  - Select a stable operator-visible identifier for the exact Neon rehearsal branch and record it without credentials.
  - Keep production-first canary eligibility limited to Oregano HQ internal dogfood until a separate change qualifies broader use.
