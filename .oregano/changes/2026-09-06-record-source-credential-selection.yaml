version: 3
plan_id: record-source-credential-selection-2026-09-06
created: "2026-09-06"
title: Accept the documented non-secret Slack credential provider selector
objective: >-
  Let source connection planning accept the maintained Slack credential selector
  while continuing to reject inline credentials, nested selectors and arbitrary
  selector values. Keep actual credential resolution inside the Runner adapter.
non_goals:
  - Read, export or store a provider token in a binding.
  - Change credential resolution, scopes, qualification, production or source coverage.
placement: core
change_class: security
files_expected:
  - .oregano/changes/2026-09-06-record-source-credential-selection.yaml
  - packages/cli/src/records-operations.mjs
  - packages/cli/tests/records.test.mjs
  - packages/cli/content/guides/connect-company-record-source.md
  - packages/testkit/tests/record-source-credential.test.ts
  - docs/workbench/guides/connect-company-record-source.md
  - docs/status/current.md
  - docs/_generated/**
tests:
  - packages/cli/tests/records.test.mjs
  - packages/cli/tests/record-source-connect.test.mjs
  - packages/testkit/tests/record-source-credential.test.ts
documentation_impact:
  required: true
  affected_documents:
    - guide.connect-company-record-source
    - status.current
architecture:
  placement:
    core: Validate exact maintained adapter configuration without mistaking it for a secret.
    packages: Reuse the existing Slack Record Source and its documented credential choices.
    workspace: No credential choice or secret is added to Workspace declarations.
    instance: The non-secret binding selects direct environment or Vercel Connect resolution; tokens stay in the existing credential boundary.
  mechanisms_extended:
    - mechanism: capability-contracts-and-connectors
      reason: Align Workbench binding inspection with the already maintained Slack adapter selector.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Every Company Instance using the maintained Slack source can use its documented secret-free selector without bypassing inspection.
rollback: Revert planning acceptance if necessary; preserve existing runtime credentials, qualifications and source receipts.
