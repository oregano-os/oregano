title: Execute compiled workflow steps through durable Core control
objective: >-
  Interpret the frozen step graph with the actual CompanyOSRuntime, persisted
  context, existing timers, role-bound decisions and recoverable keyed items.
  Prove the fictional Workspace through memory and required Postgres execution.
non_goals:
  - Deploy or activate an operating Company Workspace or bypass real human acceptance.
  - Remove the legacy oracle before the parity and test-Instance gates.
