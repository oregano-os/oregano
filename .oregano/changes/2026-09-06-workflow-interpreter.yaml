architecture:
  placement:
    core: Interprets only generic constructs, authenticates decisions, fences execution and retains evidence.
    packages: Existing standard and restricted Company Tools run through CompanyOSRuntime.
    workspace: Defines process, business calculations, recipients, templates, calendars and decision roles.
    instance: Supplies authenticated operators, current roster, explicit execution enablement and qualified Connector bindings.
  mechanisms_extended:
    - mechanism: toolset-resolver
      reason: Resolve decision notices and ordinary steps through existing granted Tools.
    - mechanism: approvals-effects-and-idempotency
      reason: Reuse exact input approvals, persisted execution state, fences and completed receipts.
    - mechanism: timers-and-business-time
      reason: Wake persisted waits and decision deadlines using the existing timer service.
    - mechanism: identity-and-authorization
      reason: Build trusted context from current leases or authenticated exact conversation assignments.
    - mechanism: capability-contracts-and-connectors
      reason: All provider execution stays behind ordinary Runtime Tool/Capability bindings.
  new_core_mechanisms:
    - A bounded interpreter of the compiled forward-only workflow graph.
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: No company field, cohort, weekday purpose, calculation or business decision is encoded in the interpreter.
rollback: Disable new workflow openings, cancel active runs, retain Artifacts and receipts, and keep the previous operating Workspace pin until real acceptance.
