version: 2
plan_id: governed-agent-handoffs-implementation-2026-09-01
status: approved
author: codex-agent
created: 2026-09-01
title: Implement governed Agent handoffs and durable Conversation Assignments
objective: >-
  Implement the approved two-stage multi-Agent conversation routing contract:
  deterministic authenticated ingress, allowlisted Core authorization, durable
  exact Conversation Assignments, explicit return and revocation, bounded
  expiry, Runner integration, and fail-closed evidence without changing Agent
  identity, Tool grants, approvals, or provider authority.
non_goals:
  - Deploy or activate a private Company Instance.
  - Apply a production database migration or read any provider credential.
  - Let message text authenticate a principal, override an exact Agent Binding, or union ToolSets.
  - Archive full provider transcripts as part of assignment evidence.
placement: core
change_class: security
vision_principles_affected:
  - A company-independent Core
  - Human authority is explicit
  - Evidence beats claims
  - Safety cannot be weakened from a Workspace
  - The runtime is replaceable
