migration: >-
  The Source Connector 2.0 requirement gains an explicit provider-wide
  workspace scope while retaining the existing exact-container scope. The
  database change is additive and stores Raw Asset payloads in the existing
  Company Instance database behind the provider-neutral adapter. Existing
  Source identities, folder-filtered requirements, events, evidence, policies,
  receipts, and watermarks remain valid.
rollback: >-
  Disable the Granola runtime handlers and revoke the active Instance binding.
  Retain accepted Raw Evidence, Raw Assets, receipts, and watermarks. Revert to
  a folder-filtered Source requirement or a prior deployment without deleting
  provider data or previously accepted CompanyOS evidence.
