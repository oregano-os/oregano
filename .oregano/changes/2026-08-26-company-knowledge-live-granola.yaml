tests:
  - Provider-wide scope is explicit and cannot be confused with an empty folder allowlist.
  - Personal plus public scope retrieves all notes visible to the bound user while fixed CompanyOS policy remains authoritative for destination access.
  - Folder-filtered profiles remain compatible and reject out-of-scope note fetches.
  - Complete transcripts below the asset ceiling are retained, including transcripts above the inline ceiling.
  - Raw Asset writes are digest-idempotent, policy-bound, authorized before read, and payload-free in receipts and logs.
  - Webhook signatures are verified over raw bytes before parsing and events are durably accepted before acknowledgement.
  - Reconciliation uses overlap, bounded pagination, leases, durable watermarks, and idempotent processing.
  - Runtime qualification and health return non-secret evidence only.
  - Runtime handlers reject unauthorized scheduler requests and unavailable or unqualified bindings.
