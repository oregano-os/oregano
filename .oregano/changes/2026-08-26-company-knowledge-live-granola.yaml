status: approved
author: codex-agent
created: 2026-08-26
title: Activate provider-wide Granola ingestion in the production runner
objective: >-
  Extend the maintained Granola Source profile from mandatory folder filtering
  to an explicit provider-wide scope, preserve complete transcripts through a
  qualified durable Raw Asset adapter, and add portable runtime handlers for
  signed webhook ingestion, reconciliation, qualification, health, and initial
  backfill without exposing Instance secrets or provider payloads.
non_goals:
  - Grant provider-derived per-note ACLs that the public API cannot prove.
  - Make Granola content curated Handbook authority without governed promotion.
  - Store credentials, raw notes, or transcripts in Git, Artifacts, logs, receipts, or diagnostics.
  - Make Vercel part of the provider-neutral Source or Raw Asset contracts.
placement: core
change_class: security
vision_principles_affected:
