title: Add candidate-bound functional tests before Builder merge and live adoption
objective: Run selected user tests against the exact checked Workspace proposal, retain isolated
  execution and provider evidence, and require current human acceptance before merging and adopting
  that candidate in production.
non_goals:
  - Install a second provider application or require a Preview for every change.
  - Activate unrelated company workflows or claim synthetic decisions as human acceptance.
  - Add a parallel workflow engine, secret store or provider permission catalog.
