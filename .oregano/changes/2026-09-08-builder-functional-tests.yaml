    - specification.builder-governance
    - guide.prepare-builder-change
    - guide.operate-builder
    - status.current
architecture:
  placement:
    core: Generic candidate-bound test orchestration and release enforcement.
    packages: Portable intake and operations guidance for all coding profiles.
    workspace: Company definitions, test intent and existing acceptance policy.
    instance: Qualified provider bindings, isolated state and retained evidence.
  mechanisms_extended:
    - mechanism: agent-resolver
      reason: Select a retained candidate only for its assigned test conversation.
    - mechanism: capability-contracts-and-connectors
      reason: Discover current bindings and apply a narrower trusted test scope.
    - mechanism: approvals-effects-and-idempotency
      reason: Persist candidate-bound tests and invalidate stale result acceptance.
  new_core_mechanisms:
    - A Builder test-session orchestration record linking existing compilation, execution and
      release contracts.
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: All companies supply logical resources and policy. Claude Code and Codex share the
    same source-grounded brief, checks and test lifecycle.
rollback: Stop new test sessions, retain their evidence and restore the preceding exact Core and
  Workspace pairing. Provider test effects remain visible and must not be represented as undone by
  an application rollback.
open_decisions: []
