version: 2
plan_id: release-v0.5.3-2026-09-01
status: approved
author: codex-agent
created: 2026-09-01
title: Release the experimental Sprint foundation as Oregano v0.5.3
objective: >-
  Publish one immutable stable Core patch release from the reviewed Phase 1–6
  integration commit, including company-neutral planning governance, Company
  Records and Sprint foundations, the declarative Sprint Agent Blueprint,
  maintained Monday qualification, and a fail-closed external-Agent ingress,
  without activating any Company Workspace or Company Instance.
non_goals:
  - Merge, tag, publish, deploy, or promote before the exact release commit, Workbench version, generated manifest, and checksums receive final confirmation.
  - Materialize or change a real Company Workspace, compatibility pin, provider mapping, participant list, schedule, policy, Agent instruction, or model recipe.
  - Deploy a Company Instance, migrate a real database, grant a Monday board, enable provider writes, or claim live Sprint verification.
  - Change Workbench version 0.1.0-experimental.10.
  - Rewrite or remove the immutable v0.5.2 release.
placement: core
change_class: security
vision_principles_affected:
  - A company-independent Core
  - Human authority is explicit
  - Evidence beats claims
  - The runtime is replaceable
  - Files are the review surface
  - Onboarding has no hidden steps
files_expected:
  - .oregano/changes/2026-09-01-release-v0.5.3.yaml
  - docs/_generated/document-registry.json
  - docs/status/current.md
  - package.json
  - packages/cli/tests/live-setup.test.mjs
  - packages/cli/tests/workbench.test.mjs
  - packages/testkit/tests/reference-runtime.test.ts
  - packages/testkit/fixtures/acme-casas/.companyos/compatibility.yaml
required_approvals:
  - oregano-maintainer
approvals:
  - role: oregano-maintainer
    approver: workspace-steward
    approved_at: 2026-09-01
    evidence: explicit-user-instruction-ok-go-after-selecting-the-v0.5.x-release-line
architecture_assessment:
  responsibilities:
    core:
      - Own the public Core version, immutable tag and release evidence, release assets, checksums, migration statement, and rollback reference.
      - Preserve the reviewed company-neutral mechanisms and fail-closed security behavior without introducing release-time authority.
    packages:
      - Retain the Sprint Agent Blueprint as an experimental declarative package whose installation and grants remain separate.
    workspace:
      - Remain unchanged; adoption requires a later reviewed Workspace compatibility pin and company-owned material.
    instance:
      - Remain unchanged; deployment, migration, credentials, bindings, grants, activation, and live qualification require separate confirmations.
  existing_mechanisms:
    - mechanism: agent-resolver
      decision: reuse
      reason: The release packages the already reviewed Resolver integration and changes no routing authority.
    - mechanism: toolset-resolver
      decision: reuse
      reason: The release grants no Tool and changes no supported ToolSet behavior.
    - mechanism: model-recipe-resolver
      decision: reuse
      reason: The release selects no company model route and keeps Workbench version unchanged.
    - mechanism: company-records
      decision: reuse
      reason: The release distributes the reviewed generic records foundation without migrating or synchronizing real Instance data.
    - mechanism: identity-and-authorization
      decision: reuse
      reason: Signed senderless Monday callbacks remain blocked before Company material, model, Tool, or effect access.
    - mechanism: timers-and-business-time
      decision: reuse
      reason: The release changes no schedule and activates no durable timer.
    - mechanism: approvals-effects-and-idempotency
      decision: reuse
      reason: Publication uses the existing reviewed commit, protected main, immutable tag workflow, and checksum evidence; provider effects remain separate.
    - mechanism: capability-contracts-and-connectors
      decision: reuse
      reason: The release distributes the reviewed experimental contracts and maintained Monday adapter without additional capability or grant changes.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: >-
    The release contains only company-neutral mechanisms and synthetic public
    fixtures. Company policy, provider resources, credentials, exact bindings,
    model selection, and activation remain outside Core.
release_classification:
  selected_increment: patch
  previous_version: 0.5.2
  target_version: 0.5.3
  rationale: >-
    The newly distributed Sprint, Records, Blueprint, qualification, and
    external-Agent components are experimental, optional, and inactive for all
    existing supported consumers. Existing Workspace schemas and Instance
    deployments remain compatible, no migration or operator decision is
    required merely to remain on the supported path, and normal Slack, Agent,
    Knowledge, and Builder behavior is preserved. This is therefore a
    compatibility-preserving experimental capability distribution and security
    hardening within the existing 0.5 line, not a newly activated canonical
    operating contract.
validation:
  - pnpm companyos plan --check .oregano/changes/2026-09-01-release-v0.5.3.yaml
  - pnpm companyos inspect-core --base origin/main --plan .oregano/changes/2026-09-01-release-v0.5.3.yaml
  - pnpm companyos versions packages/testkit/fixtures/acme-casas --format json
  - pnpm docs:generate
  - pnpm docs:check
  - pnpm public:check
  - pnpm validate:fixture
  - pnpm typecheck
  - pnpm runner:typecheck
  - pnpm builder:check
  - pnpm test
  - pnpm runner:build
  - git diff --check
tests:
  - Core reports 0.5.3 while Workbench remains 0.1.0-experimental.10.
  - The neutral Company Workspace fixture pins Core 0.5.3 and validates against the exact checkout.
  - Existing Slack, Agent, Knowledge, Builder, Company Records, Sprint, Monday Connector, and setup regression suites remain green.
  - Public-boundary and documentation checks reject company data, secrets, stale generated control-plane files, or unsupported claims.
  - Release assets are generated only from the clean exact v0.5.3 tag after the release commit is merged.
  - The manifest records exact Core commit, Core version, Workbench version, requirements, and SHA-256 checksums.
documentation_impact:
  required: true
  affected_documents:
    - status.current
migration: >-
  Existing v0.5.2 Company Workspaces and Instances remain valid and require no
  migration. The new experimental Sprint and Monday paths stay dormant until a
  separately reviewed Workspace and Instance opt in with exact compatibility,
  database, provider, Agent, grant, and deployment bindings.
rollback: >-
  Do not mutate the immutable v0.5.3 release after publication. Continue using
  exact v0.5.2 for any Company Workspace that has not adopted v0.5.3. If a Core
  defect is found, correct it in a newer reviewed patch release; Instance
  rollback remains a separately approved exact-pair deployment.
open_decisions: []
