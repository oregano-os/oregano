tests:
  - packages/runner-vercel/src/lib/artifact-reference.test.ts
  - packages/testkit/tests/builder-live-adapters.test.ts
  - packages/testkit/fixtures/workflow-engine-postgres.test.ts
documentation_impact:
  required: true
  affected_documents:
    - status.current
    - guide.operate-builder
    - architecture.company-instance
    - specification.company-instance-release-promotion-v0.1
architecture:
  placement:
    core: Exact retained Artifact validation, bounded startup and release staging.
    packages: No new package or Workbench API is introduced.
    workspace: Full company definitions and reviewed context remain unchanged.
    instance: Existing Postgres retains immutable Artifacts; hosting stores only
      their exact identity and existing secret references.
  mechanisms_extended:
    - mechanism: approvals-effects-and-idempotency
      reason: Retain and verify the exact accepted Artifact before staging its pointer.
    - mechanism: capability-contracts-and-connectors
      reason: Reuse the existing Artifact store and isolate hosting startup behavior.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Every company and coding profile can retain complete Workspace
    context without depending on a provider's environment-variable size limit.
rollback: Restore the previous deployment and its exact Artifact configuration.
  Preserve immutable stored Artifacts and receipts. A missing or corrupt referenced
  Artifact fails closed and never falls back to another company version.
open_decisions: []
