documentation_impact:
  required: true
  affected_documents:
    - onboarding.index
    - onboarding.company-workspace
    - onboarding.setup-options
    - command.setup
    - command.verify-live
    - guide.prepare-instance
    - architecture.company-instance
    - architecture.boundaries
    - specification.company-instance-release-promotion-v0.1
    - status.current
  reason_if_none: ""
architecture:
  placement:
    core: The maintained private setup profile owns the minimum plan and automatic provider preflight; runtime business behavior is unchanged.
    packages: No Package or Blueprint changes and no new public provider contract.
    workspace: No company operating policy, new question, or billing choice is added to Workspace files.
    instance: The selected Vercel team owns billing; retain only non-secret plan and team evidence and never upgrade automatically.
  mechanisms_extended:
    - mechanism: capability-contracts-and-connectors
      reason: Extend the existing private Vercel setup binding with read-only plan detection and resumable prerequisite evidence.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: >-
    Every company using this profile receives the same scheduling prerequisite.
    Exact team identities and observed billing plans remain setup state rather
    than Core values. Other runtime profiles remain separate extensions.
rollback: >-
  Revert this change without altering any account or resource. Existing state
  remains readable; the additional vercel-plan phase requires this CLI until
  it advances to an existing phase. Old completed states are not deployment
  authorization and the current verifier rechecks the provider prerequisite.
