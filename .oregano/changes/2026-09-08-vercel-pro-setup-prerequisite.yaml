version: 3
plan_id: vercel-pro-setup-prerequisite-2026-09-08
created: "2026-09-08"
title: Require Vercel Pro for the maintained Oregano setup
objective: >-
  Make Vercel Pro the maintained profile prerequisite, accept Enterprise,
  automatically inspect the selected team's billing plan before initial
  resource creation and resumed runtime work, and return a resumable billing
  action for Hobby without asking for cron frequencies or changing a plan.
non_goals:
  - Upgrade an account, accept billing terms, or deploy a real Instance.
  - Change cron schedules, add a Hobby fallback, or implement another profile.
  - Change model routing or other setup confirmation requirements.
placement: core
change_class: security
files_expected:
  - .oregano/changes/2026-09-08-vercel-pro-setup-prerequisite.yaml
  - packages/cli/src/setup/profiles/vercel-neon-slack.ts
  - packages/cli/src/live-setup.mjs
  - packages/cli/tests/live-setup.test.mjs
  - README.md
