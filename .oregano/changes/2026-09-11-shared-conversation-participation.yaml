architecture:
  placement:
    core: Provider-neutral input, participation and delivery contracts, model controls and conformance.
    packages: Reusable synthetic adapter qualification rather than provider-specific behavior.
    workspace: Existing Agent identity, instructions, language and grants remain authoritative.
    instance: Existing channel ownership, authenticated identities and retained conversation state.
  mechanisms_extended:
    - mechanism: agent-resolver
      reason: Preserve conversation routing and apply participation to the resolved Agent.
    - mechanism: identity-and-authorization
      reason: Attribute context to verified senders without sharing requester permissions.
    - mechanism: approvals-effects-and-idempotency
      reason: Separate conversational output from authorized completion notifications and retain deduplication.
    - mechanism: capability-contracts-and-connectors
      reason: Require the same participation contract and conformance from every chat adapter.
  new_core_mechanisms:
    - A small provider-neutral conversation output controller used by the existing Agent loop.
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: No company name, channel ID, chat vendor or coding provider determines participation behavior.
rollback: Restore the preceding exact Core pairing and Instance routing setting. Preserve conversation, job, decision and deployment evidence. Pending authorized work remains independent of conversation participation.
open_decisions: []
