created: 2026-09-11
title: Release Core 0.12.0 with selective shared-conversation participation
objective: Admit owned conversation follow-ups, preserve attributed context and let the existing Agent explicitly choose visible participation without another model classifier. Enforce the same output contract for every maintained and future chat adapter, including candidate tests and workflow conversations.
non_goals:
  - Add a separate participation Agent or model classification pass.
  - Add new chat providers, attention timers, or business permissions.
  - Change Go Live approval or suppress completion of already authorized work.
