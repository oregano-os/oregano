documentation_impact:
  required: true
  affected_documents:
    - specification.workflow-execution-v1
    - specification.tool-architecture
    - architecture.system-of-proof
    - status.current
architecture:
  placement:
    core: Owns trusted execution context, reference resolution, guard enforcement and effect evidence.
    packages: Existing restricted Company Tools continue through the same Runtime boundary.
    workspace: Owns step inputs, templates, decisions and declared process; cannot override trusted context.
    instance: Owns authenticated conversation assignments, current roster and exact qualified recipient bindings.
  mechanisms_extended:
    - mechanism: toolset-resolver
      reason: Intersect compiled Tool grants with the current workflow or conversational step.
    - mechanism: identity-and-authorization
      reason: Read run assignment and human decision authority from trusted host state rather than model arguments.
    - mechanism: approvals-effects-and-idempotency
      reason: Bind effects to workflow run, step and item while checking payload digests independently.
    - mechanism: capability-contracts-and-connectors
      reason: Preserve unknown outcomes when a provider effect returns an invalid receipt.
  new_core_mechanisms:
    - A workflow Tool guard with a host-owned context reader and deterministic reference resolution.
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Every compiled process receives the same authority and recovery boundary without business-specific Runtime code.
rollback: Do not activate generic workflows until engine acceptance; revert the guard only with workflow execution disabled and all retained effects preserved.
