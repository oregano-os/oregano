version: 3
plan_id: workflow-runtime-guard-2026-09-06
created: "2026-09-06"
title: Enforce compiled workflow authority at the Runtime Tool boundary
objective: >-
  Require trusted run or conversation context for workflow Artifacts and enforce
  exact step, Tool, input, binding, risk and decision authority. Preserve pinned
  evidence and successful effects when downstream receipt requirements fail.
non_goals:
  - Activate schedules, claim durable engine acceptance or deploy an Instance.
  - Infer run assignments, recipients or human approvals from model arguments.
placement: core
change_class: security
files_expected:
  - .oregano/changes/2026-09-06-workflow-runtime-guard.yaml
  - packages/runtime/workflow-engine/**
  - packages/runtime/canonical.ts
  - packages/runtime/companyos-runtime.ts
  - packages/state-store/action-approval.ts
  - packages/state-store/interface.ts
  - packages/companyos-builder/workflow-types.ts
  - packages/companyos-builder/workflow-compiler.ts
  - packages/companyos-builder/workflow-authoring.ts
  - packages/companyos-builder/types.ts
  - packages/companyos-builder/build.ts
  - packages/companyos-builder/instance-loader.ts
  - packages/connectors/registry.ts
  - packages/testkit/tests/workflow-runtime-guard.test.ts
  - packages/testkit/tests/workflow-compiler.test.ts
  - packages/testkit/fixtures/lindenhof-studio/compiler-expectations/**
  - docs/specifications/workflow-execution-v1-draft.md
  - docs/specifications/tool-architecture.md
  - docs/architecture/system-of-proof.md
  - docs/status/current.md
  - docs/_generated/document-registry.json
tests:
  - packages/testkit/tests/workflow-runtime-guard.test.ts
  - packages/testkit/tests/workflow-compiler.test.ts
