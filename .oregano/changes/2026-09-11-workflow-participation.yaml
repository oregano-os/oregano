architecture:
  placement:
    core: Shared normalized conversation identity, participation policy and quiet output control.
    packages: Synthetic adapter and model-boundary conformance fixtures.
    workspace: Existing Agent language, coordinator declaration and business grants remain authoritative.
    instance: Existing exact channel and recipient ownership; no new provider permissions or timers.
  mechanisms_extended:
    - mechanism: agent-resolver
      reason: The existing conversation pass may retain context without selecting an Agent concern.
    - mechanism: identity-and-authorization
      reason: Preserve authenticated sender facts in the bounded conversation context.
    - mechanism: capability-contracts-and-connectors
      reason: Every adapter uses the same Core quiet-output and normalized-input contract.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Same controller and semantic policy as the primary Core line; no coding Agent, deployment host or company-specific behavior.
rollback: Restore the preceding exact Core and Artifact pairing while retaining message, job and decision evidence. No database migration.
