architecture:
  placement:
    core: Reuse the existing Records projections, identity-bound admission, Workflow references and Tool authorization unchanged.
    packages: Extend the portable authoring helper with a pure source-projection selector and reviewed optional prefix mappings.
    workspace: Own the default projection and exact non-overlapping identity-prefix mappings for selected sources.
    instance: Retain provider qualification, credentials, exact source admission and operational state.
  mechanisms_extended: []
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
