version: 3
plan_id: brain-ingestion-routing-2026-09-16
created: 2026-09-16
title: Route source content through bounded incremental ingestion Skills
objective: Separate source transport from content procedure. Route normalized
  sources to the applicable adopted ingestion Skill, write meetings before entity
  enrichment, and verify actual saved pages. Remove automatic one-shot fallback,
  bound continuing Agent cost and stop repeated attempts without progress. Add a
  deterministic evidenced Timeline addition within remember and verify saved-page
  hashes through durable write receipts without rewriting unrelated page content.
non_goals:
  - Implement Dream, reflection, consolidation or concept synthesis workflows.
  - Change Brain directories, page authority, provider grants or source selection.
  - Claim that a Skill provides an unavailable media extractor or publication crawler.
  - Include private source content, company identifiers or credentials in Core.
placement: core
change_class: security
