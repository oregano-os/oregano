architecture:
  placement:
    core: Generic bounded Agent execution, model context projection and source admission.
    packages: Portable ingestion router, adopted Skills and restricted workflow Tools.
    workspace: Content mappings, source selections, perspective, directories and budgets.
    instance: Existing source versions, provider credentials, Git writes and cost receipts.
  mechanisms_extended:
    - mechanism: company-records
      reason: Reuse complete normalized source versions; classify content independently of transport.
    - mechanism: model-recipe-resolver
      reason: Preserve utility triage and reasoning/deep roles while bounding continuing execution.
    - mechanism: approvals-effects-and-idempotency
      reason: Preserve durable operations and stop failures or repeated no-progress model turns.
    - mechanism: capability-contracts-and-connectors
      reason: Reuse Brain reads and evidenced Git writes; add no provider execution in Workspaces.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Content procedures and budgets apply to every company without provider names or private selection in the Blueprint.
rollback: Restore the prior pinned artifact for new imports; retain all writes, source versions and failed attempt receipts. Never replay a partially written import as a new success.
