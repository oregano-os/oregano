version: 3
plan_id: brain-ingestion-routing-2026-09-16
created: 2026-09-16
title: Route source content through bounded incremental ingestion Skills
objective: Adopt Skill-led source interpretation, saved-page verification and repair
  with an opt-in text completion mode in the existing bounded Agent runtime.
  A complete non-empty response without Tool calls ends the task; retain its
  report and derive actual changes from durable write receipts. Remove the active
  Brain content-completion validator and mandatory structured finish report.
  Preserve the default structured completion mode for existing Workflows, exact
  source provenance, scoped grants, ordinary write validation, recovery, source
  deduplication and the remaining execution budgets. Omit the optional cumulative
  input-byte cap from newly materialized Brain imports while retaining input-size
  accounting, per-request host bounds and historical immutable run definitions.
  Keep incremental Timeline mutations,
  scoped instruction/model routing and independent source-first qualification.
non_goals:
  - Implement Dream, reflection, consolidation or concept synthesis workflows.
  - Change Brain directories, page authority, provider grants or source selection.
  - Claim that a Skill provides an unavailable media extractor or publication crawler.
  - Include private source content, company identifiers or credentials in Core.
