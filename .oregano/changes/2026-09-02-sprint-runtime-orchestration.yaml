  - pnpm docs:generate
  - pnpm docs:check
  - pnpm public:check
  - pnpm validate:fixture
  - pnpm typecheck
  - pnpm runner:typecheck
  - pnpm builder:check
  - pnpm test
  - pnpm runner:build
  - git diff --check
tests:
  - Concurrent normalized events commit exactly once with monotonic state versions; duplicates return the prior outcome and create no duplicate intents.
  - Event, resulting state, decision evidence, and pending intents commit atomically or not at all.
  - Intent workers lease bounded work, cannot complete another lease, retry explicitly, and preserve durable success or failure evidence.
  - Due Sprint timers become deterministic clock events and complete only after the event outcome is durable.
  - Missing policy, calendar, state identity, dispatcher, Agent grant, destination, or resource binding fails closed before a provider effect.
  - A synthetic CompanyOSRuntime-backed dispatcher proves that claimed intents still pass ToolSet, Capability, idempotency, effect, and evidence controls.
  - The additive companyos-postgres manifest qualifies all Sprint orchestration tables and indexes without changing existing rows or schemas.
  - Public fixtures contain no real company, person, resource, credential, or provider payload.
