  reason_if_none: ""
migration: >-
  Adoption is optional and additive. A later, separately confirmed Company
  Instance migration advances the maintained database manifest and adds Sprint
  event, state, and intent relations inside companyos_records. Existing
  Workspaces and Instances remain valid and inactive; no schedule or effect is
  enabled by installing the Core version alone.
rollback: >-
  Disable later Sprint ingress and schedules, stop leasing new intents, and let
  active leases expire before reverting runtime wiring. Retain additive Sprint
  event, state, intent, timer, and effect evidence as dormant System of Proof
  data unless a separate governed destructive migration authorizes removal.
open_decisions:
  - Company-specific calendar coverage, participant identities, projection freshness, model route, Agent handoffs, Tool grants, destination bindings, resource bindings, and activation remain a later interview and reviewed Workspace/Instance change.
  - Company-specific rendering from a generic Sprint intent into a communication message or work-item mutation must be reviewed with the company's workflows before live dispatch is enabled.
