created: 2026-09-02
title: Complete the provider-neutral Sprint runtime orchestration boundary
objective: >-
  Complete the reusable Core path from one validated normalized Sprint event or
  durable Sprint timer through deterministic reduction, durable state and
  evidence, idempotent intent creation, leased intent dispatch, and the
  existing CompanyOS Tool/effect boundary, while remaining fail closed unless
  a reviewed Company Workspace and Company Instance supply every policy,
  calendar, Agent, Tool, destination, and resource binding.
non_goals:
  - Change a real Company Workspace, interview or invent missing company values, or activate a company Sprint Agent.
  - Migrate or synchronize a production database, call Monday, send Slack messages, deploy a Runner, enable a schedule, or perform any provider effect.
  - Add company people, boards, columns, channels, holidays, schedules, model choices, credentials, or provider identifiers to Core.
  - Tag or publish Oregano v0.5.4, merge this work, or update a Company Instance without a separate exact review and approval.
  - Render company-specific message content or translate a Sprint intent into provider input inside the pure Sprint domain.
placement: core
change_class: security
vision_principles_affected:
  - A company-independent Core
  - Human authority is explicit
  - Evidence beats claims
  - The runtime is replaceable
  - Files are the review surface
  - Security before autonomy
  - Documentation is part of the system
