architecture_assessment:
  responsibilities:
    core:
      - Own normalized Sprint event processing, deterministic decisions, optimistic durable state commits, idempotent intent state, timer consumption, leases, evidence, and the generic dispatch boundary.
      - Preserve the existing CompanyOSRuntime as the only path from a claimed Sprint intent to an authorized Tool and Connector effect.
    packages:
      - Keep the Sprint Blueprint declarative and company-neutral; it supplies no runtime authority or provider binding.
    workspace:
      - Continue to own Sprint policy, participants, projections, calendar, holidays, schedules, workflows, templates, skills, Agent instructions, language, and requested Tool grants.
    instance:
      - Continue to own exact Agent, model, database, timer, destination, resource, Connector, credential, activation, cost, and deployment bindings plus live receipts.
  existing_mechanisms:
    - mechanism: agent-resolver
      decision: reuse
      reason: Any later conversational handoff or provider-facing execution must use the already compiled Agent resolution and durable Conversation Assignment path; Sprint state does not route from message meaning.
    - mechanism: toolset-resolver
      decision: reuse
      reason: A dispatcher can execute only a grant already present in the resolved Sprint Agent ToolSet; intent persistence grants no Tool authority.
    - mechanism: model-recipe-resolver
      decision: reuse
      reason: Core renders no company message and selects no model; any later templating or model task remains a reviewed Workspace profile and exact Instance route.
    - mechanism: company-records
      decision: extend
      reason: The existing provider-neutral records schema already owns operational projections and durable timers, and is extended additively with Sprint events, state, and intents rather than creating another database schema.
    - mechanism: identity-and-authorization
      decision: reuse
      reason: Normalized events carry no implied human authority, and all later Tool execution still resolves authenticated subjects and exact resource grants through existing controls.
    - mechanism: timers-and-business-time
      decision: extend
      reason: Existing deterministic business-time calculations and durable timers are connected to the same Sprint event-processing boundary without an in-process clock or company cadence in Core.
    - mechanism: approvals-effects-and-idempotency
      decision: extend
      reason: Optimistic state commits, stable event and intent identities, intent leases, durable outcomes, and timer receipts close orchestration replay windows before the existing Tool effect claims handle provider mutation.
    - mechanism: capability-contracts-and-connectors
      decision: reuse
      reason: Sprint orchestration invokes no provider SDK and adds no Connector; a supplied dispatcher must reach external systems only through existing Capability and Connector contracts.
  new_core_mechanisms:
    - Provider-neutral Sprint orchestration store with atomic event, state, evidence, and intent commits.
    - Leased Sprint intent work queue with explicit succeeded, failed, retry, and cancellation outcomes.
    - Runner-neutral Sprint orchestration service that consumes durable timers and delegates claimed intents through an injected CompanyOSRuntime-backed dispatcher.
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: >-
    The orchestration accepts only generic Sprint declarations, normalized
    events, controlled calendar facts, durable stores, and an injected dispatch
    adapter. Every company can supply different providers, record projections,
    people, cadence, templates, Tools, and bindings without changing Core.
