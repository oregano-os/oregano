architecture:
  placement:
    core: Optimize maintained database qualification and the hosted Sprint reader.
    packages: Reuse existing Tools and profiles without a new Package or Blueprint.
    workspace: Preserve operating policy and source declarations unchanged.
    instance: Reuse the existing database, bindings and qualification lifecycle.
  mechanisms_extended:
    - mechanism: company-records
      reason: Use the existing complete-query option in the hosted Sprint consumer.
    - mechanism: capability-contracts-and-connectors
      reason: Return compact equivalent evidence from the existing database adapter.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Any Company Instance benefits without company-specific code,
    configuration, provider permissions or consumer migration.
rollback: Restore the preceding exact Core deployment. No schema or data migration
  is needed; retain existing records, qualification and deployment evidence.
