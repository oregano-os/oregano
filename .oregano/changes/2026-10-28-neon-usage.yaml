version: 3
plan_id: neon-usage-2026-10-28
created: "2026-10-28"
title: Release Core 0.17.3 with bounded immutable reads and change-only sync events
objective: Reduce repeated database transfers and unchanged polling event growth while retaining scan proofs, historical workflows and projection repair.
non_goals:
  - Delete immutable historical evidence or change business schedules and recipients.
  - Disable active historical workflows or weaken source qualification.
placement: core
change_class: security
files_expected:
  - package.json
  - packages/records/synchronization.ts
  - packages/records/reconciliation.ts
  - packages/state-postgres/artifact-cache.ts
  - packages/state-postgres/workflow-store.ts
  - packages/runtime/workflow-engine/record-workers.ts
  - packages/runner-vercel/src/lib/workflow-records.ts
  - packages/testkit/fixtures/workflow-engine-postgres.test.ts
  - packages/testkit/tests/**
  - packages/cli/tests/**
  - packages/testkit/fixtures/*/.companyos/compatibility.yaml
  - docs/specifications/company-records-and-sprint-v0.1-draft.md
  - docs/operations/workflow-engine.md
  - docs/_generated/**
  - .oregano/changes/2026-10-28-neon-usage.yaml
tests:
  - packages/testkit/tests/company-records-foundation.test.ts
  - packages/testkit/tests/workflow-record-workers.test.ts
  - packages/testkit/tests/workflow-artifact-cache.test.ts
  - packages/testkit/tests/workflow-state-postgres.test.ts
documentation_impact:
  required: true
  affected_documents: [specification.company-records-sprint-v0.1, operations.workflow-engine]
architecture:
  placement:
    core: Optimize existing Records snapshot ingestion and immutable Postgres Artifact reads with bounded database-scoped caching.
    packages: Existing source adapters and workflow contracts remain unchanged.
    workspace: Retain company sources, projections, contributors and business schedule declarations.
    instance: Deploy the exact release; preserve database evidence and retained active generations. No destructive maintenance is automated.
  mechanisms_extended:
    - mechanism: company-records
      reason: Reuse complete inventory receipts and current-version fencing rather than create redundant source events for identical observations.
    - mechanism: timers-and-business-time
      reason: Reuse durable per-poll receipts across identical qualified generations while preserving continuation and retry semantics.
    - mechanism: approvals-effects-and-idempotency
      reason: Retain immutable validated Artifacts scoped to database identity; never cache failed or missing reads or mutate execution/effect evidence.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Any Company Instance with repeated inventories or retained workflow versions benefits without provider-specific or company-specific policy.
rollback: Deploy the previous Core and Workspace pair. Database schema and retained evidence are unchanged. Cache eviction or process restart only increases reads. Historical cleanup requires separately verified retention and restoration evidence.
