version: 2
plan_id: sprint-weekly-runtime-completion-2026-09-04
status: approved
author: codex-agent
created: 2026-09-04
title: Complete the hosted provider-neutral Sprint week runtime
objective: >-
  Complete the hosted Sprint runtime beyond Friday Close by compiling and
  executing the reviewed Monday handoff, weekday digest, Wednesday readiness
  inventory and reversible secondary readiness status, structured NEXT WEEK carry-forward, focused Sprint direct
  conversations, frozen reversible briefing proposals, and separately
  approved frozen-list Rollover through the standard CompanyOS Tool,
  authorization, idempotency, evidence, and provider receipt boundaries.
non_goals:
  - Add any company person, provider resource id, status label, schedule time, message copy, model name, or credential to Core.
  - Enable production schedules, provider writes, Slack messages, or a Company rollout.
  - Add Monday card chat, board-change webhooks, automatic Issue creation, priority decisions, people scoring, or autonomous work execution.
  - Archive full Slack or Monday transcripts.
placement: core
change_class: security
vision_principles_affected:
  - Company truth is not Core product truth
  - Authority remains in the Company Workspace
  - Humans remain accountable
  - No hidden magic
