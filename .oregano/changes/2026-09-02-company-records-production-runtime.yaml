version: 2
plan_id: company-records-production-runtime-2026-09-02
status: approved
author: codex-agent
created: 2026-09-02
title: Add a governed production runtime for Company Records
objective: >-
  Promote the already rehearsed Company Records mechanisms into a separate,
  fail-closed production runtime that can apply the additive database manifest,
  perform exact-confirmation initial synchronization, run immutable scheduled
  reconciliation, and expose payload-free status evidence while preserving
  exact Core, Workspace, Instance, provider-resource, and SecretRef bindings.
non_goals:
  - Deploy or activate a real Company Instance, change a provider resource, read a company board, or migrate a production database in this Core change.
  - Reuse the Preview-only rehearsal endpoint in production or weaken its Preview guard.
  - Add company identifiers, people, schedules, field mappings, credentials, or approval values to Core Git.
  - Treat a conversational Monday Agent callback as a verified board-change event subscription.
  - Enable Agent-visible messages or provider writes.
placement: core
change_class: security
vision_principles_affected:
  - A company-independent Core
  - Human authority is explicit
  - Evidence beats claims
  - The runtime is replaceable
  - Onboarding has no hidden steps
