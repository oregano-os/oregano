version: 3
plan_id: decision-conversation-root-2026-09-13
created: 2026-09-13
title: Let a private decision card root its own conversation
objective: Allow a private human decision notice to be the root of the following thread replies and collection, with its affirmative control linking to that own thread and an optional readable card title.
non_goals:
  - Change decision authority, recipient qualification or approval risk rules.
  - Remove continue_in navigation or the historical generic heading for existing workflows.
  - Add company-specific wording or activate any Workspace schedule.
placement: core
change_class: security
