architecture:
  placement:
    core: Reuse the Instance parser and Artifact builder for deterministic path resolution,
      validation, setup materialization and conflict checks.
    packages: Keep portable Packages free of company Instance identities and bindings.
    workspace: Store the exact non-secret declaration beside governance and compatibility
      under existing security review and CODEOWNERS protection.
    instance: Retain runtime authority, secrets, receipts, state and deployment; its reviewed
      non-secret declaration is physically stored in the Workspace.
  mechanisms_extended: []
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Every company uses the same path and format while retaining its own
    exact bindings; no provider-specific orchestration or company data enters Core.
rollback: Restore the previous reviewed Core and Workspace commits and retained immutable
  deployment. No live state or provider migration is performed by this change.
open_decisions: []
