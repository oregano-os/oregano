version: 3
plan_id: workspace-instance-configuration-2026-09-09
created: 2026-09-09
title: Version the non-secret Instance declaration alongside Workspace governance
objective: Establish .companyos/instance.yaml as the canonical non-secret Instance
  declaration, resolve it during builds, validate it during Workspace checks, and include
  it in reviewed setup commits instead of generating mutable out-of-repository
  configuration at deployment time. Require the canonical file in CLI and hosted builds,
  remove external YAML transport and retired setup state formats, and retain exact
  running-Artifact authority for hosted compilation. Release the incompatible
  contract as Core 0.9.0 with Workbench 0.1.0-experimental.19; Company Workspace
  adoption and production receipts remain in their private repositories.
non_goals:
  - Store credentials, provider receipts, operational state or deployment code in Git.
  - Change provider permissions, agent routing semantics, business policy or live
    deployments.
  - Introduce an instances directory, environment overlays or a new configuration format.
placement: core
change_class: security
