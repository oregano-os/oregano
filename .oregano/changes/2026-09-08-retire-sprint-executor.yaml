documentation_impact:
  required: true
  affected_documents: [specification.company-records-sprint-v0.1, specification.workflow-execution-v1, operations.workflow-engine, operations.vercel-workflow-runner, guide.prepare-instance, status.current]
architecture:
  placement:
    core: Remove the obsolete executor and retain the company-neutral workflow engine and its controls.
    packages: Preserve portable Agent materials and synthetic workflow fixtures without executor dependencies.
    workspace: Own business interpretation, schedules and authored workflows.
    instance: Retain audit history and exact rollback pair; deploy and qualify only the reviewed test candidate.
  mechanisms_extended:
    - mechanism: agent-resolver
      reason: Remove retired model and direct-conversation special cases while retaining generic Agent routing.
    - mechanism: timers-and-business-time
      reason: Remove obsolete worker registration while preserving general durable timers and calendars.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Any company may run declared workflows without a domain-specific execution branch or provider-specific business logic.
rollback: Restore the retained exact Core and Workspace pair; historical database rows and publication receipts are not deleted or rewritten.
