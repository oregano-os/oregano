version: 3
plan_id: retire-sprint-executor-2026-09-08
created: "2026-09-08"
title: Remove the retired domain executor and preserve declared workflow execution
objective: Remove all retired Sprint execution paths while preserving general runtime guarantees and portable Workspace workflows.
non_goals:
  - Delete historical database audit data or activate production.
  - Remove generic Records, work-item, communication, decision, calendar or conversation contracts.
  - Put company-specific operating rules or test identities in Core.
