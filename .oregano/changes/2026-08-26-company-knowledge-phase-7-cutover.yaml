version: 1
plan_id: company-knowledge-phase-7-cutover-2026-08-26
status: approved
author: codex-agent
created: 2026-08-26
title: Implement provider-neutral database preparation and live cutover evidence
objective: >-
  Make setup distinguish an absent database from an existing database upgrade,
  qualify the complete schema through a profile-owned SecretRef executor,
  produce deterministic cutover and export evidence, and apply the additive
  manifest to the linked Company Instance without exposing credentials.
non_goals:
  - Make Vercel or Neon part of the Core database lifecycle contract.
  - Activate an external Source without its exact qualified binding and SecretRefs.
  - Claim a model, Connector, backup, or rollback is live without its own evidence.
placement: core
change_class: security
vision_principles_affected:
  - A company-independent Core
  - Evidence beats claims
  - The runtime is replaceable
  - Safety cannot be weakened from a Workspace
files_expected:
  - .oregano/changes/2026-08-26-company-knowledge-phase-7-cutover.yaml
  - INSTALL-COMPANYOS.md
  - docs/_generated/document-registry.json
  - docs/_generated/navigation.json
  - docs/architecture/company-instance.md
  - docs/architecture/system-boundaries.md
  - docs/compatibility/registry.yaml
  - docs/onboarding/README.md
  - docs/onboarding/company-workspace.md
  - docs/plans/2026-08-25-company-knowledge-implementation.md
  - docs/specifications/company-instance-release-and-promotion-v0.1-draft.md
  - docs/specifications/company-knowledge-v0.2-draft.md
  - docs/status/current.md
  - docs/workbench/commands/setup.md
  - docs/workbench/commands/verify-live.md
  - packages/cli/src/cli.mjs
  - packages/cli/src/live-setup.mjs
  - packages/cli/tests/live-setup.test.mjs
  - packages/state-postgres/database-bootstrap.ts
  - packages/knowledge/cutover.ts
  - packages/testkit/tests/company-knowledge-cutover.test.ts
required_approvals:
  - oregano-maintainer
approvals:
  - role: oregano-maintainer
    approver: fylingpete
    approved_at: 2026-08-26
    evidence: explicit-user-instructions-in-codex-task-to-develop-through-phase-8-and-run-the-live-neon-migration
validation:
  - pnpm companyos plan --check .oregano/changes/2026-08-26-company-knowledge-phase-7-cutover.yaml
  - pnpm companyos inspect-core --plan .oregano/changes/2026-08-26-company-knowledge-phase-7-cutover.yaml
  - pnpm docs:check
  - pnpm typecheck
  - node --experimental-strip-types --test packages/testkit/tests/company-knowledge-cutover.test.ts packages/testkit/tests/company-database-bootstrap.test.ts
  - run database prepare twice through the linked production SecretRef executor
  - run database verify in a separate read-only production process
  - pnpm check
  - git diff --check
tests:
  - An absent database reports bootstrap while an existing earlier manifest reports upgrade.
  - An already current database reports verify and never pretends to be a first bootstrap.
  - Secret values do not enter preparation, qualification, cutover, or export receipts.
  - Cutover refuses missing schema, ACL, Source, model, Handbook, backup, or regression evidence.
  - Deterministic export ledgers bind durable object and receipt identities without model reruns.
documentation_impact:
  required: true
  affected_documents:
    - architecture.boundaries
    - architecture.company-instance
    - onboarding.company-workspace
    - onboarding.index
    - plan.company-knowledge-implementation
    - specification.company-instance-release-promotion-v0.1
    - specification.company-knowledge-v0.2
    - status.current
    - command.setup
    - command.verify-live
migration: >-
  The linked production Company Instance was upgraded additively through the
  existing Vercel-owned SecretRef transport to companyos-postgres@1.3.0. The
  same manifest and digest qualified twice, followed by a separate read-only
  verification. No table or data was removed and no credential was persisted.
rollback: >-
  Disable new Knowledge writers and retrieval, retain newly accepted evidence,
  return to the prior active Handbook and runtime snapshot, and restore the
  pre-cutover database backup if schema recovery is required. Additive schema
  objects remain dormant unless a separately approved deletion is performed.
open_decisions:
  - Real GitHub and meeting-source synchronization still requires exact approved Source bindings and SecretRefs.
  - Production model profile qualification and a tested database backup/restore receipt remain cutover blockers.
