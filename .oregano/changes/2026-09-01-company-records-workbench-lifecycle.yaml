version: 2
plan_id: company-records-workbench-lifecycle-2026-09-01
status: implemented
author: codex-agent
created: 2026-09-01
title: Add the provider-neutral Company Records source lifecycle to the Workbench
objective: >-
  Add one provider-neutral Company Records Workbench surface for inspecting
  Workspace declarations, reusing provider qualification evidence,
  materializing an explicitly authored source declaration, synchronizing or
  reconciling a complete qualified source inventory into the existing Company
  Instance database, and reporting durable source status without exposing
  credentials or embedding provider-specific workflow policy in Core.
non_goals:
  - Connect to, mutate, or activate a real company provider or database as part of this repository change.
  - Infer company field mappings, record types, access groups, schedules, provider resources, or production rollout decisions.
  - Make synchronized records curated Company Knowledge, Workspace authority, or provider authority.
  - Add provider writes, Agent provisioning, scheduled execution, webhook activation, or automatic Git commits.
  - Implement maintained record-source adapters for providers other than Monday in this change.
placement: core
change_class: security
vision_principles_affected:
  - A company-independent Core
  - Human authority is explicit
  - Files are the review surface
  - Evidence beats claims
  - The runtime is replaceable
  - Onboarding has no hidden steps
  - Documentation is part of the system
