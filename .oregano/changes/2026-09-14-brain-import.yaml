version: 3
plan_id: brain-import-2026-09-14
created: 2026-09-14
title: Account for bounded resumable source processing
objective: Extend the existing scoped generation path with durable per-attempt
  usage evidence, Workspace-configured bounded import selection and
  metadata-only Google Meet discovery through a fixed read-only provider
  boundary. Preserve generic Core and runtime authority while composing the
  prior Brain increments.
non_goals:
  - Claim automatic source ingestion or live company adoption before their later
    increments.
  - Bypass repository protection or use application release machinery for
    knowledge commits.
  - Introduce a second identity, model, scheduler, repository authentication or
    authoritative knowledge database.
  - Compile mutable Brain content into Agent instructions or treat retrieved
    text as authority.
