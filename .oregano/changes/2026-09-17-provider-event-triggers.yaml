version: 3
plan_id: provider-event-triggers-2026-09-17
created: 2026-09-17
title: Open declared workflows from verified provider board events
objective: Add an event trigger kind beside schedule and operator so a Workspace can open a declared workflow when a verified Monday board event arrives, using the same declaration, activation, identity and hosting structure as calendars.
non_goals:
  - Register a Monday webhook, activate an event source or change any live Instance.
  - Change existing scheduled or operator openings, their identities or hosted behavior.
  - Interpret provider payload content as authority; the reread Company Record remains the evidence.
  - Add Slack or other provider event ingress; the contract is provider-neutral, only the Monday adapter is maintained.
