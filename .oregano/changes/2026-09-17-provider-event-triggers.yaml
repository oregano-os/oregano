architecture:
  placement:
    core: The event trigger kind, event-source declaration contract, event opening identity, hosted event ingress verification and the maintained Monday board-event adapter.
    packages: The Monday Connector gains a board-event parser; the standard Tools, Capabilities and Records service are unchanged.
    workspace: Which board, which event kinds, which workflow opens and what it does with the card stay declared in events/ and workflows/; activation stays blocked until the Workspace decides.
    instance: The exact webhook credential, the enabled event workflows and the Monday resource-to-board binding are Instance hosting configuration, never Git content.
  mechanisms_extended:
    - mechanism: timers-and-business-time
      reason: Event openings reuse the same opening path, instance-key identity, origin deduplication and calendar-derived run date as scheduled occurrences; an event source is the non-temporal sibling of a schedule.
    - mechanism: approvals-effects-and-idempotency
      reason: Provider event identity becomes the run origin key; redelivery reuses the run, changed input under the same identity conflicts, and the durable replay claim rejects repeated deliveries before any opening.
    - mechanism: capability-contracts-and-connectors
      reason: The Monday Connector already verifies agent callbacks and suppresses self-authored echoes; the board-event parser and actor-based echo suppression extend that adapter instead of adding provider logic to the engine.
    - mechanism: identity-and-authorization
      reason: Event openings run under the configured accountable schedule principal and the Instance enablement list; no caller-supplied principal, workflow or fields.
    - mechanism: company-records
      reason: The opened workflow reads the card through the existing Records scan wait; the event payload only carries identity and is never substituted for the current record.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Any Company Workspace that keeps work items in a provider board can open a declared workflow per created or moved item without polling; the event-source contract names only logical resource bindings and normalized event kinds, so another provider adapter can supply the same normalized event.
rollback: Revert for new deployments; existing scheduled and operator runs are unaffected. Retained event-opened runs keep their identity and can be drained with this runtime. Unregistering the provider webhook stops deliveries without deleting retained evidence.
