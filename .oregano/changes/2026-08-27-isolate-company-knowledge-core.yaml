status: approved
author: codex-agent
created: 2026-08-27
title: Isolate the Company Knowledge capability from unrelated Core work
objective: >-
  Reconstruct the implemented Company Knowledge and Company Brain capability
  on a clean origin/main base so it can be reviewed and merged independently
  from Builder ACP and the Product Manager Blueprint.
non_goals:
  - Remove, rewrite, merge, or force-push the existing Builder, Product Manager, or mixed Knowledge branches.
  - Change Company Knowledge authority, authorization, retention, or publication rules.
  - Activate an Instance source, model, schedule, deployment, or production cutover.
  - Include Builder ACP runtime code or the Product Manager Blueprint in this branch.
placement: core
change_class: security
vision_principles_affected:
  - A company-independent Core
  - Human authority is explicit
  - Evidence beats claims
  - Safety cannot be weakened from a Workspace
  - The runtime is replaceable
  - Documentation is part of the system
  - Knowledge authority stays reviewed and singular
