version: 3
plan_id: builder-user-tests-2026-09-10
created: "2026-09-10"
title: Implement user-selected Builder tests and four-action result cards
objective: >-
  Separate current-message development intent from review questions, expose actual
  build and test context and image attachments, bind fresh user-started conversations
  to one selected candidate per company user, retain independent histories, and
  provide Go Live, Discard Build, Open Test Channel and Request Changes on one card.
  Freeze tested evidence on publication and support requester-authorized discard
  through the trusted repository boundary. Keep lifecycle and presentation decisions
  independent of the chat provider, coding profile and execution host.
non_goals:
  - Implement simulation, general workflow dialogs, Preview provisioning or bounded live trials.
  - Broaden provider permissions or allow conversational Tools in the interactive test.
  - Automatically approve a human's result or activate an untested company change.
