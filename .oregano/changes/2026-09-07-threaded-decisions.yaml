version: 3
plan_id: threaded-decisions-2026-09-07
created: "2026-09-07"
title: Keep human decisions in their conversation and resume accepted runs
objective: Let Workspaces explicitly target an existing private conversation for a human decision, bind both parent and notice identity, and resume the persisted run after recording a button decision.
non_goals:
  - Add provider events, scopes, credentials or business authority.
  - Change direct-message routing or enable production workflows.
placement: core
change_class: security
