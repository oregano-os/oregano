documentation_impact:
  required: true
  affected_documents:
    - specification.workflow-execution-v1
    - guide.author-workflow
    - operations.vercel-workflow-runner
architecture:
  placement:
    core: Extend decision delivery identity and resume the existing engine after durable human acceptance.
    packages: No new Package behavior.
    workspace: Choose the prior conversation explicitly on Triage and Briefing human steps.
    instance: Retain exact delivery receipts and runnable cursors; qualify immediate continuation and recurring recovery in the isolated environment.
  mechanisms_extended:
    - mechanism: identity-and-authorization
      reason: Bind the exact parent, review message and human without replacing the existing conversation assignment.
    - mechanism: approvals-effects-and-idempotency
      reason: Resume the existing persisted cursor after acceptance and preserve effect claims on retries.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Any company workflow can place human review in its existing conversation and resume through maintained effect controls.
rollback: Restore prior host and Workspace declarations together; retain stored Artifacts, decisions and receipts. Never reopen completed runs.
