documentation_impact:
  required: true
  affected_documents: [operations.vercel-workflow-runner, operations.workflow-engine, specification.workflow-execution-v1, guide.author-workflow, status.current]
architecture:
  placement:
    core: Extend versioned decision rendering and authenticated reply routing with a finite provider-neutral selection service.
    packages: No new Package behavior.
    workspace: Declare a complete readable review; retain questions, proposals and business effects.
    instance: Persist finite choice snapshots in existing durable key/value state; keep provider verification in the adapter.
  mechanisms_extended:
    - mechanism: identity-and-authorization
      reason: Revalidate exact sender, original message, destination and selected live assignment before routing.
    - mechanism: approvals-effects-and-idempotency
      reason: Keep full bound values and historical notice inputs; freeze and atomically select immutable numbered options.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Any company can use readable reviews and any communication adapter can reuse the selection service without business or provider assumptions.
rollback: Restore the previous deployed pairing while retaining historical Artifacts and receipts; leave finite choice records to expire and never infer or replay human approvals.
