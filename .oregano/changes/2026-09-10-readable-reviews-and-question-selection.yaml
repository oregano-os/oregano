version: 3
plan_id: readable-reviews-and-question-selection-2026-09-10
created: "2026-09-10"
title: Readable decision reviews and resolvable conversation choices
objective: Keep exact decision payloads internal when a complete Workspace review is declared and resolve an authenticated numbered choice to the original answer and active conversation.
non_goals:
  - Infer approval, broaden Tools, or change business workflows in Core.
  - Migrate old conversations or enable production.
placement: core
change_class: security
