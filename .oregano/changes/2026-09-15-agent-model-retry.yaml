version: 3
plan_id: agent-model-retry-2026-09-15
created: 2026-09-15
title: Attribute explicit retries of unavailable Agent model responses
objective: Let an authenticated operator authorize one further model attempt after
  an unavailable response, retaining the unknown charge and complete conversation.
non_goals:
  - Automatically retry unknown outcomes or relabel unknown usage as zero.
  - Repeat any Tool call, reset a source or replace its immutable instructions.
placement: core
change_class: security
files_expected:
  - .oregano/changes/2026-09-15-agent-model-retry.yaml
  - .oregano/changes/2026-09-14-brain-import.yaml
  - packages/runtime/workflow-engine/engine.ts
  - packages/runtime/workflow-engine/agent-execution.ts
  - packages/runtime/workflow-engine/agent-state.ts
  - packages/state-store/workflow-engine.ts
  - packages/runner-vercel/src/lib/workflow-http.ts
  - packages/testkit/tests/workflow-agent.test.ts
  - docs/operations/workflow-engine.md
  - docs/specifications/workflow-execution-v1-draft.md
  - docs/specifications/brain-import.md
  - docs/status/current.md
  - docs/_generated/**
tests:
  - packages/testkit/tests/workflow-agent.test.ts
documentation_impact:
  required: true
  affected_documents:
    - operations.workflow-engine
    - specification.workflow-execution-v1
    - specification.brain-import
    - status.current
architecture:
  placement:
    core: Lease-fenced operator authorization, immutable journal proof and bounds.
    packages: Existing Agent procedure; no new business or model policy.
    workspace: Existing Agent instructions and finite task budgets remain exact.
    instance: Authenticated operator, current source scope, attempts and retry receipt.
  mechanisms_extended:
    - mechanism: approvals-effects-and-idempotency
      reason: Attribute a further paid generation attempt only after proving that
        the unavailable response had no retained or dispatched Tool calls.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Any bounded Agent task may recover a provider timeout through
    the same explicit operator control without losing prior work or charge evidence.
rollback: Disable operator retries. Retain all attempts and immutable authorization
  receipts; ordinary resume must still stop at an unauthorized unknown response.
