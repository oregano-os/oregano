version: 3
plan_id: release-builder-v0.11.0-2026-09-10
created: "2026-09-10"
title: Release user-selected Builder tests and four-action result cards
objective: >-
  Publish Core 0.11.0 and Workbench 0.1.0-experimental.21 from reviewed PR 112.
  The minor increment introduces user-selected multi-conversation tests and
  trusted Discard Build, and replaces the Finish/Restart contract with four
  visible actions and direct exact-result acceptance. Distribute matching Guides.
non_goals:
  - Add simulation, Tool-using interactive tests, Preview provisioning or live trials.
  - Change any Company Instance through the Core release commit alone.
  - Treat synthetic tests as a human's functional acceptance or provider proof.
placement: core
change_class: security
files_expected:
  - .oregano/changes/2026-09-10-release-builder-v0.11.0.yaml
  - package.json
  - packages/cli/package.json
  - packages/cli/tests/live-setup.test.mjs
  - packages/cli/tests/workbench.test.mjs
  - packages/testkit/fixtures/acme-casas/.companyos/compatibility.yaml
  - packages/testkit/fixtures/lindenhof-studio/.companyos/compatibility.yaml
  - docs/status/current.md
  - docs/_generated/document-registry.json
tests:
  - packages/cli/tests/workbench.test.mjs
  - packages/cli/tests/live-setup.test.mjs
  - packages/runner-vercel/src/lib/builder/guided-experience.test.ts
  - packages/testkit/tests/builder-release-postgres.test.ts
documentation_impact:
  required: true
  affected_documents:
    - status.current
architecture:
  placement:
    core: Version and distribute the reviewed generic Builder runtime and its matching Workbench.
    packages: Keep existing Blueprint and Connector contracts; publish the updated Guides under a new Workbench version.
    workspace: Adopt exact Core and Workbench pins in a separately reviewed company upgrade.
    instance: Qualify the exact image and staged deployment before an explicitly authorized promotion.
  mechanisms_extended: []
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: All companies and coding profiles use the same released code and contract, with company policy and destinations supplied independently.
rollback: >-
  No database DDL, company business-file or provider permission migration is required.
  Instance adoption needs matching pins and a newly qualified image and deployment.
  Before rollback to Core 0.10.0, stop new tests and publication, resolve uncertain
  discard operations and preserve multi-conversation histories, selection, receipts
  and exact acceptance evidence. Do not reinterpret an unfinished test as accepted.
  Retain the preceding exact Artifact and deployment. Rollback does not undo
  provider effects. Hosted qualification and human acceptance remain separate
  from source CI and are recorded by the adopting Instance.
open_decisions: []
