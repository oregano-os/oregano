version: 2
plan_id: vercel-connect-record-source-credential-2026-09-05
status: approved
author: codex-agent
created: 2026-09-05
title: Reuse Vercel Connect credentials for Slack Record Sources
objective: >-
  Let the maintained Vercel Runner resolve the existing app-scoped Slack
  credential from Vercel Connect for a governed Slack Record Source, without
  exporting, persisting, or duplicating the bot token.
non_goals:
  - Change Slack scopes, install another Slack app, or expose a provider token.
  - Add company-specific channels, schedules, people, or retention policy to Core.
  - Change the provider-neutral Company Records or SecretRef contracts.
placement: core
change_class: security
vision_principles_affected:
  - A company-independent Core
  - The runtime is replaceable
  - Security before autonomy
  - Evidence beats claims
files_expected:
  - .oregano/changes/2026-09-05-vercel-connect-record-source-credential.yaml
  - docs/architecture/oregano-core.md
  - docs/workbench/guides/connect-company-record-source.md
  - docs/workbench/guides/prepare-an-instance.md
  - packages/cli/content/guides/connect-company-record-source.md
  - packages/cli/content/guides/prepare-an-instance.md
  - packages/connectors/slack/records-source.ts
  - packages/runner-vercel/src/lib/company-records-rehearsal.ts
  - packages/runner-vercel/src/lib/record-source-credential.ts
  - packages/runner-vercel/src/lib/record-source-credential.test.ts
required_approvals:
  - oregano-maintainer
approvals:
  - role: oregano-maintainer
    approver: workspace-steward
    approved_at: 2026-09-05
    evidence: explicit-standing-authorization-to-complete-the-approved-production-rollout-without-repeating-normal-commit-pr-or-merge-gates
architecture_assessment:
  responsibilities:
    core:
      - Keep Slack Record Source credentials behind an asynchronous SecretRef resolver.
      - Let the maintained Vercel Runner exchange its trusted deployment identity for the existing app-scoped Vercel Connect token.
    packages:
      - No package asset changes; this patch affects only the maintained provider connector and Vercel Runner adapter.
    workspace:
      - Continue declaring only the logical Slack source and projection.
    instance:
      - Select direct SecretRef resolution or the Vercel Connect app-token provider and bind the exact connector resource.
  existing_mechanisms:
    - mechanism: agent-resolver
      decision: reuse
      reason: Credential resolution does not change deterministic Agent routing.
    - mechanism: toolset-resolver
      decision: reuse
      reason: Record Source reads remain privileged synchronization operations rather than Agent Tools.
    - mechanism: model-recipe-resolver
      decision: reuse
      reason: Credential exchange and source normalization do not invoke a model.
    - mechanism: company-records
      decision: reuse
      reason: Source synchronization, qualification, receipts, and projections do not change.
    - mechanism: identity-and-authorization
      decision: reuse
      reason: Trusted Vercel deployment identity obtains only the already installed app-scoped Slack credential; company principals and permissions do not change.
    - mechanism: timers-and-business-time
      decision: reuse
      reason: Source reconciliation schedules and business-time behavior do not change.
    - mechanism: approvals-effects-and-idempotency
      decision: reuse
      reason: The source remains read-only and existing synchronization receipts and idempotency controls remain authoritative.
    - mechanism: capability-contracts-and-connectors
      decision: extend
      reason: The maintained Slack connector accepts an asynchronous credential broker while its provider-neutral record contract stays unchanged.
  new_core_mechanisms:
    - One Vercel-Runner credential resolver for direct environment credentials or app-scoped Vercel Connect tokens.
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: >-
    Any Vercel-hosted Company Instance may reuse its existing Slack Vercel
    Connect installation for Record Sources. Other runners and providers keep
    their own credential brokers behind the unchanged connector boundary.
validation:
  - pnpm companyos plan --check .oregano/changes/2026-09-05-vercel-connect-record-source-credential.yaml
  - pnpm companyos inspect-core --base origin/main --plan .oregano/changes/2026-09-05-vercel-connect-record-source-credential.yaml
  - pnpm docs:check
  - pnpm public:check
  - pnpm typecheck
  - pnpm runner:typecheck
  - pnpm test
  - pnpm runner:build
  - git diff --check
tests:
  - Direct environment SecretRefs remain supported without behavior changes.
  - Vercel Connect resolution requests one app-scoped token using only the configured connector handle.
  - Missing handles, unsupported providers, and empty issued credentials fail closed.
  - Slack qualification and complete inventory reads await the credential without returning or persisting it.
documentation_impact:
  required: true
  affected_documents:
    - architecture.oregano-core
    - guide.connect-company-record-source
    - guide.prepare-instance
  reason_if_none: ""
migration: >-
  Additive and inactive by default. Existing env-backed bindings behave exactly
  as before. A Vercel Instance opts in with credential_provider:
  vercel-connect-app and points secret_ref at its SLACK_CONNECTOR handle.
rollback: >-
  Revert the Runner and restore a direct environment-backed binding if one is
  available. Existing source observations, watermarks, and proof receipts remain.
open_decisions: []
