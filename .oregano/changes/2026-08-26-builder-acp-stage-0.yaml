version: 1
plan_id: builder-acp-stage-0-2026-08-26
status: approved
author: codex-agent
created: 2026-08-26
title: Qualify the Builder ACP and execution-provider boundary
objective: >-
  Prove a minimal provider-neutral Builder execution contract and a bounded ACP
  v1 conformance path for exactly pinned Claude Code and Codex profiles before
  integrating the Builder Agent into the production Runner or granting proposal
  publication authority.
non_goals:
  - Expose the Builder Agent in Slack or another production communication surface.
  - Add production Builder jobs, database migrations, Agent Bindings, or Agent resolution.
  - Grant a coding agent Git write, merge, deployment, production-provider, or production-database credentials.
  - Create a public execution-provider registry or a general AgentRuntimeAdapter.
  - Add silent native fallbacks when an ACP profile fails qualification.
placement: core
change_class: security
vision_principles_affected:
  - A company-independent Core
  - Human authority is explicit
  - Evidence beats claims
  - The runtime is replaceable
  - No hidden provider coupling
files_expected:
  - .oregano/changes/2026-08-26-builder-acp-stage-0.yaml
  - docs/plans/2026-08-26-builder-acp-mvp-implementation.md
  - docs/status/current.md
  - docs/workbench/guides/operate-builder.md
  - packages/cli/content/guides/operate-builder.md
  - packages/runtime/builder/**
  - packages/runner-vercel/package.json
  - packages/runner-vercel/src/lib/builder/**
  - packages/testkit/adapter/in-memory-builder-execution.ts
  - packages/testkit/fixtures/acp/**
  - packages/testkit/tests/builder-execution.test.ts
  - package.json
  - pnpm-lock.yaml
required_approvals:
  - oregano-maintainer
approvals:
  - role: oregano-maintainer
    approver: fylingpete
    approved_at: 2026-08-26
    evidence: explicit-user-instruction-in-codex-task-to-start-the-approved-builder-technical-spike
validation:
  - pnpm companyos plan --check .oregano/changes/2026-08-26-builder-acp-stage-0.yaml
  - pnpm companyos inspect-core --plan .oregano/changes/2026-08-26-builder-acp-stage-0.yaml
  - pnpm docs:check
  - pnpm typecheck
  - pnpm runner:typecheck
  - pnpm runner:build
  - node --experimental-strip-types --test packages/testkit/tests/builder-execution.test.ts
  - node --experimental-strip-types packages/runtime/builder/qualify-acp.ts claude-code
  - node --experimental-strip-types packages/runtime/builder/qualify-acp.ts codex
  - node --experimental-strip-types packages/runner-vercel/src/lib/builder/qualify-sandbox.ts
  - node --experimental-strip-types packages/runner-vercel/src/lib/builder/qualify-sandbox-timeout.ts
  - node --experimental-strip-types packages/runner-vercel/src/lib/builder/qualify-brokered-acp.ts claude-code
  - node --experimental-strip-types packages/runner-vercel/src/lib/builder/qualify-brokered-acp.ts codex
  - node --experimental-strip-types packages/runner-vercel/src/lib/builder/qualify-private-repository.ts
  - git diff --check
tests:
  - The execution contract starts, observes, cancels, collects, and disposes a job without provider-specific values in its public records.
  - The conformance fake proves idempotent cancellation, terminal-result collection, cleanup, timeout, and fail-closed behavior.
  - Each supported ACP profile records an exact implementation and version and rejects missing, floating, or unsupported versions.
  - ACP qualification proves initialization, a fresh session, structured updates, denied permissions, cancellation, deterministic shutdown, and an independently readable diff.
  - Sandbox qualification proves the digest-pinned lifecycle, deny-all egress, bounded filesystem and command execution, and one provider-side credential transform without a real credential.
  - Parallel duplicate delivery returns one named execution, a replacement coordinator recovers it, and provider timeout, cancellation, result collection, and cleanup remain deterministic.
  - Brokered-authentication and private-repository harnesses reject missing dedicated qualification inputs before creating a provider resource.
  - Failure of one profile cannot silently select another profile or protocol.
documentation_impact:
  required: true
  affected_documents:
    - status.current
    - guide.operate-builder
    - plan.builder-acp-mvp-implementation
rollback: >-
  Remove the isolated Stage-0 Builder files, exact experimental dependencies,
  tests, and qualification evidence. No Company Workspace, Company Instance,
  database, deployment, or external provider state is changed.
open_decisions:
  - Whether the hosted Runner bundles a pinned Git implementation or delegates repository-only commands to a separate trusted Sandbox that never runs the coding agent.
  - Whether model-backed representative Builder jobs stay within the required duration and cost envelope and recover cleanly from a process crash during an ACP prompt.
