version: 3
plan_id: published-conversation-context-2026-09-08
created: "2026-09-08"
title: Preserve published messages as provider-neutral conversation evidence
objective: Let authenticated follow-up questions use exact delivered messages and their owning Agent after workflow completion without gaining execution authority.
non_goals:
  - Add company reporting rules, provider SDKs or address parsing to the generic context reader.
  - Grant new effects, reopen completed workflows or infer decisions from ordinary replies.
  - Claim unimplemented communication providers are production-ready or reconstruct old publications from mutable facts.
placement: core
change_class: security
