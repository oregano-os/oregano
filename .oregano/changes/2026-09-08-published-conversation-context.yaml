documentation_impact:
  required: true
  affected_documents: [specification.workflow-execution-v1, operations.workflow-engine, operations.vercel-workflow-runner, guide.author-workflow, status.current]
architecture:
  placement:
    core: Resolve bounded publication evidence independently of execution context using existing delivery state.
    packages: No new business template or Skill.
    workspace: Own Agent instructions, report content and business policy.
    instance: Authenticate transport input and retain exact delivered conversation identities and private recipients.
  mechanisms_extended:
    - mechanism: agent-resolver
      reason: Reuse the proven publication owner for read-only discussion and reject ambiguous or removed owners.
    - mechanism: identity-and-authorization
      reason: Scope retained context to the exact authenticated conversation and human recipient after completion.
    - mechanism: approvals-effects-and-idempotency
      reason: Commit immutable delivered text beside the existing receipt without reopening workflows or granting effects.
    - mechanism: capability-contracts-and-connectors
      reason: Reuse qualified receipt adapters for opaque provider addresses; synthetic adapters prove cross-provider behavior.
  new_core_mechanisms:
    - Bounded published conversation context reader over existing workflow delivery state.
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Any company workflow and authenticated communication adapter can use the same read-only publication context; no provider or Sprint semantics enter the mechanism.
rollback: Restore the previous exact Core and Artifact pair; optional publication entries remain retained but cannot authorize old execution readers. No database migration or business-data write.
