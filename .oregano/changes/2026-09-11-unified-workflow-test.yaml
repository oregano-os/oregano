architecture:
  placement:
    core: Integrate existing conversation participation, Builder and workflow
      runtime entry points.
    packages: Reuse existing adapters and qualification fixtures.
    workspace: Retain declared workflows and current Builder configuration in the
      reviewed test pairing.
    instance: Reuse the existing custom environment, isolated state and explicitly
      assigned secrets; keep production disjoint.
  mechanisms_extended:
    - mechanism: agent-resolver
      reason: Retain deterministic routes and declared workflow selection alongside
        current Builder handoff.
    - mechanism: identity-and-authorization
      reason: Preserve authenticated conversation ownership, recipients and per-user
        scope.
    - mechanism: approvals-effects-and-idempotency
      reason: Retain message claims, historical decisions and effects across
        deployment.
    - mechanism: capability-contracts-and-connectors
      reason: Reuse the existing host and Connect custom-environment destination.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: One maintained runtime may host both ordinary chat and
    declared workflow conversations for any company.
rollback: Restore the previous exact deployment and routing metadata in the
  existing test environment. Preserve all state and production destinations.
open_decisions: []
