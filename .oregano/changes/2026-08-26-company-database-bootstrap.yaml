version: 1
plan_id: company-database-bootstrap-2026-08-26
status: approved
author: codex-agent
created: 2026-08-26
title: Add provider-neutral Company Instance database bootstrap
objective: >-
  Make a newly provisioned or explicitly adopted Company Instance StateStore
  ready before runtime deployment by bootstrapping the existing companyos and
  companyos_knowledge schemas, recording an immutable version-manifest entry,
  verifying required schema objects and the 19 Core Page types, and persisting
  a non-secret qualification receipt in setup state. Keep secret transport in
  the selected runtime profile; the maintained Vercel profile uses vercel env
  run without making Vercel part of the database contract.
non_goals:
  - Create another production database or alter the selected live provider resource in this increment.
  - Add a second Brain database, database URL, runtime, or control plane.
  - Expose, persist, print, or pull the resolved DATABASE_URL or other provider secrets.
  - Claim qualification for every PostgreSQL host or driver; this increment qualifies the maintained Neon/Postgres implementation and an alternative adapter fixture.
  - Enable Agent-facing Brain reads, sensitive ingestion, or fine-grained authorization.
  - Drop, truncate, rewrite, or delete existing schema objects or company data.
placement: core
change_class: security
vision_principles_affected:
  - A company-independent Core
  - Explicit boundaries over implicit coupling
  - Evidence beats claims
  - The runtime is replaceable
  - Secrets stay outside the Workspace
files_expected:
  - .oregano/changes/2026-08-26-company-database-bootstrap.yaml
  - docs/_generated/document-registry.json
  - docs/_generated/navigation.json
  - docs/architecture/company-instance.md
  - docs/architecture/system-boundaries.md
