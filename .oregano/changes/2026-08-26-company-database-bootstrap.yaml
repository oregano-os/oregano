required_approvals:
  - oregano-maintainer
approvals:
  - role: oregano-maintainer
    approver: fylingpete
    approved_at: 2026-08-26
    evidence: explicit-user-instruction-in-codex-task-to-continue-with-provider-neutral-setup-and-empty-database-bootstrap
validation:
  - pnpm companyos plan --check .oregano/changes/2026-08-26-company-database-bootstrap.yaml
  - pnpm companyos inspect-core --plan .oregano/changes/2026-08-26-company-database-bootstrap.yaml
  - pnpm docs:check
  - pnpm typecheck
  - node --experimental-strip-types --test packages/testkit/tests/company-database-bootstrap.test.ts packages/cli/tests/live-setup.test.mjs
  - pnpm check
  - git diff --check
tests:
  - The database manifest is deterministic, versioned, and contains no credential value.
  - Empty-database bootstrap creates both schemas, required tables, indexes, constraints, and all 19 Core Page types.
  - Repeating bootstrap is idempotent and a manifest-version collision with different content fails closed.
  - Qualification is read-only and fails closed for missing required objects or Page types.
  - The setup provider contract separates StateStore provisioning from runtime-host secret injection.
  - The maintained profile wraps bootstrap with vercel env run without pulling an environment file.
  - An alternative fixture produces a non-Vercel secret-bound command for the same logical bootstrap operation.
  - Live setup records only a non-secret qualification receipt before advancing beyond StateStore setup.
  - A pending bootstrap intent can safely resume without duplicating or deleting state.
  - Runtime health verifies the prepared database and performs no schema DDL.
documentation_impact:
  required: true
  affected_documents:
    - architecture.company-instance
    - architecture.boundaries
    - onboarding.index
    - onboarding.company-workspace
    - status.current
    - command.setup
    - command.verify-live
    - plan.company-knowledge-implementation
    - specification.company-instance-release-promotion-v0.1
migration: >-
  Add one companyos.schema_manifests ledger table to the maintained Postgres
  schema. New Instances create it during first bootstrap; existing Instances
  add it idempotently during their next approved schema upgrade. Both paths
  retain all existing companyos and companyos_knowledge objects and data.
rollback: >-
  Stop setup before deployment when qualification fails. Existing Instances may
  ignore the additive manifest ledger and continue using their prior verified
  runtime path. Do not remove schemas, ledger rows, Brain evidence, or Handbook
  snapshots; any destructive rollback requires a separate approved change.
open_decisions:
  - Select the first fully qualified non-Vercel runtime profile beyond the conformance fixture.
  - Select and qualify any additional PostgreSQL driver before claiming support for a non-Neon StateStore.
