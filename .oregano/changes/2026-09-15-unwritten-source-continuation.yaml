version: 3
plan_id: unwritten-source-continuation-2026-09-15
created: 2026-09-15
title: Continue an unwritten source on a reviewed replacement Workflow
objective: Allow one explicit operator continuation from an unfinished source run that performed only reads; preserve its immutable Artifact, attempts and receipts, and link its replacement run.
non_goals:
  - Admit new sources, refill slots or change original Records and attempts.
  - Introduce another quota registry, queue or approval system.
placement: core
change_class: security
files_expected:
  - packages/runner-vercel/src/lib/workflow-http.ts
  - .oregano/changes/2026-09-15-unwritten-source-continuation.yaml
  - packages/state-store/workflow-engine.ts
  - packages/connectors/historical-evidence.ts
  - packages/runtime/workflow-engine/source-continuation.ts
  - packages/runtime/workflow-engine/state-validation.ts
  - packages/runtime/workflow-engine/engine.ts
  - packages/testkit/tests/workflow-source-continuation.test.ts
  - docs/specifications/brain-import.md
  - docs/operations/workflow-engine.md
  - docs/specifications/workflow-execution-v1-draft.md
  - packages/cli/content/templates/brain-import/tools/brain-source-history/execute.ts
  - scripts/materialize-brain-workflow.ts
tests:
  - packages/testkit/tests/workflow-source-continuation.test.ts
  - packages/testkit/tests/brain-import-policy.test.ts
documentation_impact:
  required: true
  affected_documents:
    - specification.brain-import
    - operations.workflow-engine
    - specification.workflow-execution-v1
architecture:
  placement:
    core: Validate a single explicit source continuation, fence the predecessor, preserve prior state and deduplicate successor creation.
    packages: Existing Workflow and Brain Blueprint; no new package authority.
    workspace: Adopt the reviewed replacement Workflow and consume linked source history without changing page structure.
    instance: Authenticate the existing operator, enforce current source admission and keep both runs and all model attempts.
  mechanisms_extended:
    - mechanism: approvals-effects-and-idempotency
      reason: Extend the existing leased Workflow snapshot with immutable predecessor/successor references; reject attempted writes and unknown model outcomes, and preserve source admission and attempt evidence.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Any company can replace an unfinished read-only source procedure exactly once while retaining the original evidence and preventing duplicate writes or unreviewed source admission.
rollback: Keep the cancelled predecessor and linked successor. Do not reactivate the predecessor or repeat unknown model attempts; resume the retained successor only under its reviewed Artifact.
