  - pnpm check
  - git diff --check
tests:
  - V1 and V2 repository registrations resolve to Source Connector V2 implementations with exact identities.
  - Immutable tree cursors fail closed on tampering, tree drift, truncation, and invalid paths.
  - Blob fetch remains read-only, SecretRef-bound, size-bounded, UTF-8 validated, and receipt-producing.
  - Repeating or restarting a sync creates no duplicate Raw Evidence or change entry.
  - Only a complete fresh inventory marks absent provider objects deleted.
  - Reappearance of an unchanged provider version restores inventory presence without rewriting immutable Raw Evidence.
  - The generic CLI does not construct or special-case a provider Connector.
documentation_impact:
  required: true
  affected_documents:
    - architecture.company-instance
    - architecture.boundaries
    - onboarding.index
    - onboarding.company-workspace
    - plan.company-knowledge-implementation
    - specification.company-instance-release-promotion-v0.1
    - specification.company-knowledge-v0.2
    - status.current
