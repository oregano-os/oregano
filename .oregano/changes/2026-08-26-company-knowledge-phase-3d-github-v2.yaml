version: 1
plan_id: company-knowledge-phase-3d-github-v2-2026-08-26
status: approved
author: codex-agent
created: 2026-08-26
title: Route the maintained GitHub Source Connector through Source Connector 2.0
objective: >-
  Preserve repository Source identities and V1 configuration compatibility
  while implementing a native V2 GitHub Connector and routing repository
  verification, immutable tree enumeration, blob fetch, ACL evidence,
  reconciliation, receipts, retries, and completed watermarks through the
  shared durable Source pipeline.
non_goals:
  - Extract Pages or Claims from repository evidence.
  - Activate a live repository or resolve a production credential.
  - Add repository write access or infer provider ACLs that GitHub does not expose per blob.
placement: core
change_class: security
vision_principles_affected:
  - A company-independent Core
  - Evidence beats claims
  - Safety cannot be weakened from a Workspace
  - The runtime is replaceable
