    - command.setup
    - command.verify-live
    - guide.connect-knowledge-source
migration: >-
  Existing V1 requirements and bindings retain Source, Connector, object, and
  provider-version identities. The exact V1 registry entry now creates a V2
  implementation in compatibility mode. New native bindings use Connector
  version 2.0.0 and require exact implementation qualification and active
  state. Existing immutable envelopes and receipts are never rewritten.
rollback: >-
  Disable new repository synchronization while retaining all Source Events,
  Raw Evidence, receipts, inventory state, and watermarks. The V1 configuration
  parser and registry identity remain available, but ingestion must not fall
  back to the retired provider-specific persistence path.
open_decisions:
  - A real bounded repository sync still requires an approved SecretRef and target repository binding.
