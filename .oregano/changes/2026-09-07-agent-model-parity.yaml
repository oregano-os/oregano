documentation_impact:
  required: true
  affected_documents:
    - guide.author-agent
    - operations.workflow-engine
    - operations.vercel-workflow-runner
architecture:
  placement:
    core: Preserve generic model-task declarations and share prompt assembly for runtime and qualification.
    packages: Portable Agent declarations may name logical model tasks without secrets or authority.
    workspace: Own Agent instructions, Skills, logical tasks and domain-specific quality expectations.
    instance: Map tasks to explicit models and routes; retain real selection and response evidence.
  mechanisms_extended:
    - mechanism: model-recipe-resolver
      reason: Wire compiled Agent tasks through existing selection precedence and expose the effective selection in health and receipts.
    - mechanism: identity-and-authorization
      reason: Reuse operator authentication for a bounded Preview-only model check with no workflow or provider writes.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Every Company Agent can retain its model task inside a general workflow, independently of business domain, communication surface and model provider.
rollback: Revert the optional task wiring and rebuild the prior exact Artifact. Retain all conversation, decision and effect evidence.
