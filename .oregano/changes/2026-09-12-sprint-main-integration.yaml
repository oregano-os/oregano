architecture:
  placement:
    core: Preserve verified message identity, collection continuity, delivery completion and durable Records waits.
    packages: Reuse transport adapters, compiler contracts and existing workflow persistence.
    workspace: Keep conversation content, readiness definitions and operating policy in the Workspace.
    instance: Preserve deployment bindings and independently configured schedules.
  mechanisms_extended:
    - mechanism: timers-and-business-time
      reason: Reuse persisted waits and semantic child identity.
    - mechanism: company-records
      reason: Distinguish pending complete scans from invalid evidence.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Applies to any Agent using shared conversations, collection or Records across supported transports.
rollback: Revert this integration for new runs; drain persisted Records waits with the compatible runtime before downgrading.
