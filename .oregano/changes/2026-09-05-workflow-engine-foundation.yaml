architecture:
  placement:
    core: >-
      Workflow steps schema and validator with one-to-one prose mapping,
      deterministic compiler producing an enforcement manifest frozen into the
      Artifact, generic run engine (step state machine, route, for_each, wait,
      decision, reference resolver, template substitution, pinning to the
      starting Workspace commit), Tool-boundary guard keyed by run context,
      evidence carrying workflow id, version, and step id, business-time as a
      standard module.
    packages: >-
      No Package in this plan. The Sprint Blueprint is deleted in the follow-up
      removal plan; a future Blueprint would carry `steps:` files, Skills,
      templates, and Tool declarations without runtime code.
    workspace: >-
      Owns the process: `steps:` in workflow files, prose, config.yaml,
      schedules, Company Tools for computation, templates, Agent instructions,
      roster roles, and risk policy. The fictional lindenhof-studio fixture is
      the public example.
    instance: >-
      Binds destinations, resources, roster principals, and SecretRefs,
      migrates the additive database manifest, activates schedules, and holds
      receipts. Which channel or board a step reaches is an Instance binding,
      never a Core mode.
  mechanisms_extended:
    - mechanism: timers-and-business-time
      reason: >-
        The Sprint-specific timer scheduler becomes generic wait evaluation
        over schedule-v1 triggers and business-day durations; triggers carry
        opaque params that the scheduler passes through, so no workflow
        semantics enter Core; a redelivered trigger resolves to the same run
        through the declared instance key; business-time moves to a Core
        standard module unchanged.
    - mechanism: approvals-effects-and-idempotency
      reason: >-
        Approval requests gain expiresAt from the decision step timeout; effect
        records gain workflow identity; idempotency identities include
        for_each item keys.
    - mechanism: capability-contracts-and-connectors
      reason: >-
        records.query gains changed_since, missing_any_of, work_item_ids,
        status_in, and accepted_after filters, an all-pages drain, and a
        synced_through source watermark in its result so a report step can
        require complete synchronization rather than freshness; records.query,
        communication.message.publish, and work-item.batch-update accept a
        workflow run context so the engine can call them under the owning
        Agent's grant; every multi-item write reuses work-item.batch-update
        with its real updates[] shape; no new Capability or Connector.
    - mechanism: identity-and-authorization
      reason: >-
        A conversation-to-run assignment derived from the thread reference or
        decision delivery id in the run record determines the required run
        context and the Agent's effective ToolSet while a run waits; the model
        never names the run, so omitting the context cannot bypass the guard.
  new_core_mechanisms:
    - Workflow steps schema and validator with one-to-one prose mapping.
    - Deterministic workflow compiler producing an enforcement manifest frozen into the Artifact.
    - Generic workflow run engine with step state machine, route, for_each, wait, decision, reference resolver, template substitution, and pinning to the starting Workspace commit.
    - Tool-boundary guard keyed by workflow run context.
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: >-
    The engine executes any `steps:` file that uses the eleven constructs.
    Sprint vocabulary exists only in the fictional testkit fixture and in the
    pilot Company Workspace. A second company or a second process needs no
    Core change except Connectors for new external systems.
rollback: >-
  Phases 0 to 4 add code beside the frozen Sprint Domain and change no
  Workspace or Instance; reverting the implementation pull requests restores
  the previous behaviour. Additive workflow tables from database manifest
  2.0.0 stay dormant. The Sprint Domain is deleted only by the later removal
  plan after the parity gate, which carries its own rollback.
open_decisions:
  - Slack test channel and test recipients for the pilot Workspace migration (later plan).
  - Whether apply-rollover writes to the Monday test board in the first two weeks (later plan).
  - Whether records-reconciliation becomes a steps workflow or is dropped as prose (later plan).
  - Whether dormant Sprint tables are removed destructively later or kept as proof (later plan).
