version: 3
plan_id: workflow-engine-foundation-2026-09-05
created: "2026-09-05"
proposal: true
title: Define workflows in the Company Workspace and execute them with a generic Core engine
objective: >-
  Replace the Sprint-specific Core Domain with a generic workflow engine so
  that a Company Workspace defines a process as a Markdown file whose YAML
  frontmatter carries a `steps:` list and whose body carries the same steps as
  prose, validated one to one. Core validates, compiles an enforcement
  manifest, schedules, steps, waits for bound human decisions, calls Tools
  through CompanyOSRuntime, and records evidence with workflow id, version,
  and step id. Firm-specific computation lives in sandboxed Company Tools in
  the Workspace; provider access stays in Core Capabilities and Connectors.
  Before the engine is built, a reference-completion phase aligns the
  fictional example Workspace with the real standard-Tool contracts, adds the
  record-source data path for Friday submissions, uses work-item.batch-update
  for every multi-item write, and freezes parity fixtures ported from the
  Sprint Domain tests. This proposal covers phases 0 to 4 of the plan; the
  pilot Workspace migration and the removal of the Sprint Domain ship as
  their own plans once the parity gate passes.
non_goals:
  - Delete packages/domains/sprint, the Sprint loader, schemas, replay, runtime modes, or the Sprint Blueprint before the parity gate passes; they are frozen except for bug fixes.
  - Introduce an expression language, cycles, or a `kind: agent` step in engine version 1.
  - Change any Company Workspace or Company Instance in this Core work.
  - Add a Capability or Connector for a new external system.
placement: core
