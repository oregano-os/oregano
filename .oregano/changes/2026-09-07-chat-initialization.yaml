version: 3
plan_id: chat-initialization-2026-09-07
created: "2026-09-07"
title: Reject incomplete chat initialization and verify configuration before readiness
objective: Cache the chat only after runtime configuration and handler registration succeed; health must reject invalid Connector configuration before reporting readiness.
non_goals:
  - Change Slack subscriptions, reinstall the app or activate production workflows.
  - Treat a diagnostic event or operator reread as a human decision or live acceptance.
placement: core
change_class: security
files_expected:
  - package.json
  - .oregano/changes/2026-09-07-chat-initialization.yaml
  - packages/runner-vercel/src/lib/bot.ts
  - packages/runner-vercel/src/lib/bot-initialization.test.ts
  - packages/runner-vercel/src/app/api/health/route.ts
  - docs/operations/vercel-workflow-runner.md
  - docs/operations/workflow-engine.md
  - docs/_generated/**
tests:
  - packages/runner-vercel/src/lib/bot-initialization.test.ts
documentation_impact:
  required: true
  affected_documents:
    - operations.vercel-workflow-runner
    - operations.workflow-engine
architecture:
  placement:
    core: Complete runtime construction and handler registration before publishing a cached Chat. Reject invalid Connector configuration during health checks.
    packages: No new package or business mechanism.
    workspace: No changes to workflow content, recipients, language or approvals.
    instance: Correct configuration provenance when preparing a deployment; preserve exact recipients, grants and effect controls.
  mechanisms_extended:
    - mechanism: capability-contracts-and-connectors
      reason: Reuse Connector configuration validation and the existing Chat; never cache partial initialization.
    - mechanism: identity-and-authorization
      reason: Preserve signature checks and registered authorization handlers on every successfully constructed Chat.
    - mechanism: approvals-effects-and-idempotency
      reason: Keep decisions and effect deduplication unchanged; initialization failure must remain a failure on repeated requests.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Every Company Instance needs failed initialization to remain visible and recoverable, independent of company content.
rollback: Restore the previous deployment and its matching configuration together; no database or workflow-state migration is required.
