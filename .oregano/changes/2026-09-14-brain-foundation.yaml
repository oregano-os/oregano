version: 3
plan_id: brain-foundation-2026-09-14
created: "2026-09-14"
title: Qualify bounded Brain Skill execution through existing model bindings
objective: Materialize pinned reusable Brain instructions into measured workflow phases and extend trusted generation bindings with explicit model tasks and profiles while preserving existing behavior, authority and runtime bounds.
non_goals:
  - Introduce a new model provider, scheduler, Skill loader or autonomous model Tool loop.
  - Treat source text as instructions or allow runtime callers to choose model bindings.
  - Claim Brain operations, source delivery or production adoption before their subsequent implementation and checks.
placement: core
change_class: security
files_expected:
  - .oregano/changes/2026-09-14-brain-foundation.yaml
  - packages/blueprints/brain/**
  - scripts/materialize-brain-prompts.ts
  - packages/language/**
  - packages/connectors/language-model.ts
  - packages/runner-vercel/src/lib/language-generation.ts
  - packages/runner-vercel/src/lib/language-generation.test.ts
  - packages/testkit/tests/language-generation.test.ts
  - packages/testkit/tests/brain-skill-materialization.test.ts
  - docs/specifications/model-recipes.md
  - docs/specifications/brain-skill-adoption.md
  - docs/workbench/guides/author-a-company-tool.md
  - packages/cli/content/guides/author-a-company-tool.md
