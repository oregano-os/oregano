documentation_impact:
  required: true
  affected_documents: [specification.model-recipes, specification.brain-skill-adoption, guide.author-company-tool, status.current]
architecture:
  placement:
    core: Trusted scoped generation bindings, validation, phase materialization checks and existing host model execution; no business vocabulary or permissions.
    packages: Pinned reusable instruction passages, explicit adaptations, static phase assignments and calibration defaults are portable Blueprint assets.
    workspace: Reviewed Agent materials, grant policy, adopted instructions, company mappings and workflow inputs supply all operating choices.
    instance: Existing model configuration and SecretRefs select providers and budgets; runtime execution evidence retains exact model and prompt identity.
  mechanisms_extended:
    - mechanism: model-recipe-resolver
      reason: Select existing language profiles and named tasks from trusted scoped prompt bindings without accepting caller overrides.
    - mechanism: capability-contracts-and-connectors
      reason: Validate bounded instruction capacity and forward the trusted phase selection through the existing language generation contract and host.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Any company can adopt the same bounded Skill phases with its own reviewed vocabulary and model bindings; public evidence uses independently invented fixtures.
rollback: Restore the preceding Core and compatible Workspace commits. Existing prompt bindings retain their original defaults; no database migration or external resource changes occur in this increment.
