version: 3
plan_id: workflow-decision-buttons-2026-09-06
created: "2026-09-06"
title: Share decision cards and add verified workflow button actions
objective: >-
  Add Workspace-owned decision explanations and labels, a provider-neutral
  decision presentation contract and Slack button delivery. Reuse existing
  card primitives without replacing distinct Tool and workflow authorization.
  Replace resolved controls only after a durable decision and distinguish
  delivery or card-update failures from authorization outcomes.
non_goals:
  - Activate production or change Slack production ingress without its deployment gate.
  - Remove Tool approval semantics or weaken bound decisions and delivery identity.
  - Implement Teams or Telegram adapters.
placement: core
change_class: security
files_expected:
  - .oregano/changes/2026-09-06-workflow-decision-buttons.yaml
  - packages/standard-tools/communication.ts
  - packages/schema/workflow-steps-v1.schema.json
  - packages/capabilities/catalog.ts
  - packages/capabilities/decision-presentation.ts
