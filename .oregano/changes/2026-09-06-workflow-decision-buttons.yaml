documentation_impact:
  required: true
  affected_documents:
    - specification.workflow-execution-v1
    - operations.workflow-engine
    - status.current
architecture:
  placement:
    core: Bind explanations and actions to persisted authorized decisions.
    packages: No Sprint-specific package or company values.
    workspace: Own templates and optional action labels.
    instance: Bind the authenticated interaction ingress to its exact Instance.
  mechanisms_extended:
    - mechanism: capability-contracts-and-connectors
      reason: Extend the existing communication capability with bounded decision metadata.
    - mechanism: approvals-effects-and-idempotency
      reason: Reuse workflow decisions and Tool approvals through a shared presentation layer.
    - mechanism: identity-and-authorization
      reason: Check authenticated human identity and exact delivered message for clicks.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Any Workspace can render a decision through a supporting Connector.
rollback: Retain legacy compiled notice rendering and old action IDs until pending requests expire.
