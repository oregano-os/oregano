version: 1
plan_id: typed-setup-provider-boundary-2026-08-24
status: implemented
author: codex-agent
created: 2026-08-24
title: Add a small typed provider boundary and harden the live starter setup
objective: >-
  Keep Oregano Core provider-independent while making the maintained
  Vercel-Neon-Slack starter installation safe to resume, explicit about live
  provider capabilities, and reliable across the provider behavior observed in
  a complete CompanyOS installation.
non_goals:
  - Publish a provider SDK, plugin registry, or third-party extension API.
  - Implement Hetzner, Docker, Railway, Supabase, or alternative communication providers in this change.
  - Move provider credentials or customer resource identifiers into Core, a Company Workspace, logs, tests, or documentation.
  - Introduce automatic destructive replacement, deletion, or secret rotation for provider resources.
  - Generalize runtime capability, Tool, evidence, or state-store contracts around one hosted provider profile.
placement: core
change_class: security
vision_principles_affected:
  - Human authority is explicit
  - Evidence beats claims
  - Onboarding has no hidden steps
  - Architecture stays portable
  - Readiness is scoped and evidenced
files_expected:
  - .oregano/changes/2026-08-24-typed-setup-provider-boundary.yaml
  - INSTALL-COMPANYOS.md
  - docs/architecture/company-instance.md
  - docs/architecture/system-boundaries.md
  - docs/_generated/**
  - docs/governance/agent-working-agreement.md
  - docs/governance/core-change-policy.yaml
  - docs/onboarding/README.md
  - docs/onboarding/company-workspace.md
