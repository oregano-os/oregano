required_approvals:
  - oregano-maintainer
approvals:
  - role: oregano-maintainer
    approver: fylingpete
    approved_at: 2026-08-24
    evidence: explicit-user-instruction-in-codex-task-to-implement-the-agreed-small-typed-provider-boundary-and-onboarding-fixes
validation:
  - pnpm companyos plan --check .oregano/changes/2026-08-24-typed-setup-provider-boundary.yaml
  - pnpm companyos inspect-core --base origin/main --plan .oregano/changes/2026-08-24-typed-setup-provider-boundary.yaml
  - pnpm docs:check
  - pnpm check
  - pnpm runner:build
  - git diff --check
tests:
  - The internal provider contract rejects incomplete or mismatched setup adapters before a mutation begins.
  - The maintained profile records exact resource receipts immediately and resumes without duplicate resource creation.
  - Provider create responses are authoritative and eventual-consistency reads use bounded polling by immutable identity.
  - Vercel project configuration verifies the maintained runner root without overwriting a conflicting adopted project.
  - Existing production environment variables are never silently overwritten by setup.
  - Slack connector identity, trigger routing, user authorization, and visible Oregano identity are verified separately.
  - Production deployment waits for a structured ready receipt and health polling tolerates temporary non-JSON responses.
  - Generated GitHub checks validate the Company Workspace checkout rather than the sibling Core checkout.
  - Live setup errors redact current credential formats while retaining safe actionable diagnostics.
  - Slack verification requires the exact nonce-bound Oregano response in the same persisted conversation.
  - Tests use synthetic provider identities and contain no customer resource identifiers or credentials.
documentation_impact:
  required: true
  affected_documents:
    - architecture.company-instance
    - architecture.boundaries
    - command.inspect-core
    - governance.agent-agreement
    - onboarding.index
    - onboarding.company-workspace
    - specification.company-instance-release-promotion-v0.1
    - status.current
    - command.setup
    - command.verify-live
rollback: >-
  Revert the provider boundary, maintained profile adapters, state receipts,
  generated workflow correction, tests, and documentation together through a
  checked Core change. Existing provider resources are preserved; rollback must
  not delete or replace any installation resource, and versioned setup state
  remains readable for diagnosis.
open_decisions:
  - Qualify additional deployment, state-service, and communication adapters only after the private contract has proven stable across maintained releases.
  - Determine through provider qualification whether Vercel Connect can guarantee the fixed visible Slack name Oregano independently of its internal connector identifier.
