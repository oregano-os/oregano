architecture:
  placement:
    core: Generic durable Agent turns, exact pinned Tool dispatch, bounded completion
      validation and existing attempt accounting within the Workflow engine.
    packages: Portable source-understanding, incremental filing and saved-page
      verification guidance; no company authority.
    workspace: Source selection, vocabulary, model roles, bounded workflow settings,
      Agent grants and company knowledge.
    instance: Existing model credentials, effect receipts, immutable Artifacts,
      source admission, Workflow snapshots, leases and repository bindings.
  mechanisms_extended:
    - mechanism: agent-resolver
      reason: Bind a continuing workflow task to the already compiled owning Agent
        and selected Skill material rather than isolated generation prompts.
    - mechanism: toolset-resolver
      reason: Compile an exact subset of existing R0/R1 grants and fixed inputs for
        durable Agent dispatch; neither the model nor retrieved text grants authority.
    - mechanism: model-recipe-resolver
      reason: Host one tool-enabled model turn at a time with finite budgets and
        existing per-attempt usage evidence across continuation.
    - mechanism: approvals-effects-and-idempotency
      reason: Extend existing Workflow snapshots and effect keys with immutable
        model-turn and call identities, receipt replay and completion feedback.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Any company can declare a bounded tool-using Agent step using
    its own existing grants, policies, source selection and completion validator.
rollback: Disable new Agent-step admission and restore the preceding compatible
  Artifact for new runs. Retain existing run snapshots, partial Markdown writes,
  receipts and all model attempts; never reinterpret historical definitions.
