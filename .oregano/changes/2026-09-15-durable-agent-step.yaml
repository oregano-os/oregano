version: 3
plan_id: durable-agent-step-2026-09-15
created: 2026-09-15
title: Continue bounded Agent tasks through durable Workflow steps
objective: Let an owning Agent read and incrementally change knowledge through its
  existing Tool grants, preserving each model turn, Tool result and completion check.
non_goals:
  - Add company-specific runtime behavior or a second Agent or effect engine.
  - Permit R2-R4 effects, subject-confirmed operations or arbitrary provider access.
  - Rewrite historical run definitions or discard prior model costs.
