version: 1
plan_id: company-knowledge-phase-3f-local-session-2026-08-26
status: approved
author: codex-agent
created: 2026-08-26
title: Implement exact local ingestion and temporary Session Corpus lifecycle
objective: >-
  Add an exact-input local Source Connector and an idempotent Agent stop-buffer
  transfer into the temporary Session Corpus, with payload-free lifecycle
  receipts, seven-day orphan cleanup, 30-day corpus cleanup, and a separate
  explicit path for durable conversation archives.
non_goals:
  - Crawl a local directory, expand a glob, or infer filesystem authorization from a path.
  - Treat the temporary Session Corpus as the durable conversation archive.
  - Delete durable Raw Evidence, Pages, Claims, syntheses, or Handbook content during temporary cleanup.
placement: core
change_class: security
vision_principles_affected:
  - A company-independent Core
  - Evidence beats claims
  - Safety cannot be weakened from a Workspace
  - The runtime is replaceable
files_expected:
  - .oregano/changes/2026-08-26-company-knowledge-phase-3f-local-session.yaml
  - docs/_generated/document-registry.json
  - docs/_generated/navigation.json
  - docs/compatibility/registry.yaml
  - docs/plans/2026-08-25-company-knowledge-implementation.md
  - docs/specifications/company-knowledge-v0.2-draft.md
  - docs/status/current.md
  - docs/workbench/commands/knowledge.md
  - docs/workbench/guides/connect-knowledge-source.md
  - packages/cli/content/guides/connect-knowledge-source.md
  - packages/cli/src/cli.mjs
  - packages/connectors/local-file-knowledge-source-v2.ts
  - packages/connectors/source-registry-maintained.ts
  - packages/knowledge/source-contracts-v2.ts
  - packages/knowledge/source-ingestion-v2.ts
  - packages/knowledge/session-corpus.ts
  - packages/state-postgres/database-bootstrap.ts
  - packages/state-postgres/knowledge-schema-phase-three.ts
  - packages/state-postgres/knowledge-schema.sql
  - packages/state-postgres/session-corpus-store.ts
  - packages/testkit/tests/knowledge-source-local-session.test.ts
required_approvals:
  - oregano-maintainer
approvals:
  - role: oregano-maintainer
    approver: fylingpete
    approved_at: 2026-08-26
    evidence: explicit-user-instruction-in-codex-task-to-develop-the-approved-plan-through-phase-8
validation:
  - pnpm companyos plan --check .oregano/changes/2026-08-26-company-knowledge-phase-3f-local-session.yaml
  - pnpm companyos inspect-core --plan .oregano/changes/2026-08-26-company-knowledge-phase-3f-local-session.yaml
  - pnpm docs:check
  - pnpm typecheck
  - node --experimental-strip-types --test packages/testkit/tests/knowledge-source-local-session.test.ts
  - pnpm check
  - git diff --check
tests:
  - Exact local input traverses the shared Source Event, ACL, sanity, Raw Evidence, receipt, and change-stream pipeline.
  - Local input rejects directories, implicit traversal, unsupported media types, and over-limit payloads.
  - Session transfer is idempotent and removes the stop buffer only after the corpus write succeeds.
  - Failed transfer leaves a recoverable bounded stop buffer.
  - Orphan buffers expire after seven days and Session Corpus payloads expire after 30 days with payload-free receipts.
  - Explicit durable archives use retained Raw Evidence and survive temporary cleanup.
documentation_impact:
  required: true
  affected_documents:
    - plan.company-knowledge-implementation
    - specification.company-knowledge-v0.2
    - status.current
    - command.knowledge
    - guide.connect-knowledge-source
migration: >-
  Add the maintained local-file Connector registration and one additive
  session_lifecycle_receipts table. Existing Session Corpus rows and durable
  source evidence are not rewritten. The target database manifest advances
  additively and remains pending live qualification until Phase 7.
rollback: >-
  Deactivate local and Session ingestion, retain already accepted durable Raw
  Evidence, and stop cleanup workers. The additive receipt table may remain;
  temporary corpus rows can still be inspected or cleaned under their existing
  lifecycle policy.
open_decisions: []
