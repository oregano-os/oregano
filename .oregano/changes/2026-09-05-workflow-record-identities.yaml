version: 3
plan_id: workflow-record-identities-2026-09-05
created: "2026-09-05"
title: Resolve Record identities against the reviewed roster
objective: >-
  Map fully qualified provider principals to stable reviewed roster identities
  on the shared Records normalization path. Freeze the directory in operation
  evidence and source-completeness digests. Unresolved principals stay explicit,
  and no Records value can grant approval authority.
non_goals:
  - Activate provider sources, change production roster membership, or send messages.
  - Infer identity by name or grant authority from a source object.
  - Replace role-board aggregation or claim end-to-end workflow acceptance.
placement: core
change_class: security
files_expected:
  - .oregano/changes/2026-09-05-workflow-record-identities.yaml
  - packages/records/contracts.ts
  - packages/records/identity-directory.ts
  - packages/records/normalize.ts
  - packages/records/source-validation.ts
  - packages/records/registry.ts
  - packages/records/service.ts
  - packages/records/synchronization.ts
  - packages/records/reconciliation.ts
  - packages/schema/company-record-source-v1.schema.json
  - packages/cli/src/records-operations.mjs
  - packages/cli/tests/records.test.mjs
  - packages/runner-vercel/src/lib/company-records-rehearsal.ts
  - packages/runner-vercel/src/lib/company-records-rehearsal.test.ts
  - packages/testkit/tests/record-identities.test.ts
  - packages/testkit/tests/record-query-postgres.test.ts
  - docs/specifications/company-record-normalization-v1.md
  - docs/specifications/company-records-query-v1.md
  - docs/status/current.md
  - docs/_generated/document-registry.json
  - docs/_generated/navigation.json
tests:
  - packages/testkit/tests/record-identities.test.ts
  - packages/testkit/tests/record-normalization.test.ts
  - packages/testkit/tests/record-query-postgres.test.ts
  - packages/cli/tests/records.test.mjs
  - packages/runner-vercel/src/lib/company-records-rehearsal.test.ts
documentation_impact:
  required: true
  affected_documents:
    - specification.company-record-normalization-v1
    - specification.company-records-query-v1
    - status.current
architecture:
  placement:
    core: Owns exact principal lookup, ambiguity rejection and normalization evidence.
    packages: No Package or Blueprint changes.
    workspace: Owns the reviewed roster and the fields requiring identity resolution.
    instance: Freezes roster content with exact source operation and Artifact provenance.
  mechanisms_extended:
    - mechanism: company-records
      reason: Add optional exact roster resolution to typed identity fields and bind its directory digest to synchronization proof.
    - mechanism: identity-and-authorization
      reason: Reuse parsed roster identities as a read-only directory; Records cannot modify the roster or approve effects.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Any provider-qualified identity can be resolved through the same reviewed roster without company-specific Core code.
rollback: >-
  Revert before adopting the optional resolution mappings. Existing sources
  without identity resolution retain their previous normalization digest.
  Re-sync reviewed mappings after roster changes; preserve historical records.
