architecture:
  placement:
    core: Release environment continuity and durable conversation presentation.
    packages: Reuse the existing Workbench without a new package contract.
    workspace: Company operating intent and acceptance policy remain unchanged.
    instance: Reuse configured model recipes and repository and test bindings.
  mechanisms_extended:
    - mechanism: approvals-effects-and-idempotency
      reason: Keep consumed actions fenced while preserving prior messages and release
        receipts.
    - mechanism: capability-contracts-and-connectors
      reason: Extend the trusted deployment adapter to retain Instance configuration
        and verify it before promotion.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: The correction is independent of company, chat provider,
    coding profile and deployment host.
rollback: Restore the preceding exact Core and Workspace pairing without
  changing retained jobs or test evidence. The prior intake classification
  defect returns; stop new build requests until recovery.
