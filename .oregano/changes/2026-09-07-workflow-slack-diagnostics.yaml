version: 3
plan_id: workflow-slack-diagnostics-2026-09-07
created: "2026-09-07"
title: Trace isolated Slack workflow replies without logging their content
objective: Distinguish receipt, filtering, SDK dispatch, workflow assignment, model execution and reply delivery while preserving existing authentication and test isolation.
non_goals:
  - Change Slack subscriptions, reinstall the app or activate production workflows.
  - Treat a diagnostic event or operator reread as a human decision or live acceptance.
placement: core
change_class: security
files_expected:
  - package.json
  - .oregano/changes/2026-09-07-workflow-slack-diagnostics.yaml
  - packages/runner-vercel/src/lib/workflow-action-ingress.ts
  - packages/runner-vercel/src/lib/workflow-slack-diagnostics.ts
  - packages/runner-vercel/src/lib/bot.ts
  - packages/runner-vercel/src/app/api/workflows/slack/route.ts
  - packages/runner-vercel/src/lib/workflow-slack-diagnostics.test.ts
  - docs/operations/vercel-workflow-runner.md
  - docs/_generated/**
tests:
  - packages/testkit/tests/workflow-action-ingress.test.ts
  - packages/runner-vercel/src/lib/workflow-slack-diagnostics.test.ts
documentation_impact:
  required: true
  affected_documents:
    - operations.vercel-workflow-runner
architecture:
  placement:
    core: Extend the maintained Slack runner adapter with bounded diagnostics and reuse its unchanged SDK verifier and message handler.
    packages: No new package or business mechanism.
    workspace: No changes to workflow content, recipients, language or approvals.
    instance: Enable diagnostics on the existing isolated test deployment; keep exact source provenance and existing state.
  mechanisms_extended:
    - mechanism: capability-contracts-and-connectors
      reason: Observe the existing Slack ingress and response path without creating another transport or bypassing verification.
    - mechanism: identity-and-authorization
      reason: Separate unverified ingress observations from signature-verified handler entry and authorized workflow assignment.
    - mechanism: approvals-effects-and-idempotency
      reason: Preserve decisions and deduplication while exposing where delivery stops.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Any Company Instance using the maintained Slack workflow adapter can diagnose reply delivery without publishing business data.
rollback: Disable COMPANYOS_SLACK_DIAGNOSTICS or restore the previous test deployment; persisted runs and decisions are unchanged.
