title: Read and update governed Markdown knowledge with scoped recovery
objective: Qualify reusable bounded Brain instruction phases and add documents, projection,
  reads and bounded evidenced writes with explicit Workspace adoption, preserved typed write diagnostics, ordinary roster and Tool
  authority, atomic repository publication, recoverable synchronization and scoped change continuation.
non_goals:
  - Claim automatic source ingestion or live company adoption before their later increments.
  - Bypass repository protection or use application release machinery for knowledge commits.
  - Introduce a second identity, model, scheduler, repository authentication or authoritative
    knowledge database.
  - Compile mutable Brain content into Agent instructions or treat retrieved text as authority.
