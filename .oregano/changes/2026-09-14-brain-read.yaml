architecture:
  placement:
    core: Brain path and document validation, storage and repository boundaries, rebuildable projection, read operations, authority enforcement and bounded synthesis.
    packages: Pinned upstream operation wording, Markdown conventions and synthesis guidance with explicit portability adaptations and license attribution.
    workspace: Declared types, relationship mappings, reading policy, common Tool grants and company knowledge in reviewed files.
    instance: Existing repository installation and database binding, explicit migration, projection revisions and existing leases; no new credential registry.
  mechanisms_extended:
    - mechanism: agent-resolver
      reason: Exclude mutable Brain content from compiled instructions and materialize shared usage guidance only for effective granted operations.
    - mechanism: toolset-resolver
      reason: Resolve reviewed common Workspace grants with provenance for existing and future Agents without granting authority from Instance enablement.
    - mechanism: model-recipe-resolver
      reason: Add the named bounded synthesis task through the existing model runtime and usage reporting.
    - mechanism: capability-contracts-and-connectors
      reason: Add scoped Brain reads and extend the existing trusted repository provider with revision-specific permitted Markdown reads.
  new_core_mechanisms:
    - Brain Markdown and Takes parsing with configurable types, explicit aliases, source-context links and diagnostics.
    - A rebuildable Brain storage projection with full-text search and consistent revision metadata inside the existing Instance database lifecycle.
    - Shared bounded read operations and one-call synthesis using the same retrieval functions.
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Companies choose their vocabulary, mappings, reading policy, grants and repository/database bindings. The same Core works with imports disabled and restricts unsupported access modes without company-specific branches.
rollback: Restore the preceding compatible Core and Workspace pair. Rebuild or remove only the derived Brain projection through an explicit scoped operator migration; preserve control state, Records, repository history and existing receipts.
