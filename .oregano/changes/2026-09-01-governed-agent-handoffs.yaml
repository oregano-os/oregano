version: 2
plan_id: governed-agent-handoffs-2026-09-01
status: approved
author: codex-agent
created: 2026-09-01
title: Specify governed semantic Agent handoffs without weakening deterministic ingress
objective: >-
  Define one reusable two-stage Company Agent routing contract: deterministic
  ingress selects an initial Agent from authenticated provider facts, while an
  already active Agent may request an allowlisted semantic handoff that Core
  authorizes, evidences, and persists as an exact Conversation Assignment.
  Apply that contract to the Sprint product target so exact Sprint surfaces
  route directly to a separate sprint Agent, general company conversations
  remain with oregano, and approved Sprint one-to-one conversations may transfer
  safely between them.
non_goals:
  - Implement AgentHandoffService, ConversationAssignmentStore, Runner integration, database migration, Workspace schemas, or provider behavior in this documentation change.
  - Let message text authenticate a principal, grant a Tool, broaden a provider scope, select an approval authority, or bypass an exact Agent Binding.
  - Replace deterministic AgentResolver ingress with an unconstrained model classifier or multi-Agent group chat.
  - Treat Skills, Workflows, Tools, Agent handoffs, and non-conversational domain events as the same routing mechanism.
  - Activate private Company production routing, create provider conversations, archive raw transcripts, or change a live Company Instance.
placement: core
change_class: security
vision_principles_affected:
  - A company-independent Core
  - Human authority is explicit
  - Evidence beats claims
  - The runtime is replaceable
  - Files are the review surface
  - Documentation is part of the system
