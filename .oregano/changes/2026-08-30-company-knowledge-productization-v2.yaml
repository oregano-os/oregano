version: 1
plan_id: company-knowledge-productization-v2-2026-08-30
status: implemented
author: codex-agent
created: 2026-08-30
title: Complete the pragmatic Company Knowledge productization roadmap
objective: >-
  Implement the seven-phase Company Knowledge productization roadmap as an
  additive, authorization-first path: isolated-environment qualification,
  KnowledgeBench, persisted Retrieval V3 projections, Current Brief runtime
  reads, Brain-first answer preparation, deterministic Open Loops and Meeting
  Prep views, and a Knowledge Doctor. Preserve the reviewed Handbook as the
  only curated company authority and leave production activation behind
  explicit qualification evidence.
non_goals:
  - Mutate a Neon, Vercel, Slack, model-provider, or Source-provider account from this repository change.
  - Activate Retrieval V3 for the production Agent or remove the supported Retrieval V2 path.
  - Let Brain material, a Current Brief, an Open Loop, or Meeting Prep become Handbook authority.
  - Let a model approve Claims, promotion candidates, access policies, or production activation.
  - Add provider-specific business logic to Oregano Core.
placement: core
change_class: security
vision_principles_affected:
  - A company-independent Core
  - Evidence beats claims
  - Safety cannot be weakened from a Workspace
  - The runtime is replaceable
  - Knowledge authority stays reviewed and singular
