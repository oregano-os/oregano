tests:
  - Non-production qualification requires distinct environment, database branch, runtime, secret namespace, communication binding, Source binding set, and model budget evidence.
  - KnowledgeBench records Recall at K, reciprocal rank, authority-label accuracy, citation membership, degradation, and authorization leakage without persisting queries or excerpts.
  - Retrieval V3 projection writes are idempotent, count-verified, independently activated, and rollback to the previous active projection without changing durable Brain or Handbook objects.
  - Lexical and semantic SQL candidate generation receives only pre-authorized policy identities and never loads unauthorized unit content first.
  - Embedding profile and dimensions are projection evidence, while lexical retrieval remains available after embedding failure.
  - Current Brief reads only the current immutable Working Synthesis version through an authorized policy set and exposes staleness without rewriting content.
  - Brain-first context and Answer Envelope validation bind every citation and substantive claim to one exact authorized context receipt.
  - Open Loops and Meeting Prep remain deterministic cited views over authorized Claims, Briefs, and retrieval hits.
  - Knowledge Doctor fails production readiness on ACL leakage, missing isolation, unqualified schema, missing benchmark evidence, stale projection, invalid citations, or unhealthy Sources.
