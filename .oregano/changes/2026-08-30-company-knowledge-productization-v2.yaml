migration: >-
  Add companyos-postgres@1.7.0 after 1.6.0. The additive migration creates
  rebuildable Retrieval V3 projection, benchmark, and shadow-comparison tables
  plus an optional pgvector Retrieval Unit embedding table. Durable Raw
  Evidence, Pages, Claims, Working Syntheses, decisions, and Handbook snapshots
  are unchanged. Existing 1.0.0 through 1.6.0 manifest identities remain
  immutable and supported.
rollback: >-
  Keep Retrieval V2 active, retire or ignore the Retrieval V3 projection, and
  revert the new Core modules. The phase-seven tables contain derived units and
  payload-free qualification evidence only and may remain unused during code
  rollback. A production switch is not part of this change; an eventual
  activation rollback selects the previously verified projection and immutable
  runtime Artifact.
open_decisions:
  - Exact Neon branch, Vercel project, SecretRefs, Slack binding, Source credentials, and productive model budget remain accountable Instance selections.
  - Production activation requires real staging benchmark, ACL-negative, backup-restore, and shadow-comparison receipts; repository tests cannot create those receipts.
  - Query expansion and model reranking remain disabled until a measured KnowledgeBench improvement justifies them.
