version: 3
plan_id: workflow-fixture-parity-2026-09-06
created: "2026-09-06"
title: Preserve Workspace computation regressions in public fixture tests
objective: >-
  Run the synthetic Workspace computation cases in mandatory Core CI through
  the maintained source inspector and isolated Company Tool runner. Establish
  replacement evidence without importing an old business runtime.
non_goals:
  - Delete legacy executors before engine parity and actual Instance acceptance.
  - Treat computation tests as human acceptance or provider time coverage.
placement: core
change_class: security
files_expected:
  - .oregano/changes/2026-09-06-workflow-fixture-parity.yaml
  - packages/testkit/company-tool-fixture.ts
  - packages/testkit/fixtures/workflow-computations.test.ts
  - packages/testkit/fixtures/workflow-computation-regressions.json
  - packages/testkit/tests/workflow-company-tools.test.ts
  - docs/status/current.md
  - docs/specifications/workflow-execution-v1-draft.md
  - docs/_generated/**
tests:
  - packages/testkit/tests/workflow-company-tools.test.ts
documentation_impact:
  required: true
  affected_documents:
    - status.current
    - specification.workflow-execution-v1
architecture:
  placement:
    core: A provider-free fixture harness runs maintained Company Tool isolation and schema checks.
    packages: Reuses the existing Tool SDK without adding an executor or Package.
    workspace: All computation and business examples remain in synthetic Workspace fixtures.
    instance: No provider bindings, credentials, deployments or effects are introduced.
  mechanisms_extended:
    - mechanism: capability-contracts-and-connectors
      reason: Exercise the existing Company Tool SDK and declared JSON-Schema contracts.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: The harness accepts a fixture Tool directory and contains no process-specific behavior.
rollback: Retain the legacy oracle until full parity and real acceptance; revert only the new fixture tests if necessary.
