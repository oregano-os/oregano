version: 3
plan_id: transcript-processing-scope-2026-09-15
created: 2026-09-15
title: Restrict execution to an activated subset of retained transcript versions
objective: Apply a reviewed Workspace processing subset before opening or advancing source runs without resetting their existing cumulative cohort.
non_goals:
  - Admit new sources, refill slots or change original Records and attempts.
  - Introduce another quota registry, queue or approval system.
placement: core
change_class: security
files_expected:
  - .oregano/changes/2026-09-15-transcript-processing-scope.yaml
  - packages/brain/import-admission.ts
  - packages/runtime/workflow-engine/engine.ts
  - packages/testkit/tests/brain-import-admission.test.ts
  - docs/specifications/brain-import.md
  - docs/operations/workflow-engine.md
  - docs/operations/vercel-workflow-runner.md
tests:
  - packages/testkit/tests/brain-import-admission.test.ts
  - packages/testkit/tests/brain-import-policy.test.ts
documentation_impact:
  required: true
  affected_documents:
    - specification.brain-import
    - operations.workflow-engine
    - operations.vercel-workflow-runner
architecture:
  placement:
    core: Validate exact bounded processing selection and enforce it on source admission and historical execution.
    packages: Existing Workflow and Brain Blueprint; no new package authority.
    workspace: Reviewed maximum and exact transcript identities and versions in Workflow configuration.
    instance: Activate the configuration field through the existing transcript binding; retain all state and costs.
  mechanisms_extended:
    - mechanism: approvals-effects-and-idempotency
      reason: Read the existing immutable cohort and current activated subset before any source processing; keep old source-version identities and receipts.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Any company can pause or reduce a pilot to an exact subset without erasing previously admitted sources or allowing retry-based expansion.
rollback: Preserve the restrictive activation until an intentional reviewed replacement; never remove it silently to resume held sources.
