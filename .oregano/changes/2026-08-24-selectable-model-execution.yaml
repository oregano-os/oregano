    - command.verify-live
    - guide.prepare-instance
rollback: >-
  Revert the model contracts, direct adapter, setup schema, Runner selection,
  evidence checks, dependencies, tests, and documentation together through a
  checked Core change. Existing Vercel AI Gateway Instances keep their current
  route. Revoking or deleting an Anthropic key remains an explicit Platform
  Administrator action in Anthropic and the runtime host secret store.
open_decisions: []
