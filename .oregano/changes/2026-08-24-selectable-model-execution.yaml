  - pnpm companyos inspect-core --plan .oregano/changes/2026-08-24-selectable-model-execution.yaml
  - pnpm docs:check
  - pnpm check
  - pnpm runner:build
  - git diff --check
tests:
  - New setup answers record an explicit model execution route and unsupported route/model combinations are rejected.
  - Legacy answer files that omit both route fields preserve the Vercel AI Gateway platform behavior.
  - The Gateway route needs no provider API key and keeps the current model-string behavior.
  - The direct Anthropic route resolves through the Anthropic SDK and fails closed when ANTHROPIC_API_KEY is unavailable.
  - The user enters ANTHROPIC_API_KEY only in the Vercel project Production secret UI; setup records only its name, presence, and Sensitive classification.
  - Existing Production variables are never read, overwritten, or silently adopted.
  - Health and production confirmation bind the exact route and model.
  - The Slack setup response is produced only after a real model call and persists non-secret model execution evidence in Neon.
  - Live verification rejects missing or mismatched model execution evidence for new setup state.
  - Legacy completed setup state remains readable under its original narrower verification claim.
documentation_impact:
  required: true
  affected_documents:
    - onboarding.index
    - onboarding.company-workspace
    - architecture.company-instance
    - architecture.oregano-core
    - architecture.boundaries
    - specification.company-instance-release-promotion-v0.1
    - status.current
