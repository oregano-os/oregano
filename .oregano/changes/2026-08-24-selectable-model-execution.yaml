version: 1
plan_id: selectable-model-execution-2026-08-24
status: approved
author: codex-agent
created: 2026-08-24
title: Make model execution selectable and prove direct Anthropic use
objective: >-
  Let a new Company Instance select either the maintained Vercel AI Gateway
  route or a direct Anthropic route, keep every provider credential exclusively
  in the runtime host secret store, and require model-backed live evidence for
  the exact selected route and model before setup can complete.
non_goals:
  - Add Vercel AI Gateway BYOK to the maintained first-installation path.
  - Add direct OpenAI, Bedrock, Vertex, Railway, Docker, or Hetzner deployment adapters.
  - Store, proxy, print, or transport an Anthropic API key through chat, Git, setup answers, setup state, an Artifact, or command arguments.
  - Change Company Workspace authority, Agent Tool grants, or the supervised Slack workflow.
placement: core
change_class: security
vision_principles_affected:
  - A company-independent Core
  - Evidence beats claims
  - The runtime is replaceable
  - Onboarding has no hidden steps
  - The reference stack is concrete, not mandatory
  - Readiness is scoped and evidenced
