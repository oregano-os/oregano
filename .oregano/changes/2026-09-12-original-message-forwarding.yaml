version: 3
plan_id: original-message-forwarding-2026-09-12
created: 2026-09-12
title: Forward original messages without model transcription
objective: Let the coordinator select a concern without copying its text, and forward the verified original message while retaining bounded excerpts for split concerns.
non_goals:
  - Change identity, work authorization, or effect approval rules.
  - Add fuzzy matching, another routing mechanism, or company-specific behavior.
placement: core
change_class: security
files_expected:
  - .oregano/changes/2026-09-12-original-message-forwarding.yaml
  - packages/runtime/shared-conversation.ts
  - packages/connectors/slack/workflow-transport.ts
  - packages/runner-vercel/src/lib/bot.ts
  - packages/runner-vercel/src/lib/conversation-coordinator.ts
  - packages/runner-vercel/src/lib/conversation-coordinator.test.ts
  - packages/runner-vercel/src/lib/workflow-conversations.ts
  - packages/runner-vercel/src/lib/workflow-slack.ts
  - packages/testkit/tests/shared-conversation.test.ts
  - packages/testkit/tests/workflow-channel-replies.test.ts
  - docs/operations/workflow-engine.md
  - docs/specifications/companyos-core-v0.7-draft.md
  - docs/status/current.md
  - docs/_generated/**
tests:
  - packages/runner-vercel/src/lib/conversation-coordinator.test.ts
  - packages/testkit/tests/shared-conversation.test.ts
  - packages/testkit/tests/workflow-channel-replies.test.ts
  - packages/testkit/tests/agent-handoff.test.ts
documentation_impact:
  required: true
  affected_documents: [specification.companyos-core-v0.7, operations.workflow-engine, status.current]
architecture:
  placement:
    core: Existing provider-neutral conversation routes use the original message by default; provider adapters retain attributable source reads.
    packages: Synthetic multi-provider and workflow transport regression fixtures.
    workspace: Agent purposes, business questions, and destination policy remain in the Workspace.
    instance: Existing authenticated transport credentials and private receipts remain Instance state.
  mechanisms_extended:
    - mechanism: agent-resolver
      reason: Allow target selection without model transcription of a single concern.
    - mechanism: identity-and-authorization
      reason: Retain provider identity and current work checks while removing redundant whole-message comparison.
    - mechanism: capability-contracts-and-connectors
      reason: Check split excerpts using the same provider text representation as conversation ingress.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: The route contract supports any verified communication surface and any Workspace specialist; Slack-specific rendering stays in its transport adapter.
rollback: Restore the previous Core and Artifact pair. Existing receipts remain readable and no state migration or authorization change is required.
