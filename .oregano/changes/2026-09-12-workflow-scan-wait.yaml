version: 3
plan_id: workflow-scan-wait-2026-09-12
created: 2026-09-12
title: Wait for current Records and expose existing child completion
objective: Automatically retry pending complete-scan reads through durable workflow
  timers while preserving the original read deadline, and let Workspace scanners
  inspect the status of a deduplicated child without another lifecycle store.
non_goals:
  - Retry writes, unknown provider outcomes, authorization or integrity failures.
  - Change multi-Agent conversation routing, provider access or company policy.
  - Reopen completed children or introduce a second workflow status store.
placement: core
change_class: security
files_expected:
  - .oregano/changes/2026-09-12-workflow-scan-wait.yaml
  - packages/records/current-scan.ts
  - packages/runtime/companyos-runtime.ts
  - packages/runtime/workflow-engine/engine.ts
  - packages/runtime/workflow-engine/state-validation.ts
  - packages/state-store/workflow-engine.ts
  - packages/companyos-builder/workflow-authoring.ts
  - packages/testkit/tests/record-current-scan.test.ts
  - packages/testkit/tests/workflow-current-scans.test.ts
  - packages/testkit/tests/workflow-collection.test.ts
  - docs/operations/workflow-engine.md
  - docs/_generated/document-registry.json
tests:
  - packages/testkit/tests/record-current-scan.test.ts
  - packages/testkit/tests/workflow-current-scans.test.ts
  - packages/testkit/tests/workflow-collection.test.ts
documentation_impact:
  required: true
  affected_documents:
    - operations.workflow-engine
architecture:
  placement:
    core: Recognize trusted pending Records reads and reuse durable workflow timers.
    packages: Keep complete inventory validation and effect reconciliation intact.
    workspace: Define which children to start and what their completion means.
    instance: Retain current exact source bindings and timer workers.
  mechanisms_extended:
    - mechanism: timers-and-business-time
      reason: Reuse persisted waits, immutable inputs and semantic child identity.
    - mechanism: company-records
      reason: Distinguish pending source scans from invalid inventory proof.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Any workflow using the standard Records query or child start
    benefits independently of company, Agent and communication provider.
rollback: Restore the prior pin for new runs. Drain records waits with the new
  runtime before downgrading; retained older artifacts and completed runs are unchanged.
