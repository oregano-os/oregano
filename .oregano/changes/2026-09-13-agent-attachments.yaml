documentation_impact:
  required: true
  affected_documents: [specification.model-recipes, operations.agent-attachments, status.current, guide.author-company-tool]
architecture:
  placement:
    core: Common authorized attachment preparation, transport mapping and validated versioned provider policy data; existing model execution enforces aggregate limits.
    packages: No new Package; public fixtures are synthetic.
    workspace: Existing Agent scopes, instructions, grants and routing remain authoritative; no per-Agent file switch.
    instance: Existing authorized channel readers and expiring chat state retain original inputs; model credentials and exact routes remain unchanged.
  mechanisms_extended:
    - mechanism: model-recipe-resolver
      reason: Associate the selected provider and model with configurable attachment support and limits before every native model request.
    - mechanism: capability-contracts-and-connectors
      reason: Carry authorized file inputs as untrusted content through existing chat, language and coding-adapter boundaries.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: The same file contract and provider policy apply to every company and Agent; no company or Agent identifiers determine file support.
rollback: Restore the preceding Core commit. Retained optional attachment references can expire in existing chat state; no business schema migration or provider cleanup is needed.
