version: 3
plan_id: agent-attachments-2026-09-13
created: "2026-09-13"
title: Share bounded native attachments across Agent calls
objective: Give Agents authenticated PDF, image and Markdown inputs through shared preparation and adjustable Core provider policies using documented provider limits, with no arbitrary Markdown cap and serialized request checks before network I/O.
non_goals:
  - Add DOCX parsing, OCR, PDF rendering, file search or automatic provider fallback.
  - Grant new channel scopes, change human approval or deploy an Instance.
  - Treat file byte limits as an exact PDF token or page count.
placement: core
change_class: security
