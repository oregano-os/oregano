version: 1
plan_id: release-v0.2.0-2026-08-22
status: implemented
author: codex-agent
created: 2026-08-22
title: Release the solo Steward and Maintainer contract as Oregano v0.2.0
objective: >-
  Publish one immutable stable Oregano release whose agent installation path,
  generated Workspace, and Core governance let one accountable person complete
  setup and checked changes without a mandatory independent reviewer.
non_goals:
  - Publish the private Workbench as an npm package.
  - Add a floating release branch or mutable latest-stable tag.
  - Remove pull requests, required CI, explicit confirmations, or release provenance.
placement: core
change_class: security
vision_principles_affected:
  - Human authority is explicit
  - Evidence beats claims
  - Onboarding has no hidden steps
files_expected:
  - .oregano/changes/2026-08-22-release-v0.2.0.yaml
  - package.json
  - docs/**
  - packages/cli/package.json
  - packages/cli/tests/**
  - packages/testkit/**
required_approvals:
  - product-owner
  - oregano-maintainer
approvals:
  - role: product-owner
    approver: fylingpete
    approved_at: 2026-08-22
    evidence: explicit-user-approval-in-codex-task-to-publish-the-release
  - role: oregano-maintainer
    approver: fylingpete
    approved_at: 2026-08-22
    evidence: explicit-user-instruction-in-codex-task-to-complete-the-release
validation:
  - pnpm companyos versions packages/testkit/fixtures/acme-casas
  - pnpm companyos inspect-core --plan .oregano/changes/2026-08-22-release-v0.2.0.yaml
  - pnpm docs:check
  - pnpm check
  - pnpm runner:build
  - git diff --check
tests:
  - Core and Workbench report the exact release versions
  - maintained Workspace fixtures pin the exact compatible Core and Workbench versions
  - the full public boundary, documentation, type, runtime, and setup suites pass
  - release assets are generated from a clean exact v0.2.0 tag
documentation_impact:
  required: true
  affected_documents:
    - status.current
    - workbench.overview
migration: >-
  No customer Workspace has been installed, so there is no deployed data or
  repository to migrate. Any unpublished test Workspace must regenerate or
  update its exact Core pin to 0.2.0 and Workbench pin to
  0.1.0-experimental.4 before validation.
rollback: >-
  Do not mutate or delete the immutable release. Restore the previous contract
  through a new checked release and direct users to that newer exact version;
  v0.1.0 remains available as historical provenance.
open_decisions: []
