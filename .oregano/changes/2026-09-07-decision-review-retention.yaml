documentation_impact:
  required: true
  affected_documents: [operations.vercel-workflow-runner]
architecture:
  placement:
    core: Extend the existing decision presenter without changing decision or effect authority.
    packages: No new Package behavior.
    workspace: Retain the declared conversation, field rules and review wording.
    instance: Use the existing test Instance; no new credentials or scopes.
  mechanisms_extended:
    - mechanism: identity-and-authorization
      reason: Keep existing exact identity and delivery checks before editing any card.
    - mechanism: approvals-effects-and-idempotency
      reason: Presentation never supplies consent or changes approval and effect state.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Any company workflow can place human review in its existing conversation and resume through maintained effect controls.
rollback: Restore prior host and Workspace declarations together; retain stored Artifacts, decisions and receipts. Never reopen completed runs.
