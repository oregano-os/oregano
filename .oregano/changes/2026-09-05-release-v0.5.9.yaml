version: 2
plan_id: release-v0.5.9-2026-09-05
status: approved
author: codex-agent
created: 2026-09-05
title: Prepare Oregano v0.5.9 governed communication replay patch
objective: >-
  Prepare one exact stable Oregano Core patch release containing the reviewed
  provider-neutral Slack Record Source, communication projections, controlled
  historical Sprint replay, digest-bound test publication, documentation, and
  reproducible release evidence without activating any Company Instance.
non_goals:
  - Deploy, promote, migrate, or activate a Company Workspace or Company Instance.
  - Read a real company source or publish to any real provider destination.
  - Put company identities, resources, credentials, schedules, copy, or retention choices in Core.
  - Claim completion of any company's Shadow, Pilot, or Team-rhythm rollout gates.
placement: core
change_class: security
vision_principles_affected:
  - A company-independent Core
  - Evidence beats claims
  - Documentation is part of the system
files_expected:
  - .oregano/changes/2026-09-05-release-v0.5.9.yaml
  - docs/status/current.md
  - package.json
  - packages/cli/tests/**
  - packages/testkit/fixtures/acme-casas/.companyos/compatibility.yaml
required_approvals:
  - oregano-maintainer
approvals:
  - role: oregano-maintainer
    approver: workspace-steward
    approved_at: 2026-09-05
    evidence: explicit-user-selection-a-at-core-pr-28-readiness-gate-and-instruction-to-complete-the-release-and-rollout
architecture_assessment:
  responsibilities:
    core:
      - Own the exact Core patch identity and reproducible release evidence for the reviewed company-neutral implementation.
    packages:
      - Ship the existing reusable Sprint and communication contracts without company values.
    workspace:
      - Adopt the immutable release later through a separately reviewed exact compatibility pin.
    instance:
      - Qualify sources, deploy, synchronize, replay, and publish to exact test destinations through a separate production change plan.
  existing_mechanisms:
    - mechanism: agent-resolver
      decision: reuse
      reason: Historical ingestion never derives Agent authority from message content and the publisher is deliberately non-routable.
    - mechanism: toolset-resolver
      decision: reuse
      reason: Test publication remains limited to two ordinary compiled Tool grants.
    - mechanism: model-recipe-resolver
      decision: reuse
      reason: Deterministic normalization and replay require no new model route.
    - mechanism: company-records
      decision: reuse
      reason: Communication versions, projections, lineage, watermarks, and receipts use the existing generic records boundary.
    - mechanism: identity-and-authorization
      decision: reuse
      reason: Provider identities remain evidence and map through the existing tenant roster boundary.
    - mechanism: timers-and-business-time
      decision: reuse
      reason: Replay uses the reviewed controlled-clock Sprint path without changing production time.
    - mechanism: approvals-effects-and-idempotency
      decision: reuse
      reason: Exact digest review, claims, receipts, and duplicate protection remain mandatory for test publication.
    - mechanism: capability-contracts-and-connectors
      decision: reuse
      reason: The maintained Slack source and test effects use the reviewed provider-neutral contracts and existing standard Tools.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: >-
    This release identifies only company-neutral runtime and Workbench behavior.
    Every company source, person, schedule, provider binding, credential,
    retention choice, replay period, and output destination remains external.
release_classification:
  selected_increment: patch
  previous_version: 0.5.8
  target_version: 0.5.9
  rationale: >-
    The additive behavior is backward compatible, inactive without explicit
    Workspace and Instance declarations, and remains within the existing
    experimental Company Records and Sprint profile. Existing consumers need
    no migration. The Workbench remains 0.1.0-experimental.15.
validation:
  - pnpm companyos plan --check .oregano/changes/2026-09-05-release-v0.5.9.yaml
  - pnpm companyos inspect-core --base origin/main --plan .oregano/changes/2026-09-05-release-v0.5.9.yaml
  - pnpm companyos versions packages/testkit/fixtures/acme-casas --format json
  - pnpm docs:generate
  - pnpm docs:check
  - pnpm check
  - pnpm runner:build
  - git diff --check
tests:
  - Core reports 0.5.9 while Workbench remains 0.1.0-experimental.15.
  - Existing Workspaces and Instances remain unchanged and all new behavior stays opt-in.
  - Communication ingestion, Sprint replay, digest binding, test-only output, idempotency, and proof boundaries pass the full suite.
  - Release assets remain impossible until the exact candidate is merged to main and tagged v0.5.9.
documentation_impact:
  required: true
  affected_documents:
    - status.current
  reason_if_none: ""
migration: >-
  Existing v0.5.8 Workspaces and databases require no migration merely because
  this release exists. Adoption requires an exact Workspace compatibility pin
  and a separately controlled Instance deployment; any database migration is
  an Instance effect.
rollback: >-
  Before publication, close or revert the candidate and remain on exact v0.5.8.
  After publication, consumers may remain on v0.5.8; correct defects only in a
  newer patch. Disable adopted sources, replay, and publication before an
  Instance rollback while retaining immutable evidence.
open_decisions: []
