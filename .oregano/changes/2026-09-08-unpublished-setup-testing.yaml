version: 3
plan_id: unpublished-setup-testing-2026-09-08
created: "2026-09-08"
title: Test exact unpublished installer bundles without a public release
objective: >-
  Add an explicit local candidate acquisition path, bind its identity into the
  standard setup decision and resume evidence, and generate initial Workspace
  checks that use the exact candidate source without a release lookup. Check
  other branches and worktrees for conflicts without modifying their work.
non_goals:
  - Publish a release or change existing company resources.
  - Claim live timing or database integration evidence from synthetic tests.
  - Merge unrelated branches or replace their uncommitted work.
placement: core
change_class: security
files_expected:
  - .oregano/changes/2026-09-08-unpublished-setup-testing.yaml
  - scripts/build-setup-bundle.mjs
  - scripts/install-companyos.mjs
  - scripts/qualify-standard-setup.mjs
  - packages/cli/src/setup/standard-defaults.mjs
  - packages/cli/src/setup/standard-setup.mjs
  - packages/cli/src/live-setup.mjs
  - packages/cli/src/operating-starter.mjs
  - packages/cli/tests/standard-release.test.mjs
  - packages/cli/tests/standard-setup.test.mjs
  - INSTALL-COMPANYOS.md
  - docs/plans/2026-09-08-setup-integration-review.md
  - docs/onboarding/setup-options.md
  - docs/onboarding/README.md
  - docs/onboarding/company-workspace.md
  - docs/architecture/company-instance.md
  - docs/architecture/system-boundaries.md
  - docs/specifications/company-instance-release-and-promotion-v0.1-draft.md
  - docs/status/current.md
  - docs/workbench/commands/setup.md
  - docs/workbench/commands/verify-live.md
  - docs/_generated/document-registry.json
  - docs/_generated/navigation.json
tests:
  - packages/cli/tests/standard-release.test.mjs
  - packages/cli/tests/standard-setup.test.mjs
  - packages/cli/tests/live-setup.test.mjs
  - packages/cli/tests/workbench.test.mjs
documentation_impact:
  required: true
  affected_documents:
    - plan.setup-integration-review
    - onboarding.setup-options
    - onboarding.index
    - onboarding.company-workspace
    - architecture.company-instance
    - architecture.boundaries
    - specification.company-instance-release-promotion-v0.1
    - status.current
    - command.setup
    - command.verify-live
architecture:
  placement:
    core: Exact candidate acquisition, generation of pinned initial checks, and setup provenance.
    packages: Reuse the existing relocatable runtime dependency bundle.
    workspace: Store the candidate marker and exact Core pin in generated initialization evidence.
    instance: Retain private candidate receipts and the existing fresh-resource setup decision.
  mechanisms_extended:
    - mechanism: identity-and-authorization
      reason: Bind candidate identity into the existing reviewed setup scope.
    - mechanism: approvals-effects-and-idempotency
      reason: Resume only the originally acquired candidate and retain existing provider receipts.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Any maintainer can test an exact candidate with fresh resources before publishing a release.
rollback: Remove the candidate entry for new installations while retaining exact candidate bundles and receipts for existing test sessions. Do not delete resources or relabel candidate evidence as release qualification.
