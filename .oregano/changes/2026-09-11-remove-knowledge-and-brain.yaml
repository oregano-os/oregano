architecture:
  placement:
    core: Remove generic Knowledge runtime, contracts and provisioning; retain the existing Core
      enforcement and Workspace file mechanisms.
    packages: Remove only Brain dependencies from synthetic Blueprints and maintained connectors;
      preserve independent workflows and repository integrations.
    workspace: Keep Markdown content, roster authority, existing file scopes and governed editing; stop
      generating Brain directories and Knowledge grants.
    instance: Explicitly retire the obsolete Knowledge schema and dedicated configuration through a
      scoped migration after old writers stop.
  mechanisms_extended:
    - mechanism: identity-and-authorization
      reason: Preserve roster identity, groups and approval enforcement while retiring Knowledge-only
        permissions.
    - mechanism: toolset-resolver
      reason: Remove Knowledge capabilities without changing resolution or grants for retained Tools.
    - mechanism: model-recipe-resolver
      reason: Preserve generic model routing and move its shared documentation out of the retired
        Knowledge specification.
    - mechanism: company-records
      reason: Preserve Records persistence and qualification when removing the neighboring Knowledge
        schema.
    - mechanism: approvals-effects-and-idempotency
      reason: Preserve all effect controls and isolate one-time schema retirement from normal startup.
    - mechanism: capability-contracts-and-connectors
      reason: Retire only Knowledge interfaces while maintaining ordinary provider and repository
        integration.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Plain Markdown Workspaces and the retained generic runtime serve every company
    without a company-specific Brain integration.
rollback: Before any live schema deletion, restore the prior exact Core and Workspace pairing if
  needed. After deletion, application rollback alone cannot restore Knowledge data; a separately
  retained recovery copy is required. Preserve control and Records state and record any completed
  Instance retirement.
