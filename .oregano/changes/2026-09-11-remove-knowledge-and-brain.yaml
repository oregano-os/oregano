version: 3
plan_id: remove-knowledge-and-brain-2026-09-11
created: 2026-09-11
title: Remove Brain and Knowledge services and retain a Markdown Handbook
objective: Remove the complete Knowledge and Brain subsystem, including database-backed Handbook
  search, special curation and authorization, imports, runtime jobs, and Workbench commands. Keep
  ordinary Handbook Markdown, the structured authorization roster, scoped Workspace materials, and
  all unrelated Core mechanisms. Update setup, onboarding, documentation, and migration evidence.
  Target Core 0.14.0 and Workbench 0.1.0-experimental.22. Preserve the current Workflow, Builder
  release and bounded database qualification contracts. Introduce database manifest 3.0.0 without
  changing the published 2.0.0 identity. Preserve the independent Granola provider integration for
  later use; retire only its Brain consumer.
non_goals:
  - Replace Brain or add another Handbook search or permission system.
  - Remove Company Records, chat state, Builder, Sprint, general model routing, or effect approvals.
  - Delete a shared database, provider source originals, or an unspecified live Instance.
  - Release or deploy this change without the separately targeted rollout.
  - Remove Granola provider access, its connection declaration, configuration or credentials;
    activate a replacement consumer.
placement: core
change_class: security
