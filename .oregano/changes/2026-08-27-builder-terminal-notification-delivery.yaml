version: 1
plan_id: builder-terminal-notification-delivery-2026-08-27
status: implemented
author: codex-agent
created: 2026-08-27
title: Make Builder terminal notifications durable and card-resolving
objective: >-
  Persist terminal Builder notification delivery, retry transient Chat-provider
  failures under an independent lease, and replace the queued action card with
  the final published, failed, or cancelled outcome when its message identity is
  available.
non_goals:
  - Retry or resume a terminal coding-agent execution.
  - Change Builder proposal validation, publication, merge, or deployment authority.
  - Add Slack-specific fields to provider-neutral Builder execution evidence.
  - Guarantee exactly-once fallback posting for legacy jobs without a stored message identity.
placement: core
change_class: security
vision_principles_affected:
  - Human authority is explicit
  - Evidence beats claims
  - The runtime is replaceable
  - Documentation is part of the system
files_expected:
  - .oregano/changes/2026-08-27-builder-terminal-notification-delivery.yaml
  - docs/specifications/builder-governance.md
  - docs/status/current.md
  - docs/workbench/guides/operate-builder.md
  - packages/cli/content/guides/operate-builder.md
  - packages/runtime/builder/notifications.ts
  - packages/runtime/builder/service.ts
  - packages/state-store/builder-jobs.ts
  - packages/state-postgres/builder-job-store.ts
  - packages/state-postgres/migrate.ts
  - packages/testkit/adapter/in-memory-builder-jobs.ts
  - packages/testkit/tests/builder-notifications.test.ts
  - packages/runner-vercel/src/app/api/builder/worker/route.ts
  - packages/runner-vercel/src/lib/bot.ts
  - packages/runner-vercel/src/lib/builder/action-cards.ts
  - packages/runner-vercel/src/lib/builder/action-cards.test.ts
  - packages/runner-vercel/src/lib/builder/chat-notifier.ts
  - packages/runner-vercel/src/lib/builder/chat-notifier.test.ts
required_approvals:
  - oregano-maintainer
approvals:
  - role: oregano-maintainer
    approver: fylingpete
    approved_at: 2026-08-27
    evidence: explicit-user-instruction-in-codex-task-to-implement-the-diagnosed-builder-notification-fix
validation:
  - pnpm companyos plan --check .oregano/changes/2026-08-27-builder-terminal-notification-delivery.yaml
  - pnpm companyos inspect-core --plan .oregano/changes/2026-08-27-builder-terminal-notification-delivery.yaml
  - pnpm docs:check
  - pnpm check
  - pnpm runner:build
  - node --experimental-strip-types --test packages/testkit/tests/builder-notifications.test.ts
  - node --experimental-strip-types --test packages/runner-vercel/src/lib/builder/action-cards.test.ts packages/runner-vercel/src/lib/builder/chat-notifier.test.ts
  - git diff --check
tests:
  - A terminal transition creates one pending notification without making the job executable again.
  - Notification claims are exclusive, recover after a stale lease, and remain independent from execution leases.
  - A transient delivery failure persists a bounded error and retry time; a later worker can deliver it.
  - Successful delivery is terminal and cannot be claimed again.
  - New Slack-bound jobs retain the action message identity and replace the queued card with a terminal card containing no actions.
  - Legacy jobs without a message identity receive a fallback thread post.
documentation_impact:
  required: true
  affected_documents:
    - specification.builder-governance
    - status.current
    - guide.operate-builder
rollback: >-
  Revert the notification coordinator, Chat notifier, and job-message binding;
  stop claiming pending notification deliveries; and leave the additive nullable
  Postgres columns in place until a separately approved cleanup. Terminal Builder
  job and proposal evidence remains valid.
open_decisions: []
