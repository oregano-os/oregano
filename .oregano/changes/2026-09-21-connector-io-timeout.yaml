  - packages/testkit/fixtures/lindenhof-studio/.companyos/compatibility.yaml
  - package.json
  - packages/runtime/companyos-runtime.ts
  - packages/tool-sdk/isolated-runner.ts
  - packages/testkit/tests/reference-runtime.test.ts
  - packages/testkit/tests/tool-sdk-security.test.ts
  - docs/workbench/guides/author-a-company-tool.md
  - packages/cli/content/guides/author-a-company-tool.md
  - docs/operations/workflow-engine.md
  - docs/_generated/**
