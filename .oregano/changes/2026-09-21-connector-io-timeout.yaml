documentation_impact:
  required: true
  affected_documents: [guide.author-company-tool, operations.workflow-engine]
architecture:
  placement:
    core: Enforce bounded Tool execution and stop sandbox IPC safely after settlement.
    packages: Existing declared capabilities continue through the same Connector boundary.
    workspace: Business selection, schedules, recipients and Tools remain Workspace-owned.
    instance: Operators retain exact deployed provenance and authorize stopped-run recovery.
  mechanisms_extended:
    - mechanism: capability-contracts-and-connectors
      reason: Allow existing privileged Connector I/O a finite wall-clock budget without increasing grants.
    - mechanism: approvals-effects-and-idempotency
      reason: Preserve durable effect outcomes and do not dispatch calls or send sandbox replies after termination.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: All companies and providers receive the same bounded Connector I/O behavior, including Records and communications.
rollback: Restore the previous exact Core and Artifact deployment; preserve run and effect receipts. No database migration.
