version: 3
plan_id: connector-io-timeout-2026-09-21
created: "2026-09-21"
title: Allow bounded Connector I/O beyond the pure Tool deadline
objective: Release Core 0.16.1 with a bounded sixty-second Connector Tool deadline and safe handling of late sandbox replies.
non_goals:
  - Retry external effects automatically or relax grants, approval, scan completeness or idempotency.
  - Add company data, provider credentials or new runtime permissions.
placement: core
change_class: security
files_expected:
  - packages/cli/tests/live-setup.test.mjs
  - packages/cli/tests/core-pin-guard.test.mjs
  - packages/cli/tests/workbench.test.mjs
  - packages/testkit/tests/brain-skill-materialization.test.ts
