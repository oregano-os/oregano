version: 3
plan_id: workflow-output-evidence-2026-09-15
created: 2026-09-15
title: Select Workflow outputs without requesting unrelated feedback history
objective: Permit an explicit output-only read of retained Workflow state, preserving the default feedback event bounds and distinguishing omitted feedback from an empty result.
non_goals:
  - Broaden historical read scopes, time windows or result limits.
  - Introduce a processing registry or expose storage access to Company Tools.
placement: core
change_class: security
files_expected:
  - .oregano/changes/2026-09-15-workflow-output-evidence.yaml
  - .oregano/changes/2026-09-14-brain-import.yaml
  - packages/capabilities/evidence.ts
  - packages/connectors/historical-evidence.ts
  - packages/testkit/tests/historical-evidence.test.ts
  - docs/operations/workflow-engine.md
  - docs/specifications/workflow-execution-v1-draft.md
  - docs/status/current.md
  - docs/_generated/**
tests:
  - packages/testkit/tests/historical-evidence.test.ts
documentation_impact:
  required: true
  affected_documents:
    - operations.workflow-engine
    - specification.workflow-execution-v1
    - status.current
architecture:
  placement:
    core: An explicit include_feedback=false query omits unrelated feedback events, returns feedback=null and records that omission. Existing defaults and bounds remain.
    packages: Existing evidence.query Capability; no extra Tool or provider adapter.
    workspace: Requests exact completed source-version step outputs; feedback is unnecessary for source-claim reconciliation.
    instance: Existing immutable run identities and state retain all prior results and model costs.
  mechanisms_extended:
    - mechanism: capability-contracts-and-connectors
      reason: Extend bounded Historical Evidence reads; preserve current Agent, Workflow, group and time-window authorization.
    - mechanism: approvals-effects-and-idempotency
      reason: Read existing durable execution records without resetting completed effects or allocating another import slot.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Any company can inspect retained outputs of long workflows without claiming complete feedback history or increasing an event limit.
rollback: Omit exact key filters to retain prior bounded query behavior; preserve existing executions and evidence.
