version: 3
plan_id: workflow-record-contracts-2026-09-05
created: "2026-09-05"
title: Establish real record and message contracts for declarative workflows
objective: >-
  Replace assumed reference Tool outputs with maintained typed contracts.
  Extend Company Records with declared generic filters, bounded complete reads
  from one immutable database snapshot, and explicit complete-source evidence.
  A fresh row or webhook cursor never proves synchronization through a cutoff.
  Publish the workflow execution specification frame without claiming that its
  future compiler or engine is implemented.
non_goals:
  - Activate a Company Instance, modify production data, or remove legacy execution.
  - Add workflow business rules, a provider, or a second record synchronization service.
  - Claim provider completeness from an unqualified inventory or a partial scan.
placement: core
change_class: security
