documentation_impact:
  required: true
  affected_documents:
    - specification.workflow-execution-v1
    - specification.company-records-query-v1
    - status.current
architecture:
  placement:
    core: >-
      Owns generic query operators, immutable read snapshots, completeness
      evidence, typed Tool contracts and the future execution specification.
    packages: No Package or Blueprint is introduced or changed.
    workspace: Selects source IDs, exposed fields, filter names and operators.
    instance: Owns qualified source inventories and exact provider bindings.
  mechanisms_extended:
    - mechanism: company-records
      reason: >-
        Add explicit projection source selection, bounded immutable snapshots,
        declared filters, all-pages reads and complete-source synchronization
        receipts. Reuse the maintained source synchronization path and stores.
    - mechanism: capability-contracts-and-connectors
      reason: >-
        Share actual Records query schemas across the Capability and standard
        Tool; expose the existing message receipt schema in its standard Tool.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: >-
    Any workflow can filter authorized operational records and require evidence
    of a complete scan. Operator names and paths contain no company rules.
rollback: >-
  Revert the scoped implementation before consumers adopt the extensions.
  Additional completeness metadata uses existing immutable receipt JSON;
  no destructive migration or production change is needed.
