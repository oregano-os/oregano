architecture:
  placement:
    core: Generic hosted worker bounds, authenticated context, activation and retained progress.
    packages: Reuse existing communication, directory, Records and Company Tool contracts.
    workspace: Owns every process, calendar, template, role and business input rule.
    instance: Supplies exact credentials, execution enablement, current roster and qualified provider bindings.
  mechanisms_extended:
    - mechanism: agent-resolver
      reason: Give exact persisted workflow assignments precedence within authenticated conversations.
    - mechanism: timers-and-business-time
      reason: Persist bounded worker scan continuations using existing durable timers.
    - mechanism: identity-and-authorization
      reason: Authenticate operator credentials and human responses without accepting request-supplied authority.
    - mechanism: approvals-effects-and-idempotency
      reason: Route scheduled and interactive activity through the existing durable interpreter and Runtime guards.
    - mechanism: capability-contracts-and-connectors
      reason: Use configured Connectors and provider-qualified receipts for conversation identity.
  new_core_mechanisms:
    - Generic hosted workflow worker configuration and HTTP entrypoints.
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: No business field, weekday meaning, Sprint state or company identity is inferred by hosted workers.
rollback: Disable workflow execution and new schedule openings, retain all state and receipts, and keep the previously accepted operating deployment until real acceptance passes.
