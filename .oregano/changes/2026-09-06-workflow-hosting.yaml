title: Host generic workflow workers and authenticated conversation routing
objective: >-
  Connect the durable interpreter to bounded hosted workers, explicit Instance
  activation, authenticated operator controls and exact transport assignments.
  Reuse existing database, timer, Connector and Slack transport mechanisms.
non_goals:
