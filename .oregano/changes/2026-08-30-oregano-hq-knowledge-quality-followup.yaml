title: Refresh Oregano HQ knowledge, verify Strategy Current Briefs, and improve canary recall
objective: >-
  Correct successful Source freshness evidence, incrementally reconcile and
  extract the Oregano HQ meeting Source, verify existing cited Working
  Syntheses and Strategy Current Briefs with subject-specific freshness,
  diagnose the two payload-free production benchmark misses, apply only
  bounded retrieval-quality improvements, and promote a new projection only
  through the existing production-canary gates.
non_goals:
  - Make Retrieval V3 the default for another Company Instance.
  - Weaken ACL, citation, Source, fallback, or activation gates.
  - Rewrite Source evidence, Claims, synthesis history, or the Handbook.
  - Treat a Current Brief or Working Synthesis as official company policy.
placement: core
change_class: security
vision_principles_affected:
