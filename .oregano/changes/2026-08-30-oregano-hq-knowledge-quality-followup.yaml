  - run production Source reconcile, extraction, compounding, projection, qualification, and live verification
  - git diff --check
tests:
  - A successful Source status transition records a fresh synchronization timestamp without rewriting earlier Source evidence.
  - Failed, stale, registered, and revoked transitions do not fabricate a successful synchronization timestamp.
  - Production diagnostics expose no query, excerpt, source content, credential, or secret value.
  - Current Brief remains synthesized, cited, versioned, authorization-first, and non-official.
  - Current Brief freshness is scoped to new Claims for the exact subject and current Page version.
  - A failed model spend reservation can retry after the bounded stale window without bypassing cycle or daily budgets.
  - Recall improvement preserves zero authorization leakage and complete citation membership.
documentation_impact:
  required: true
  affected_documents:
    - status.current
    - guide.operate-knowledge-provider
migration: >-
  No schema migration. Update successful Source health evidence through the
  existing row, run bounded idempotent reconciliation and model work, then
  build a new immutable derived Retrieval V3 projection.
rollback: >-
  Keep the current active projection and V2 runtime fallback until the new
  projection qualifies. If live verification fails, restore runtime mode v2 or
  the prior active projection; do not delete durable Source, Claim, or
  synthesis history.
