  - node packages/cli/src/cli.mjs plan --check .oregano/changes/2026-08-30-oregano-hq-knowledge-quality-followup.yaml
  - node packages/cli/src/cli.mjs inspect-core --plan .oregano/changes/2026-08-30-oregano-hq-knowledge-quality-followup.yaml
