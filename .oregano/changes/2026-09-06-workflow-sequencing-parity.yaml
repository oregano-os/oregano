architecture:
  placement:
    core: Existing compiler, engine, Runtime and isolation execute the test cases unchanged.
    packages: Existing Records and Company Tool contracts provide the data boundary.
    workspace: Explicitly chooses when to read current work facts while retaining its participant snapshot.
    instance: Synthetic bindings and controlled clocks only; no provider activation.
  mechanisms_extended:
    - mechanism: company-records
      reason: Query current work-item rows at the declared chase/report instants through existing contracts.
    - mechanism: approvals-effects-and-idempotency
      reason: Verify empty changes skip approval and reporting preserves actual delivery order.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: The correction changes synthetic Workspace steps, not engine business rules.
rollback: Retain the existing deployment and legacy oracle until the corrected Workspace passes all migration gates.
