version: 2
plan_id: instance-runtime-connectors-stage0-2026-09-02
status: implemented
author: codex-agent
created: 2026-09-02
title: Bind maintained Monday and Slack Connectors in a protected Stage-0 Instance
objective: >-
  Complete the reusable Core runtime path that compiles non-secret Connector
  instance configuration into the Artifact, instantiates the maintained Monday
  work-item and Slack communication Connectors in the Vercel Runner, and
  exposes a protected non-production qualification harness for exact,
  reversible, receipt-backed Stage-0 tests.
non_goals:
  - Add any pilot-company board, channel, person, account, or provider identifier to Core source, documentation, or public fixtures.
  - Touch a production Monday board, publish to a production Slack destination, migrate production data, enable a schedule, or deploy production.
  - Store a provider credential in an Artifact, Company Workspace, request, response, log, receipt, or Git.
  - Treat the Stage-0 harness as production workflow execution or as permission to promote a Company Instance.
  - Change Sprint business policy, message templates, participants, model policy, or provider grants.
placement: core
change_class: security
vision_principles_affected:
  - A company-independent Core
  - Human authority is explicit
  - Evidence beats claims
  - The runtime is replaceable
  - Security before autonomy
  - Onboarding has no hidden steps
  - Documentation is part of the system
