required_approvals:
  - oregano-maintainer
approvals:
  - role: oregano-maintainer
    approver: workspace-steward
    approved_at: 2026-09-02
    evidence: >-
      explicit-user-authorization-to-complete-the-listed-stage0-test-scope-with-test-resources-only;
      the reversible Monday test-board effect, Slack test-channel and direct-message
      deliveries, real Slack app-mention and message.im ingress, exact Agent routing,
      duplicate suppression, denied-resource checks, and callback security fixtures
      were reviewed in the supervised 2026-09-02 Stage-0 session
architecture_assessment:
  responsibilities:
    core:
      - Own generic non-secret Connector instance configuration, maintained Connector factories, exact binding validation, runtime effect controls, and the reusable protected Stage-0 qualification harness.
    packages:
      - Keep the Sprint Blueprint declarative and provider-neutral; it requests Capabilities but owns no live destination, board, token, or deployment.
    workspace:
      - Continue to own company Sprint policy, logical connection and resource names, Agent instructions, Tool requests, workflows, schedules, participants, and templates.
    instance:
      - Own exact test account, board, field, destination, Agent, credential SecretRef, deployment, activation, confirmation, and provider receipt values.
  existing_mechanisms:
    - mechanism: agent-resolver
      decision: reuse
      reason: Stage-0 channel and board routes use exact trusted Instance bindings; message content never selects the initial Agent.
    - mechanism: toolset-resolver
      decision: reuse
      reason: A live Connector is reachable only for a Tool already granted by the Workspace and bound by the Instance Artifact.
    - mechanism: model-recipe-resolver
      decision: reuse
      reason: Connector qualification is deterministic and model-free; later Slack turns retain the separately configured model route.
    - mechanism: company-records
      decision: reuse
      reason: Monday echo evidence and callback replay claims use the existing additive companyos_records StateStore schema.
    - mechanism: identity-and-authorization
      decision: reuse
      reason: Slack incoming identities continue to resolve against the active roster, while proactive destinations are exact Instance bindings.
    - mechanism: timers-and-business-time
      decision: not-applicable
      reason: This change activates no schedule and performs no time-based Sprint decision.
    - mechanism: approvals-effects-and-idempotency
      decision: extend
      reason: The protected harness adds digest-bound non-production plans around the existing Runtime effect claim, optimistic provider version, read-after-write, echo, and duplicate controls.
    - mechanism: capability-contracts-and-connectors
      decision: extend
      reason: The existing maintained Monday Connector is registered in the real Runner, and a thin Slack Connector implements the existing provider-neutral communication Capability.
  new_core_mechanisms:
    - Generic non-secret Connector instance entries compiled into a CompanyOS Artifact.
    - Maintained Slack communication Connector with exact channel or direct-message destination bindings.
    - Protected preview-only Stage-0 plan/apply qualification surface that cannot select production resources.
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: >-
    Every company may compile different Connector instances, resource bindings,
    destinations, accounts, and SecretRefs into its own Artifact without
    changing the maintained Connector implementations or Sprint domain.
validation:
  - pnpm companyos plan --check .oregano/changes/2026-09-02-instance-runtime-connectors-stage0.yaml
  - pnpm companyos inspect-core --base origin/main --plan .oregano/changes/2026-09-02-instance-runtime-connectors-stage0.yaml
  - pnpm docs:generate
  - pnpm docs:check
  - pnpm public:check
  - pnpm typecheck
  - pnpm runner:typecheck
  - pnpm test
  - pnpm runner:build
  - git diff --check
tests:
  - Instance loading accepts bounded non-secret Connector configuration and rejects credential-shaped values or duplicate instance ids.
  - Artifact hashing includes exact Connector instance configuration and remains deterministic.
  - Monday runtime construction resolves only an environment SecretRef, exact resource bindings, explicit API version, actor, and durable echo store.
  - Slack publication refuses unknown destinations, distinguishes channel and DM bindings, requires an idempotency claim, and returns provider message receipts without credentials.
  - The preview harness refuses production, unauthorized requests, wrong confirmation hashes, unbound boards and destinations, stale versions, and oversized requests.
  - The reversible Monday test records before, write, read-after-write, duplicate suppression, echo suppression, restoration, and final reread evidence for one exact test item.
  - Slack qualification posts only the exact configured test messages to the exact configured channel and DM and records provider receipts.
  - Signed callback qualification proves valid delivery, invalid-signature denial, and replay denial through the deployed handler logic.
documentation_impact:
  required: true
  affected_documents:
    - architecture.company-instance
    - specification.company-records-sprint-v0.1
    - guide.prepare-instance
    - command.build
    - status.current
migration: >-
  Existing Instance declarations and Artifacts remain valid because Connector
  instance configuration is optional. A live Company must rebuild and deploy
  an exact Artifact before a maintained runtime Connector becomes available.
  No database migration is introduced; existing companyos and
  companyos_records tables provide effect, echo, replay, and conversation state.
rollback: >-
  Remove the non-production Artifact and Stage-0 environment bindings, disable
  the protected qualification secret, and redeploy the prior Preview. Any test
  item is restored inside the same confirmed operation; retain non-sensitive
  receipts as test evidence. Production remains unchanged.
open_decisions:
  - Production source activation, production destination bindings, schedules, and staged Sprint promotion remain separately reviewed and approved work.
  - The real Monday chat callback reached the still-deployed v0.5.2 production endpoint and correctly exposed that the route is absent there; repeat the deterministic setup probe after the new Core is deployed before enabling any Monday production trigger or effect.
