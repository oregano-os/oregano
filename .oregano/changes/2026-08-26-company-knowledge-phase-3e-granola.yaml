version: 1
plan_id: company-knowledge-phase-3e-granola-2026-08-26
status: approved
author: codex-agent
created: 2026-08-26
title: Implement the maintained Granola hybrid Source Connector
objective: >-
  Add a company-independent Granola Source Connector 2.0 implementation for
  signed reference-only webhooks and overlapping API reconciliation, with exact
  folder scope, bounded note and transcript fetch, shared durable event
  ingestion, fixed-policy or quarantine access, retries, deduplication, and
  payload-free receipts.
non_goals:
  - Create a live webhook endpoint or resolve an Oregano company credential.
  - Claim that the Granola API exposes per-note principal ACLs or an independently observable workspace ID.
  - Persist an oversized transcript before a Raw Asset adapter is qualified.
placement: core
change_class: security
vision_principles_affected:
  - A company-independent Core
  - Evidence beats claims
  - Safety cannot be weakened from a Workspace
  - The runtime is replaceable
