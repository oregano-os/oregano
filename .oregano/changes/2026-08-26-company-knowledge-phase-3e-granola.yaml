migration: >-
  Add a new exact maintained Connector registration only. No existing Source,
  event, envelope, receipt, policy, or database-manifest identity changes.
  Activation requires a V2 meeting/hybrid requirement, exact qualified active
  Instance binding, API-key and webhook-signing SecretRefs, fixed root policy or
  quarantine, and provider scope evidence.
rollback: >-
  Revoke or deactivate the Granola binding and stop accepting deliveries while
  retaining all already accepted Source Events, Raw Evidence, policies,
  receipts, and watermarks. Reconciliation can recover missed events after a
  newly qualified binding is activated.
open_decisions:
  - Live workspace identity must use an attributable Granola administrator receipt because the public API does not independently return a workspace identifier.
  - Large transcripts remain fail-closed until the Instance has a qualified durable Raw Asset adapter.
