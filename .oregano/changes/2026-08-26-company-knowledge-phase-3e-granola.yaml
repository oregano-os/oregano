tests:
  - Standard Webhooks signatures are checked over the exact raw body with bounded timestamp skew before JSON parsing.
  - Supported webhook deliveries persist reference-only Source Events before acknowledgement and replay idempotently.
  - Reconciliation uses updated-after overlap, page size at most 30, provider cursors, and complete-watermark semantics.
  - Webhook and reconciliation identities for one provider revision converge on one immutable Raw Evidence version.
  - Fetch validates note identity, provider update identity, configured folder ancestry, summary, participants, and transcript pagination.
  - Provider errors and rate limits retry within bounds without logging or receipting payloads or credentials.
  - Oversized transcripts fail closed until a durable Raw Asset adapter is qualified.
  - Provider-principal ACL mode is rejected because the public API does not expose sufficient per-note principal evidence.
documentation_impact:
  required: true
  affected_documents:
    - architecture.company-instance
    - architecture.boundaries
    - onboarding.index
    - onboarding.company-workspace
    - plan.company-knowledge-implementation
    - specification.company-instance-release-promotion-v0.1
    - specification.company-knowledge-v0.2
