architecture:
  placement:
    core: Versioned intake, scoped context evidence, job admission, independent
      inspection, and exact-candidate release contracts and execution.
    packages: Reuse reviewed capabilities and the existing Workbench guidance
      distribution; no new company-controlled privileged runtime.
    workspace: Each company owns process definitions, Builder read scope, user
      decisions, approval delegation, and test preferences.
    instance: Each deployment owns provider bindings, secrets, supported release
      execution, infrastructure readiness, and live qualification.
  mechanisms_extended:
    - mechanism: agent-resolver
      reason: Preserve governed Agent handoff and pass the source request as bounded
        context into Builder intake.
    - mechanism: identity-and-authorization
      reason: Bind intake and release to authenticated humans and current exact
        policy, with scoped requester or Steward acceptance.
    - mechanism: approvals-effects-and-idempotency
      reason: Retain resolved briefs in immutable jobs and bind release steps,
        recovery, and live verification to one accepted candidate.
    - mechanism: capability-contracts-and-connectors
      reason: Define provider-neutral release operations and verify actual receipts
        instead of delegating authority to the coding agent.
  new_core_mechanisms:
    - Versioned grounded Builder brief with deterministic context-read and
      unresolved-decision admission checks.
    - Exact-candidate release state machine over replaceable durable storage and
      provider execution.
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: The same intake and release contracts serve every company and
    coding profile. Context comes from the compiled Workspace scope, policy from
    company declarations, and execution from qualified Instance adapters. Tests
    use synthetic companies.
rollback: Stop release admission and restore the prior exact
  Core/Workspace/Instance pairing and production deployment. Retain durable
  operation receipts; reconcile uncertain provider mutations before any retry.
  Application rollback does not undo migrations or external effects.
