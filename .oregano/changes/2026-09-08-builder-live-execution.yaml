title: Release Core 0.6.0 with grounded Builder execution and production adoption
objective: Complete trusted GitHub candidate inspection and merge, exact
  Workspace artifact compilation, Vercel production staging and promotion,
  durable operation reconciliation, default chat/worker wiring, and a shared
  qualified coding/Workbench image. Release Core 0.6.0 and Workbench
  0.1.0-experimental.16 for the new Workspace activation and acceptance
  contracts. Preserve the already deployed Slack ownership fixes. Keep all company values in private
  Workspaces and Instance bindings.
non_goals:
  - Require a Preview or a second provider app for every Workspace change.
  - Automatically execute arbitrary schema migrations, bypass repository
    protection, or broaden company production rights.
  - Place pilot company operating data or secret values in public Core.
