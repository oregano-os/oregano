version: 3
plan_id: work-item-credential-identity-2026-09-06
created: "2026-09-06"
title: Requalify hosted work-item credentials before provider access
objective: >-
  Require the hosted Monday Connector configuration to pin the reviewed account,
  member and external-Agent identity, then verify that identity, board access and
  field mappings with the same credential before each Capability invocation.
non_goals:
  - Treat provider metadata as proof that a later write succeeded.
  - Activate a real company, migrate production or infer reviewed identity values.
placement: core
change_class: security
files_expected:
  - .oregano/changes/2026-09-06-work-item-credential-identity.yaml
  - packages/connectors/monday/work-item-qualification.ts
  - packages/connectors/monday/external-agent-qualification.ts
  - packages/connectors/monday/client.ts
  - packages/connectors/monday/connector.ts
  - packages/runner-vercel/src/lib/runtime-connectors.ts
  - packages/cli/src/onboarding.mjs
  - packages/testkit/tests/work-item-credential-identity.test.ts
  - docs/workbench/guides/prepare-an-instance.md
  - packages/cli/content/guides/prepare-an-instance.md
  - docs/specifications/tool-architecture.md
  - docs/operations/workflow-engine.md
  - docs/status/current.md
  - docs/onboarding/README.md
  - docs/onboarding/company-workspace.md
  - docs/_generated/**
tests:
  - packages/testkit/tests/work-item-credential-identity.test.ts
  - packages/testkit/tests/provider-record-evidence.test.ts
  - packages/testkit/tests/work-item-batch-values.test.ts
  - packages/testkit/tests/workflow-effect-review.test.ts
documentation_impact:
  required: true
  affected_documents:
    - guide.prepare-instance
    - specification.tool-architecture
    - operations.workflow-engine
    - status.current
    - onboarding.index
    - onboarding.company-workspace
architecture:
  placement:
    core: Hosted factory requires credential identity and preserves qualified provider receipt evidence.
    packages: Privileged Monday adapter reuses the maintained external-Agent discovery and access normalization.
    workspace: Owns no credentials or provider qualification bypass; workflows continue to use logical bindings.
    instance: Pins non-secret reviewed identities alongside credential SecretRefs for every retained Artifact.
  mechanisms_extended:
    - mechanism: capability-contracts-and-connectors
      reason: Qualify actual same-client identity and resource access before hosted provider invocation.
    - mechanism: identity-and-authorization
      reason: Refuse rotated or remapped provider credentials without widening company authority.
    - mechanism: approvals-effects-and-idempotency
      reason: Preserve content-free qualification metadata in successful and uncertain effect receipts.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Every hosted company can bind its provider credentials to explicit identities without process-specific code.
rollback: Retain the previous deployment. Missing identity on a retained Artifact blocks access; never infer it from the current token.
