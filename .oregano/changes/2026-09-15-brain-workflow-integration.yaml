architecture:
  placement:
    core: Compile conversation-root decisions, expose the single delivered notice receipt to later steps and keep the signed decision callback as the only authority.
    packages: Extend the existing communication.message.publish decision presentation with an optional title and own-thread navigation; the Slack Connector renders both.
    workspace: Chooses whether a decision roots its conversation, the card text, title and labels.
    instance: No binding, permission, secret or schedule change; adoption requires an exact new Core and Workspace pairing.
  mechanisms_extended:
    - mechanism: approvals-effects-and-idempotency
      reason: The existing human decision, delivery receipt and callback now also provide the thread root for later replies.
    - mechanism: capability-contracts-and-connectors
      reason: Additive optional decision presentation fields in the existing publication contract and Slack Connector.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Any Agent can open a private invitation card and continue the resulting conversation in the same thread on any Connector that supports decisions.
rollback: Revert for new Artifacts, or declare explicit threads in Workspaces that need the previous placement; runs pinned to a conversation-root Artifact must finish or be cancelled on the compatible runtime before downgrading.
