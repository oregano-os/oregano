title: Collect typed facts in an assigned workflow conversation
objective: Collect bounded facts with the declared Agent model, route
  authenticated conversation replies, qualify model responses without effects,
  and obtain a separate human decision before the existing effect; start enabled
  leaf workflows from Workspace intake selections. Remove the retired domain
  executor after preserving its reusable assertions in the declared-workflow
  coverage.
non_goals:
  - Add business selection rules or a provider-specific conversation engine.
  - Infer consent from model output or activate production.
