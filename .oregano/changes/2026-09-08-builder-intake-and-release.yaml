created: "2026-09-08"
title: Implement grounded Builder intake and exact-candidate release coordination
objective: >-
  Give the company-facing Builder a scoped Workspace discovery and read path,
  derive desired activation from Workspace presence, compile company acceptance
  policy, require a resolved build brief before coding, and retain that brief in
  durable jobs, correct actual-diff inspection, and implement a provider-neutral
  exact-candidate release coordinator with explicit authorization and verified
  live completion. Keep coding credentials separate from trusted release execution.
non_goals:
  - Activate a real company, create provider resources, merge a company change, or deploy production during this development task.
  - Implement arbitrary company SQL migrations or require a Preview for every change.
  - Add company-specific process decisions or provider credentials to Core.
