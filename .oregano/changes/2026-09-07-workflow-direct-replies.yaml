version: 3
plan_id: workflow-direct-replies-2026-09-07
created: "2026-09-07"
title: Qualify exclusive direct-message workflow routing before delivery
objective: Route original direct-message answers to one active recipient-bound question and reject workflow-only DM publication unless the Instance explicitly owns that recipient's DM route.
non_goals:
  - Change company business rules, model selection, credentials or human decisions.
  - Activate production workflows or silently change another Instance's routing.
placement: core
change_class: security
