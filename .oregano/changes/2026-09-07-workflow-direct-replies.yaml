documentation_impact:
  required: true
  affected_documents:
    - operations.vercel-workflow-runner
    - specification.workflow-execution-v1
    - guide.author-workflow
architecture:
  placement:
    core: Extend existing recipient-bound collection and Slack event selection without adding another workflow engine or authorization mechanism.
    packages: No new Package behavior or domain-specific contract.
    workspace: Own the questions, Skills, collection fields and manual publication instructions.
    instance: Own exact account-and-user DM routes and verify exclusive delivery across shared-app destinations before enabling them.
  mechanisms_extended:
    - mechanism: identity-and-authorization
      reason: Preserve verified provider authors, exact delivered assignments, unique active collection and separate human decisions for root DM replies.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Any company can collect facts from a direct-message root or question thread without a business-specific Agent handoff.
rollback: Restore the previous exact deployment and both Instance route settings together. Preserve original messages, assignments and decisions. Do not treat routing repair as a human response or completed workflow.
