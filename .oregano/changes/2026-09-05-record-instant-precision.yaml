architecture:
  placement:
    core: Validates and compares generic Record instants at their declared precision.
    packages: No Package changes.
    workspace: Continues to declare cutoff values and timestamp fields.
    instance: Preserves exact proof strings in JSONB without a state migration.
  mechanisms_extended:
