version: 1
plan_id: release-v0.4.0-2026-08-27
status: approved
author: codex-agent
created: 2026-08-27
title: Release Oregano v0.4.0 with governed Company Knowledge
objective: >-
  Publish one immutable minor release containing the generic Company Knowledge
  Source, storage, authorization, model, retrieval, promotion, recovery, and
  maintained runtime integration contracts, together with the already approved
  declarative Product Manager Blueprint and isolated non-production Builder ACP
  qualification surface included in the candidate.
non_goals:
  - Change an existing immutable release
  - Claim production recovery or alert evidence before the exact Instance is exercised
placement: core
change_class: security
vision_principles_affected:
  - A company-independent Core
  - Evidence beats claims
  - Safety cannot be weakened from a Workspace
  - The runtime is replaceable
files_expected:
  - .oregano/changes/**
  - INSTALL-COMPANYOS.md
  - docs/**
  - package.json
  - packages/**
  - pnpm-lock.yaml
  - tsconfig.json
  - vercel.json
required_approvals:
  - oregano-maintainer
approvals:
  - role: oregano-maintainer
    approver: fylingpete
    approved_at: 2026-08-27
    evidence: explicit-user-instruction-to-complete-commit-push-and-release-the-company-knowledge-implementation
validation:
  - pnpm companyos plan --check .oregano/changes/2026-08-27-release-v0.4.0.yaml
  - pnpm companyos versions
  - pnpm companyos inspect-core --plan .oregano/changes/2026-08-27-release-v0.4.0.yaml
  - pnpm docs:check
  - pnpm check
  - git diff --check
tests:
  - Core reports 0.4.0 and Workbench reports 0.1.0-experimental.8
  - Existing provider, Tool, Workspace, setup, and runtime tests remain compatible
  - Company Knowledge authorization and production runtime conformance tests pass
  - The declarative Product Manager Blueprint remains inspectable and grants no runtime authority
  - The isolated Builder ACP qualification surface remains non-activatable in production
  - Release inputs contain no Company Workspace credential or provider payload
documentation_impact:
  required: true
  affected_documents:
    - vision.companyos
    - reference.glossary
    - architecture.company-instance
    - architecture.company-workspace
    - architecture.workbench
    - architecture.ecosystem-packages
    - architecture.oregano-core
    - architecture.overview
    - architecture.boundaries
    - governance.versioning
    - onboarding.index
    - onboarding.company-workspace
    - plan.company-knowledge-implementation
    - plan.builder-acp-mvp-implementation
    - specification.company-instance-release-promotion-v0.1
    - specification.company-knowledge-v0.1
    - specification.company-knowledge-v0.2
    - specification.tool-architecture
    - status.current
    - command.build
    - command.knowledge
    - command.setup
    - command.verify-live
    - guide.author-company-knowledge
    - guide.connect-knowledge-source
    - guide.operate-knowledge-provider
    - guide.prepare-instance
    - guide.recover-company-knowledge
    - guide.review-company-knowledge
    - workbench.overview
migration: >-
  This pre-1.0 minor release adds operating capabilities and requires each
  Company Workspace to opt in with explicit Tool grants, capability allowlists,
  exact Instance bindings, and an immutable 0.4.0 compatibility pin. Existing
  0.3.2 Workspaces and deployments continue unchanged.
rollback: >-
  Keep or promote the prior immutable 0.3.2 Artifact and remove the new
  Workspace grants and Instance bindings. Preserve retained Source evidence and
  schema rows; rollback does not authorize deletion.
open_decisions: []
