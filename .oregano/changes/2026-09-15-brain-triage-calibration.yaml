    core: Preserve existing capability validation, model routing, attempt accounting and no-write completion checks; raise the documented language-host output ceiling to 12000 tokens.
    packages: Clarify reusable triage instructions with source-grounded significance rather than tone or metadata alone.
    workspace: Retain company perspective, selected sources and configured thresholds and model limits.
    instance: Execute bounded model qualification using existing credentials and record all attempts separately from historical import completion.
