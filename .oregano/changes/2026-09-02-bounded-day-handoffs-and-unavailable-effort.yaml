version: 2
plan_id: bounded-day-handoffs-and-unavailable-effort-2026-09-02
status: approved
author: codex-agent
created: 2026-09-02
title: Add local-day handoff expiry and honest unavailable Sprint effort
objective: >-
  Extend the provider-neutral v0.5.4 candidate so a reviewed Workspace can
  expire one Conversation Assignment at the next local day boundary and can
  represent a deliberately unavailable Sprint effort metric without treating
  missing values as zero.
non_goals:
  - Add a real company person, timezone, Agent, board, channel, holiday, schedule, or model value to Core.
  - Change, deploy, migrate, synchronize, or activate a Company Workspace or Company Instance.
  - Send a provider message, mutate a work item, publish a release, or change a production database.
  - Infer actual effort from planned effort, status, message text, or missing values.
placement: core
change_class: security
vision_principles_affected:
  - A company-independent Core
  - Evidence beats claims
  - Safety cannot be weakened from a Workspace
  - Files are the review surface
  - Documentation is part of the system
files_expected:
  - .oregano/changes/2026-09-02-bounded-day-handoffs-and-unavailable-effort.yaml
  - docs/architecture/oregano-core.md
