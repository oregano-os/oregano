version: 3
plan_id: records-build-admission-2026-09-12
created: 2026-09-12
title: Compile approved Records evidence without self-referential Git pins
objective: Release Core 0.15.0 and Workbench experimental.23 for the new canonical Records build-input contract. Let the canonical Instance declaration pin a non-secret Records build input by digest. Resolve exact build identities into the existing immutable Artifact snapshot, keeping provider receipts outside Git and preserving the same admission in later Builder releases.
non_goals:
  - Add provider access, invent qualification, change business semantics or mutate the database schema.
  - Accept ambient unpinned configuration or weaken historical Artifact identity checks.
placement: core
change_class: security
