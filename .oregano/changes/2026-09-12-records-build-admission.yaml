documentation_impact:
  required: true
  affected_documents: [reference.instance-configuration, operations.vercel-workflow-runner, command.build, specification.workflow-execution-v1, status.current]
architecture:
  placement:
    core: Extend the existing trusted compiler with digest-pinned non-secret Records inputs and deterministic build-identity binding.
    packages: Preserve connector and Artifact snapshot contracts; no new provider adapter.
    workspace: Pin the approved input digest in the canonical Instance file; continue to own source semantics.
    instance: Supply existing qualified admission evidence outside Git; retain full resolved snapshots in existing Artifacts.
  mechanisms_extended: []
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: Any company using hosted Records workflows needs a reproducible snapshot without its containing Git commit referring to itself.
rollback: Keep affected workflows disabled and use the preceding compatible deployment. Preserve records and run evidence. No schema migration or provider writes.
