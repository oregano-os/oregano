architecture:
  placement:
    core: Generic workflow execution, conversation coordination, governed Builder runtime and
      source-pinned deployment contracts.
    packages: Use existing runtime, Workbench, provider connectors and neutral conformance fixtures.
    workspace: Consumer migration preserves reviewed business behavior while adopting declared workflows
      and an exact compatible Core pin.
    instance: No live change; require qualified state, exact environment and source bindings, retained
      artifacts and rollback before adoption.
  mechanisms_extended:
    - mechanism: agent-resolver
      reason: Use shared conversation ownership and existing Agent routes.
    - mechanism: toolset-resolver
      reason: Preserve resolved grants for workflow steps and Builder tests.
    - mechanism: model-recipe-resolver
      reason: Use bounded tool-capable model recipes and checked coordinator completion.
    - mechanism: company-records
      reason: Keep complete fresh reads, source identities and retained qualifications.
    - mechanism: identity-and-authorization
      reason: Separate per-instance and per-candidate state and authorize every concern.
    - mechanism: timers-and-business-time
      reason: Execute declared schedules through existing durable timers.
    - mechanism: approvals-effects-and-idempotency
      reason: Preserve approval receipts, effect recovery and isolated candidate evidence.
    - mechanism: capability-contracts-and-connectors
      reason: Retain provider-neutral contracts and compatible record snapshots.
  new_core_mechanisms:
    - Generic declared Workflow Engine and durable concern coordination already implemented in the
      integrated candidate.
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: The same workflow, conversation and Builder contracts operate across companies;
    all public test data is synthetic.
rollback: Retain the preceding immutable Core/Workspace Artifact and production deployment. The
  additive database upgrade preserves legacy records but the new runtime cannot execute old Sprint
  artifacts. Drain or resolve in-flight legacy work before adoption; source/deployment rollback does
  not rewind database state or undo provider effects. Requalify the old runtime against the
  resulting schema before promising runtime rollback.
