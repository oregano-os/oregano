version: 2
plan_id: monday-external-agent-record-source-2026-09-01
status: implemented
author: codex-agent
created: 2026-09-01
title: Make the external Monday Agent the only maintained Monday identity
objective: >-
  Qualify Company Records through one Instance-owned external Monday Agent.
  Prove the exact Agent identity, account, resource grants, API contract, and
  selected board metadata without retaining credentials or performing a
  provider write.
non_goals:
  - Create, activate, disconnect, or change an external Monday Agent.
  - Add, update, or remove a Monday board or document grant.
  - Synchronize provider objects, migrate a production database, deploy, or activate a schedule.
  - Store an Agent API token, signing secret, provider payload, or company identifier in Oregano Core.
placement: core
change_class: security
vision_principles_affected:
  - A company-independent Core
  - Human authority is explicit
  - Evidence beats claims
  - The runtime is replaceable
  - Onboarding has no hidden steps
  - Documentation is part of the system
