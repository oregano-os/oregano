architecture_assessment:
  responsibilities:
    core:
      - Own generic external-Agent identity and resource-grant qualification, safe receipt persistence, exact API-version enforcement, and the maintained Monday adapter.
    packages:
      - No Blueprint or third-party Package change is required.
    workspace:
      - Own logical Monday resources, source mappings, access policy, and company-specific read versus read-write intent.
    instance:
      - Own the exact Monday Agent ID, API token SecretRef, signing secret, account, provider grants, binding, environment, and operational receipts.
  existing_mechanisms:
    - mechanism: agent-resolver
      decision: reuse
      reason: The same external Agent identity remains the trusted Monday conversational ingress; record qualification does not perform conversational routing.
    - mechanism: toolset-resolver
      decision: reuse
      reason: Resource qualification does not grant an Agent a CompanyOS Tool; later work-item effects still require compiled Tool grants and exact bindings.
    - mechanism: model-recipe-resolver
      decision: not-applicable
      reason: Qualification is deterministic and invokes no model.
    - mechanism: company-records
      decision: extend
      reason: Company Records accepts one credential-bearing Instance Connector while keeping synchronized data and provider authority outside the Workspace.
    - mechanism: identity-and-authorization
      decision: reuse
      reason: The provider token must identify an external Agent and its exact resource grants; it never substitutes for a human principal or effect approval.
    - mechanism: timers-and-business-time
      decision: not-applicable
      reason: Qualification activates no schedule.
    - mechanism: approvals-effects-and-idempotency
      decision: reuse
      reason: Plan and apply remain digest-bound; provider qualification is read-only and later writes preserve confirmation, version, allowlist, and read-after-write controls.
    - mechanism: capability-contracts-and-connectors
      decision: extend
      reason: The maintained Monday Connector standardizes one external-Agent authentication mode and fails closed on identity, grant, resource, or API-contract drift.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: >-
    Every Company Instance supplies its own Agent identity, SecretRef, and
    exact resource expectations. Core validates the same provider contract for
    any company and contains no real account, board, person, or policy value.
validation:
  - pnpm companyos plan --check .oregano/changes/2026-09-01-monday-external-agent-record-source.yaml
  - pnpm companyos inspect-core --base ecf6f50d4195eba7a72e77cbe691768b70cf6dc6 --plan .oregano/changes/2026-09-01-monday-external-agent-record-source.yaml
  - pnpm docs:generate
  - pnpm docs:check
  - pnpm public:check
  - pnpm typecheck
  - pnpm runner:typecheck
  - pnpm test
  - git diff --check
tests:
  - Planning records only exact Agent, board-access, API-version, Core identity, and SecretRef expectations and performs no provider call.
  - A wrong confirmation hash performs no secret resolution and no provider call.
  - Qualification accepts only external_agent_member or external_agent_detached_member and matches the Agent ID parsed from the provider identity.
  - Qualification fails closed on an absent, extra, or wrong-permission Agent resource grant and on a missing selected board.
  - The roles-style read grant and Sprint-style read-write grant are distinguished while discovery itself remains read-only.
  - Qualification and synchronization send API-Version dev, retain no credential, and emit payload-free receipts.
  - The maintained source Connector accepts only a matching external-Agent receipt and denies undeclared boards.
  - No parallel Monday authorization command, state, secret name, or documentation remains in the maintained tree.
documentation_impact:
  required: true
  affected_documents:
    - architecture.company-instance
    - specification.company-records-sprint-v0.1
    - status.current
    - command.records
    - guide.connect-company-record-source
rollback: >-
  Revert this change before activating an affected Company Instance. Existing
  external Agent credentials and provider grants remain unchanged. Introducing
  another provider identity would require a new reviewed Core Change Plan and
  is not part of rollback.
open_decisions:
  - Monday's Agent API is pre-release and requires API-Version dev; every activation must requalify this contract and block on provider drift.
  - Production synchronization, webhook activation, and work-item effects remain separately approved Instance operations.
