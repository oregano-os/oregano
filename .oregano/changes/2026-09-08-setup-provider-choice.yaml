architecture:
  placement:
    core: Standard Workbench sessions, scoped setup decisions, deterministic
      rendering, versioned fresh evidence, provider orchestration, and release
      acquisition.
    packages: Reuse existing starter, model recipes, and private provider adapters;
      no new workflow engine or public plugin API.
    workspace: Generated company identity, responsible human, Tool-free operating
      starter, and future governance.
    instance: Private account scope, credentials, resource and deployment receipts,
      current provider checks, and qualification evidence.
  mechanisms_extended:
    - mechanism: identity-and-authorization
      reason: Resolve provider identities and record one responsible human's exact
        initial setup decision.
    - mechanism: approvals-effects-and-idempotency
      reason: Bind first deployment to the reviewed setup scope and preserve intents,
        receipts, and safe resume.
    - mechanism: model-recipe-resolver
      reason: Generate maintained model defaults and supported route metadata from one
        recipe registry.
    - mechanism: capability-contracts-and-connectors
      reason: Reuse provider lifecycle and secret transports with automatic discovery
        and fresh initialization.
  new_core_mechanisms: []
  boundary_assertions:
    company_values_in_core: false
    secrets_in_git: false
    public_fixtures: synthetic-only
  core_reusability: One standard flow serves any new company; exact identities and
    costs remain private and initial setup authority cannot authorize later
    production changes.
rollback: Revert the provider-selection changes for future setup. Preserve
  running installations and exact earlier candidate packages and private setup
  receipts.
