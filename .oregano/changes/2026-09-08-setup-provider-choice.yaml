title: Integrate setup repairs and require an explicit model provider
objective: Integrate the authorized standard setup, unpublished candidate path
  and provider-compatibility repairs with current main. Require OpenAI or
  Anthropic selection in every new standard setup, use direct APIs and existing
  model defaults, offer other supported recipes only on request, and keep one
  exact resource/cost decision.
non_goals:
  - Merge or release Core to production.
  - Change another worktree or its uncommitted work.
  - Adopt or replace an existing company installation.
  - Claim skipped database tests or simulated provider runs as live evidence.
  - Change provider bindings or secrets in an existing live installation.
