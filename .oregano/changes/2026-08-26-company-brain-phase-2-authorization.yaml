migration: >-
  Add a new immutable companyos-postgres manifest version. Apply only additive
  principal-group, membership, and access-decision tables plus required indexes
  and reserved quarantine-administrator policy entries. Persist bundle policies
  and object policy references without changing prior manifest identities. The
  linked production Instance was prepared twice through vercel env run and
  independently qualified read-only as companyos-postgres@1.2.0 with digest
  c93be83156e9f6333fdc7ce492cee9704ae22184e99a0102d56bb3fac50d40f2,
  12 control tables, 48 Knowledge tables including pgvector, and 19 Core Page
  types.
rollback: >-
  Disable Agent-facing Knowledge capabilities and continue serving no protected
  Brain content. Retain additive schema objects, access evidence, policies, and
  prior manifest rows. Never fall back to unfiltered retrieval.
