  - pnpm companyos inspect-core --plan .oregano/changes/2026-08-26-company-brain-phase-2-authorization.yaml
  - pnpm docs:check
  - pnpm typecheck
  - node --experimental-strip-types --test packages/testkit/tests/company-brain-authorization.test.ts packages/testkit/tests/company-knowledge.test.ts packages/testkit/tests/company-database-bootstrap.test.ts
  - pnpm check
  - git diff --check
  - run production database bootstrap twice through vercel env run
  - run production database verify in a separate read-only process
tests:
  - Missing, inactive, unresolved, and revoked identities fail closed and emit no protected payload.
  - Policy inheritance uses intersection semantics and rejects widening children.
  - Explicit denies override allows and quarantine requires the reserved Knowledge administrator group.
  - Lexical and vector candidates are policy-filtered before ranking and fusion.
  - Graph traversal reveals neither protected nodes nor adjacency counts through edges.
  - Exact get, citations, review queues, and Tool outputs never expose an unauthorized document.
  - Runtime subject identity is resolved against the active roster and groups are Core-derived.
  - Access-decision events contain identity, policy, permission, outcome, and reason but no content payload.
  - The historical database manifests remain immutable and the Phase 2 manifest upgrade is additive and idempotent.
  - Production qualification matches manifest 1.2.0, its exact digest, 12 control tables, 48 Knowledge tables including the vector projection, and 19 Core Page types.
