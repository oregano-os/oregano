version: 1
plan_id: company-brain-phase-2-authorization-2026-08-26
status: approved
author: codex-agent
created: 2026-08-26
title: Complete Company Brain Phase 2 authorization
objective: >-
  Enforce fail-closed, identity-aware authorization across every Agent-facing
  Company Brain read path. Add stable principal and group mappings, required
  source-root policies, narrowing-only inheritance, policy-intersection
  evaluation, payload-free access-decision evidence, and administrator-only
  quarantine access. Filter lexical, semantic, graph, citation, review, and
  model-context candidates before protected content can be ranked or exposed.
  Apply and independently qualify the additive Phase 2 database manifest on
  the linked production Company Instance through its approved secret transport.
non_goals:
  - Add new ingestion providers, extraction models, synthesis generation, or retention cleanup.
  - Grant a principal or group access merely because it can invoke a Knowledge Tool.
  - Delete, rewrite, or weaken existing company data or prior manifest ledger rows.
placement: core
change_class: security
vision_principles_affected:
  - A company-independent Core
  - Explicit boundaries over implicit coupling
  - Evidence beats claims
  - Secure and governed by default
  - One database and one authority model
