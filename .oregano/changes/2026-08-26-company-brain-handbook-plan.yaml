version: 1
plan_id: company-brain-handbook-plan-2026-08-26
status: approved
author: codex-agent
created: 2026-08-26
title: Replace the Company Knowledge plan with the Company Brain and Handbook target
objective: >-
  Replace the prior Company Knowledge implementation plan with one detailed,
  approved target that adds automatic, provenance-bound Brain writes, a
  versioned base taxonomy with all 19 Page types, principal-scoped Facts,
  durable single-Holder Takes, separate participant relations, deterministic
  graph links, reviewable cross-source identity, selective authority review,
  proposal-gated model-derived Takes and Claim resolutions, governed Handbook
  promotion, normative retrieval and synthesis, scoped compounding phases,
  sensitive-data authorization in the first product version, and bounded
  temporary stop-buffer and Session Corpus retention with optional durable
  conversation archives while preserving one Neon/Postgres database and
  singular Handbook authority. Define provider-neutral first-time StateStore
  provisioning, connection binding, empty-database bootstrap, later schema
  upgrades, and non-secret qualification evidence, while keeping Vercel-specific
  execution inside the maintained setup profile. Define Source Connector 2.0,
  normalized pull, webhook, and hybrid delivery, a governed Connector registry
  and Instance-binding lifecycle, one shared Raw Evidence pipeline, backward-
  compatible GitHub migration, Granola as the first maintained hybrid Connector,
  and local and Session Sources without requiring arbitrary in-process Connector
  loading. Define provider-neutral model task profiles, a Core Prompt Registry,
  deterministic-first model-use cascades, one compiled Knowledge Answer
  Contract, and separate interactive Agent, explicit synthesis, and durable
  working-synthesis paths.
non_goals:
  - Implement the planned schema, runtime, connector, retrieval, or authorization changes in this documentation-only change.
  - Modify the current normative Company Knowledge specification before its separately inspected implementation phase.
  - Introduce a second database, runtime, or control plane.
  - Mount an external knowledge database as a second Brain or authority.
  - Make model-generated Brain content authoritative.
  - Let fuzzy identity or semantic similarity commit an unreviewed material merge.
placement: core
change_class: security
vision_principles_affected:
  - A company-independent Core
  - Human authority is explicit
  - Evidence beats claims
  - Knowledge authority stays reviewed and singular
files_expected:
