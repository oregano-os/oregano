version: 1
plan_id: builder-agent-mvp-2026-08-26
status: approved
author: codex-agent
created: 2026-08-26
title: Implement the proposal-only Builder Agent MVP
objective: >-
  Implement deterministic Company Agent resolution and the proposal-only
  Builder path with persistent jobs, portable isolated execution, private ACP
  v1 profiles, provider-neutral repository source and publication contracts,
  and the first maintained Vercel Sandbox and GitHub provider boundaries.
non_goals:
  - Grant the Builder merge, deployment, repository-administration, or production-state authority.
  - Use ACP for normal Company Agent conversations or expose ACP as a public CompanyOS contract.
  - Add model-based Agent routing, dynamic ACP discovery, or automatic Claude-to-Codex fallback.
  - Make Vercel, GitHub, Anthropic, or OpenAI a Company Workspace or Core contract.
  - Graduate beyond proposal-only operation before the supervised pilot evidence exists.
placement: core
change_class: security
vision_principles_affected:
  - A company-independent Core
  - Human authority is explicit
  - Evidence beats claims
  - The runtime is replaceable
  - The Workbench guides every Contributor
  - Documentation is part of the system
