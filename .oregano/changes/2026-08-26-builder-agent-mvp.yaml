validation:
  - pnpm companyos plan --check .oregano/changes/2026-08-26-builder-agent-mvp.yaml
  - pnpm companyos inspect-core --plan .oregano/changes/2026-08-26-builder-agent-mvp.yaml
  - pnpm docs:check
  - pnpm check
  - pnpm builder:check
  - pnpm runner:build
  - node --experimental-strip-types packages/runner-vercel/src/lib/builder/qualify-brokered-acp.ts claude-code
  - node --experimental-strip-types packages/runner-vercel/src/lib/builder/qualify-brokered-acp.ts codex
  - git diff --check
tests:
  - Agent resolution is deterministic for exact bindings, thread inheritance, explicit defaults, unknown routes, and ambiguity.
  - Builder jobs are idempotent, leased atomically, recoverable after stale leases, cancellable, and terminal-state safe.
  - Repository source adapters materialize an exact commit without credentials, remotes, or provider SDK values in the coding workspace.
  - Proposal publishers reject unchecked input and publish at most one proposal per Builder job.
  - Optional proposal target branches are validated, stored immutably in the job, shown during confirmation, and enforced together with the exact base commit.
  - Claude Code and Codex use exact ACP v1 profiles inside the portable Builder worker and pass brokered-authentication qualification.
  - Duplicate execution delivery, provider timeout, cancellation, cleanup, and credential isolation fail closed.
  - Invalid, protected, or unvalidated diffs create no branch or pull request.
documentation_impact:
  required: true
  affected_documents:
    - reference.glossary
    - architecture.overview
    - architecture.oregano-core
    - architecture.company-instance
    - architecture.boundaries
    - specification.builder-governance
    - specification.companyos-core-v0.7
    - onboarding.index
    - onboarding.company-workspace
    - workbench.overview
    - status.current
    - compatibility.index
rollback: >-
  Disable the Builder binding in the Company Instance, stop and dispose any
  active Builder sandboxes, revoke the Repository Provider installation, and
  remove the Builder integration while retaining non-secret job and proposal
  evidence. No published proposal is merged or deployed automatically.
