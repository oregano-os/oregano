version: 1
plan_id: release-v0.5.0-2026-08-31
status: approved
author: codex-agent
created: 2026-08-31
title: Release Oregano v0.5.0 with productized Company Brain operations
objective: >-
  Publish one immutable minor Core release containing Retrieval V3, Current
  Briefs, KnowledgeBench, Knowledge Doctor, deterministic derived operating
  views, the guarded Oregano HQ production-canary adapter, the production
  quality follow-up, and the conservative hourly nightly Compounding schedule.
non_goals:
  - Make Retrieval V3 the default for every Company Instance.
  - Treat Current Briefs or other Working Syntheses as Handbook authority.
  - Remove or rewrite the immutable v0.4.0 release.
  - Claim general production qualification from the Oregano HQ internal canary.
placement: core
change_class: security
vision_principles_affected:
  - A company-independent Core
  - Evidence beats claims
  - Knowledge authority stays reviewed and singular
  - The runtime is replaceable
  - Documentation is part of the system
files_expected:
  - .oregano/changes/**
  - docs/**
  - package.json
  - packages/**
  - vercel.json
required_approvals:
  - oregano-maintainer
approvals:
  - role: oregano-maintainer
    approver: fylingpete
    approved_at: 2026-08-31
    evidence: explicit-user-instruction-in-codex-task-to-commit-push-release-and-deploy-the-new-brain
validation:
  - node packages/cli/src/cli.mjs plan --check .oregano/changes/2026-08-31-release-v0.5.0.yaml
  - node packages/cli/src/cli.mjs versions packages/testkit/fixtures/acme-casas --format json
  - node packages/cli/src/cli.mjs inspect-core --plan .oregano/changes/2026-08-31-release-v0.5.0.yaml
  - node packages/cli/src/cli.mjs docs check
  - node scripts/check-public-boundary.mjs
  - node_modules/.bin/tsc --noEmit
  - node_modules/.bin/tsc --noEmit -p packages/runner-vercel/tsconfig.json
  - node --experimental-strip-types --test packages/testkit/tests/*.test.ts packages/cli/tests/*.test.mjs packages/runner-vercel/src/lib/builder/*.test.ts
  - node_modules/.bin/next build packages/runner-vercel
  - git diff --check
tests:
  - Core reports 0.5.0 and Workbench reports 0.1.0-experimental.9.
  - Retrieval V3, Current Brief, KnowledgeBench, Doctor, source, projection, canary, and rollback suites pass.
  - Existing V2 fallback, authorization, citation, Handbook authority, provider, Tool, Workspace, setup, and runtime tests remain compatible.
  - Both maintained Vercel manifests schedule hourly Compounding only in the bounded nightly window.
  - Release inputs contain no Company Workspace credential, source payload, query, or excerpt.
documentation_impact:
  required: true
  affected_documents:
    - status.current
    - workbench.overview
migration: >-
  This pre-1.0 minor release adds optional Retrieval V3 projection state under
  additive companyos-postgres@1.7.0 tables and new guarded runtime bindings.
  Existing v0.4.0 Company Instances remain on Retrieval V2 and their existing
  schema until an operator rehearses, qualifies, and explicitly activates the
  new projection and canary path. Company Workspaces must update their exact
  Core and Workbench compatibility pins before building with v0.5.0.
rollback: >-
  Restore retrieval mode v2, deploy or promote the immutable v0.4.0 Artifact,
  and keep the prior active projection. Additive 1.7.0 tables, durable Source
  evidence, Claims, synthesis history, and receipts remain preserved and
  dormant; rollback does not authorize their deletion.
open_decisions: []
