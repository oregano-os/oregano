title: Record agent-recommended Builder tests and the next interactive increment
objective: >-
  Save Build request terminology, evidenced progress, one result card and an
  Agent-recommended test explained in ordinary language. Keep interaction,
  effects and environment as internal dimensions. Prioritize interactive Agent
  tests without Tools and explicitly defer simulation and broader environments.
non_goals:
  - Implement runtime behavior, change bundled Agent instructions or migrate the brief schema.
  - Deploy Core, modify a company, or execute a test or release.
  - Implement simulation or broaden provider permissions and business effects.
