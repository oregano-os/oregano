version: 3
plan_id: builder-test-experience-spec-2026-09-09
created: "2026-09-09"
title: Implement guided Builder progress, unified results and interactive Agent tests
objective: >-
  Implement Build request terminology, observed coding-start progress, a durable
  unified result card and Agent-recommended testing. Add bounded interactive
  candidate conversations without Tools, fresh tests without recoding and exact
  completed-result publication. Keep simulation and broader test modes deferred.
non_goals:
  - Implement simulation, general workflow dialogs, Preview provisioning or bounded live trials.
  - Broaden provider permissions or allow conversational Tools in the interactive test.
  - Automatically approve a human's result or activate an untested company change.
