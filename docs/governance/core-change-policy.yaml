version: 2
review_mode: maintainer
core_defaults:
  may_only_tighten: true
change_plan:
  current_version: 3
  # The merged pull request that carries the plan is its approval and its
  # implementation record. Version 3 plans store no status and no approvals.
  approval: pull-request-merge
  version_2_cutoff: "2026-09-05"
architecture_assessment:
  required_from: "2026-09-01"
  existing_mechanisms:
    - agent-resolver
    - toolset-resolver
    - model-recipe-resolver
    - company-records
    - identity-and-authorization
    - timers-and-business-time
    - approvals-effects-and-idempotency
    - capability-contracts-and-connectors
documentation_contracts:
  maintained_live_setup:
    paths:
      - packages/cli/src/live-setup.mjs
      - packages/cli/src/live-database-proof.mjs
      - packages/cli/src/setup/**
      - packages/runner-vercel/src/lib/setup-verification.ts
    required_documents:
      - onboarding.index
      - onboarding.company-workspace
      - architecture.company-instance
      - architecture.boundaries
      - specification.company-instance-release-promotion-v0.1
      - status.current
      - command.setup
      - command.verify-live
    required_files:
      - INSTALL-COMPANYOS.md
change_classes:
  content:
    paths:
      - docs/**
      - spec/**
      - README.md
      - INTEGRATIONS.md
      - ONBOARDING.md
      - packages/*/README.md
  behavior:
    paths:
      - packages/**
      - templates/**
      - package.json
      - pnpm-lock.yaml
      - vercel.json
      - pnpm-workspace.yaml
      - tsconfig.json
      - .gitignore
  security:
    paths:
      - .oregano/**
      - .github/**
      - AGENTS.md
      - BOOTSTRAP_FOR_AGENTS.md
      - INSTALL-COMPANYOS.md
      - CLAUDE.md
      - release-manifest.json
      - scripts/**
      - core/**
      - docs/vision.md
      - docs/architecture/**
      - docs/governance/**
      - docs/onboarding/**
      - docs/specifications/**
      - ONBOARDING.md
      - packages/cli/src/**
      - packages/runner/interfaces.ts
      - packages/state-store/**
      - packages/state-postgres/**
      - package.json
      - pnpm-lock.yaml
    approval: oregano-maintainer
    change_plan: required
    inspection: required
