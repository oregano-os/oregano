name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: core-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release checks
        run: |
          pnpm check
          pnpm runner:build
        env:
          COMPANYOS_SKIP_DATABASE_TESTS: "1"

      - name: Prepare versioned agent-install assets
        run: node scripts/prepare-release-assets.mjs dist/release

      - name: Verify reviewed branch ancestry
        run: git merge-base --is-ancestor HEAD origin/main

      - name: Create draft GitHub Release with all assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/release/INSTALL-COMPANYOS.md \
            dist/release/BOOTSTRAP_FOR_AGENTS.md \
            dist/release/release-manifest.json \
            --verify-tag \
            --title "Oregano $GITHUB_REF_NAME" \
            --generate-notes \
            --draft

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          fi

      - name: Verify published GitHub Release is immutable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            -H "X-GitHub-Api-Version: 2026-03-10" --jq .immutable)" = "true"
