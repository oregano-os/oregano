name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.18
        env:
          POSTGRES_USER: companyos_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: companyos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U companyos_test -d companyos_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    environment: core-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release checks
        run: |
          pnpm check
          pnpm runner:build

      - name: Required Postgres integration proofs (no skips)
        run: pnpm test:database
        env:
          COMPANYOS_TEST_DATABASE_URL: postgresql://companyos_test:local-test-only@127.0.0.1:5432/companyos_test

      - name: Prepare versioned agent-install assets
        run: node scripts/prepare-release-assets.mjs dist/release

      - name: Verify reviewed branch ancestry
        run: git merge-base --is-ancestor HEAD origin/main

      - name: Create draft GitHub Release with all assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/release/INSTALL-COMPANYOS.md \
            dist/release/BOOTSTRAP_FOR_AGENTS.md \
            dist/release/release-manifest.json \
            --verify-tag \
            --title "Oregano $GITHUB_REF_NAME" \
            --generate-notes \
            --draft

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          fi

      - name: Verify published GitHub Release is immutable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            -H "X-GitHub-Api-Version: 2026-03-10" --jq .immutable)" = "true"
