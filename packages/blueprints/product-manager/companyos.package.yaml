    - conversation.read
    - knowledge.record
permissions:
  runtime_code: false
  network: []
  secret_refs: []
tests:
  fixtures:
    - tests/fixtures/feature-candidate.yaml
    - tests/fixtures/no-feature.yaml
    - tests/fixtures/prd-draft.yaml
    - tests/fixtures/untrusted-instructions.yaml
